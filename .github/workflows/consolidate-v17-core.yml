name: Consolidate V17 into core

on:
  push:
    paths:
      - ".github/workflows/consolidate-v17-core.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V17 in Kern integrieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/consolidate_v17.py
          python /tmp/consolidate_v17.py

      - name: Konsolidierung technisch prüfen
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          node --check tests/deployment.spec.js
          grep -F 'const APP_VERSION="17.1.0";' app.js
          grep -F 'function v17RentLedgerCard' app.js
          grep -F 'function actualAdvanceInPeriod' app.js
          grep -F 'app.js?v=1710' index.html
          ! grep -q 'v17-upgrade.js' index.html
          ! grep -q 'v17-hotfix.js' index.html
          ! grep -q 'v17-water.js' index.html
          test ! -e v17-upgrade.js
          test ! -e v17-hotfix.js
          test ! -e v17-water.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Keine Änderung nötig – V17 ist bereits konsolidiert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate V17.1.0 into native core"
          git push

      - name: 19er Live-E2E-Audit starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run e2e-live.yml --ref main
