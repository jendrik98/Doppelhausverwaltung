name: Architecture migration – TypeScript phase 7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase-6-Ausgangslage schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase6.yml
          test -f src/core/integrity.ts
          test -f src/core/traceability.ts
          test -f src/core/persistence.ts
          test -f src/domain/meter-parsing.ts
          test -f src/io/backup-codec.ts
          test ! -e src/domain/property-domain.ts
          test ! -e src/domain/legal-rules.ts
          test ! -e src/domain/billing-domain.ts
          grep -F 'const DOMAIN_VERSION=1;' src/legacy/020-domain.js
          grep -F 'function centralBillingAnalysis' src/legacy/020-domain.js
          grep -F 'const LAW_DATE="2026-09-05";' src/legacy/090-legal-rules.js
          grep -F 'function legalDecision' src/legacy/090-legal-rules.js
          grep -F 'function billingPeriodInfo' src/legacy/100-domain-2.js
          grep -F 'function createBillingSnapshot' src/legacy/100-domain-2.js
          grep -F 'APP_VERSION="18.0.0"' app.js

