      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build, TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp app.js /tmp/app-phase7-first.js
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          node --check src/legacy/020-domain.js
          node --check src/legacy/090-legal-rules.js
          node --check src/legacy/100-domain-2.js
          grep -F 'compiled src/domain/property-domain.ts' app.js
          grep -F 'compiled src/domain/legal-rules.ts' app.js
          grep -F 'compiled src/domain/billing-domain.ts' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Reproduzierbaren Build erzwingen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cmp --silent /tmp/app-phase7-first.js app.js || { echo "FEHLER: Zweiter Build erzeugt eine abweichende app.js."; exit 1; }
          git diff --check

      - name: Fach-, Rechts- und Persistenz-Invarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const DOMAIN_VERSION=1;' src/legacy/020-domain.js
          grep -F '}=AppPropertyDomain;' src/legacy/020-domain.js
          ! grep -F 'function centralBillingAnalysis' src/legacy/020-domain.js
          grep -F 'let ACTIVE_LEGAL_PACK=null;' src/legacy/090-legal-rules.js
          grep -F '}=AppLegalRules;' src/legacy/090-legal-rules.js
          grep -F 'declare let ACTIVE_LEGAL_PACK: any;' src/domain/legal-rules.ts
          grep -F 'ACTIVE_LEGAL_PACK=p;return p' src/domain/legal-rules.ts
          grep -F 'export const LAW_DATE="2026-09-05"' src/domain/legal-rules.ts
          grep -F 'mietverwaltung-legal-pack-v1' src/domain/legal-rules.ts
          grep -F '}=AppBillingDomain;' src/legacy/100-domain-2.js
          grep -F 'ACTIVE_LEGAL_PACK?.version' src/domain/billing-domain.ts
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          test ! -e .github/workflows/architecture-typescript-phase6.yml
          test -f .github/workflows/architecture-typescript-phase7.yml

      - name: Chromium und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Testserver starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Exakt 25 Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Tests, gefunden: ${TOTAL:-unbekannt}"
            exit 1
          fi

      - name: Strenges 25-von-25-Gate
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --retries=0 --reporter=json > /tmp/e2e.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/e2e.json').read_text(encoding='utf-8'))
          stats = report.get('stats') or {}
          expected = int(stats.get('expected', -1))
          unexpected = int(stats.get('unexpected', -1))
          flaky = int(stats.get('flaky', -1))
          skipped = int(stats.get('skipped', -1))
          total = expected + unexpected + flaky + skipped
          print(f"Playwright: total={total}, passed={expected}, failed={unexpected}, flaky={flaky}, skipped={skipped}, retries=0")
          if not (total == 25 and expected == 25 and unexpected == 0 and flaky == 0 and skipped == 0):
              raise SystemExit("FEHLER: Strenges Gate verlangt exakt 25/25 bestanden, 0 Fehler, 0 Flakes, 0 Skips und 0 Retries.")
          PY

      - name: Änderungsumfang kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          echo "Geänderte/neue/gelöschte Dateien:"
          cat /tmp/changed.txt

          for required in \
            .github/workflows/architecture-typescript-phase6.yml \
            ARCHITECTURE.md \
            app.js \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/domain/property-domain.ts \
            src/domain/legal-rules.ts \
            src/domain/billing-domain.ts \
            src/legacy/020-domain.js \
            src/legacy/090-legal-rules.js \
            src/legacy/100-domain-2.js
          do
            grep -Fx "$required" /tmp/changed.txt >/dev/null || { echo "FEHLER: Erwartete Änderung fehlt: $required"; exit 1; }
          done

          ALLOWED='^(\.github/workflows/architecture-typescript-phase6\.yml|ARCHITECTURE\.md|app\.js|scripts/build-app\.mjs|scripts/test-architecture\.mjs|src/domain/property-domain\.ts|src/domain/legal-rules\.ts|src/domain/billing-domain\.ts|src/legacy/020-domain\.js|src/legacy/090-legal-rules\.js|src/legacy/100-domain-2\.js)$'
          if grep -Ev "$ALLOWED" /tmp/changed.txt; then
            echo "FEHLER: Unerwartete Dateiänderung erkannt."
            exit 1
          fi
          test ! -e .github/workflows/architecture-typescript-phase6.yml
          test -f .github/workflows/architecture-typescript-phase7.yml
          git diff --quiet -- .github/workflows/architecture-typescript-phase7.yml

      - name: Phase 7 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/architecture-typescript-phase6.yml \
            ARCHITECTURE.md \
            app.js \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/domain/property-domain.ts \
            src/domain/legal-rules.ts \
            src/domain/billing-domain.ts \
            src/legacy/020-domain.js \
            src/legacy/090-legal-rules.js \
            src/legacy/100-domain-2.js
          git diff --cached --quiet && { echo "FEHLER: Nichts zu committen."; exit 1; }
          git commit -m "Extract core billing domain into TypeScript modules"
          git push
