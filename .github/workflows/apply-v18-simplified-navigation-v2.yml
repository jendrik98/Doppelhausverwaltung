name: Apply V18 simplified navigation preview v2

on:
  push:
    paths:
      - ".github/workflows/apply-v18-simplified-navigation-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Navigation vereinfachen
        shell: bash
        run: |
          ' | base64 -d > /tmp/simplified_nav_patch.py
          python /tmp/simplified_nav_patch.py

      - name: Patch technisch prüfen
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          node --check tests/core-journey.spec.js
          node --check tests/backup.spec.js
          node --check tests/navigation.spec.js
          node --check tests/v18-assistant.spec.js
          node --check tests/navigation-simplified.spec.js
          grep -F 'Mietvertrag / PDF' app.js
          grep -F '{id:"water",label:"Kaltwasser"' app.js
          grep -F '{id:"costs",label:"Kosten"' app.js
          grep -F '{id:"planning",label:"Planung"' app.js
          grep -F '{id:"app",label:"Erweitert"' app.js
          grep -F 'mietverwaltung-v18-simplified-nav-preview-2' service-worker.js
          grep -F 'volle Startseite bleibt erhalten, Fachbereiche sind bewusst schmal' tests/navigation-simplified.spec.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Simplified Navigation Preview ist bereits vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css service-worker.js tests/core-journey.spec.js tests/backup.spec.js tests/navigation.spec.js tests/v18-assistant.spec.js tests/navigation-simplified.spec.js
          git commit -m "Simplify V18 navigation around real duplex workflow"
          git push
