name: Stabilize E2E unit form helper

on:
  push:
    paths:
      - ".github/workflows/stabilize-e2e-unit-helper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flaky Unit-Helper stabilisieren
        shell: bash
        run: |
          echo '' | base64 -d > tests/helpers.js

      - name: Helper prüfen
        shell: bash
        run: |
          node --check tests/helpers.js
          grep -F 'await expect(nameInput).toBeFocused();' tests/helpers.js
          grep -F 'input[name="area"]' tests/helpers.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Der Helper ist bereits stabilisiert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/helpers.js
          git commit -m "Stabilize modal form input E2E helper"
          git push
