name: Stabilize E2E payment form

on:
  push:
    paths:
      - ".github/workflows/stabilize-e2e-payment-form.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Payment-Test synchronisieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/payment_flake_fix.py
          python /tmp/payment_flake_fix.py

      - name: Testdatei prüfen
        shell: bash
        run: |
          node --check tests/core-journey.spec.js
          grep -F 'await expect(dateInput).toBeFocused();' tests/core-journey.spec.js
          grep -F 'await expect(labelInput).toHaveValue(label);' tests/core-journey.spec.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Der Payment-Test ist bereits stabilisiert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core-journey.spec.js
          git commit -m "Stabilize payment modal E2E input"
          git push
