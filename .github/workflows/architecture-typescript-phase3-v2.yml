name: Architecture migration – TypeScript phase 3 v2

on:
  push:
    paths:
      - ".github/workflows/architecture-typescript-phase3-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ausgangslage und V1-Payload prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase3.yml
          test -f src/core/validation.ts
          test -f src/core/feedback.ts
          test -f src/legacy/010-schema.js
          test -f src/legacy/020-domain.js
          grep -F 'APP_VERSION="18.0.0"' app.js
          grep -F 'function localDateISO' src/legacy/010-schema.js
          grep -F 'function normalizeMeterNumber' src/legacy/020-domain.js
          grep -F "/tmp/architecture_phase3.b64" .github/workflows/architecture-typescript-phase3.yml
          grep -F "Phase 3 vorbereitet: State/Datum + Zählerparser" .github/workflows/architecture-typescript-phase3.yml

      - name: Bewährten Phase-3-Patch aus V1 übernehmen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          workflow = Path(".github/workflows/architecture-typescript-phase3.yml").read_text(encoding="utf-8")
          match = re.search(
              r"cat > /tmp/architecture_phase3\.b64 <<'B64PAYLOAD'\n(?P<body>.*?)\n\s*B64PAYLOAD",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit("FEHLER: Phase-3-Payload konnte aus V1 nicht extrahiert werden.")

          payload = "".join(line.strip() for line in match.group("body").splitlines())
          try:
              code = base64.b64decode(payload, validate=True).decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"FEHLER: Phase-3-Payload ist ungültig: {exc}")

          if "Phase 3 vorbereitet: State/Datum + Zählerparser" not in code:
              raise SystemExit("FEHLER: Unerwarteter Phase-3-Payload.")

          compile(code, "architecture_phase3.py", "exec")
          Path("/tmp/architecture_phase3.py").write_text(code, encoding="utf-8")
          print("V1-Payload extrahiert und syntaktisch geprüft.")
          PY

          python3 /tmp/architecture_phase3.py

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build und TypeScript prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run test:validation
          npm run test:architecture

          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs

          grep -F 'compiled src/core/state.ts' app.js
          grep -F 'compiled src/domain/meter-parsing.ts' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Browser und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen App-Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Exakt 25 E2E-Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Tests, gefunden: ${TOTAL:-unbekannt}"
            exit 1
          fi

      - name: Vollständige E2E-Suite
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --retries=0 | tee /tmp/e2e.log
          grep -E '25 passed' /tmp/e2e.log

          if grep -Eiq 'failed|flaky|retry' /tmp/e2e.log; then
            echo "FEHLER: E2E-Ausgabe enthält failed/flaky/retry."
            exit 1
          fi

      - name: Diff inklusive neuer Dateien kontrollieren
        shell: bash
        run: |
          set -euo pipefail

          echo "Git-Status:"
          git status --short

          if git diff --name-only | grep -E '^\.github/workflows/'; then
            echo "FEHLER: Der Bot darf keine Workflow-Datei verändern."
            exit 1
          fi

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed.txt

          echo "Erkannte geänderte und neue Dateien:"
          cat /tmp/changed.txt

          for newfile in \
            scripts/test-architecture.mjs \
            src/core/date.ts \
            src/core/state.ts \
            src/domain/meter-parsing.ts
          do
            test -f "$newfile" || {
              echo "FEHLER: Neue Architekturdatei fehlt physisch: $newfile"
              exit 1
            }
          done

          for required in \
            ARCHITECTURE.md \
            app.js \
            package.json \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/core/date.ts \
            src/core/state.ts \
            src/domain/meter-parsing.ts \
            src/legacy/010-schema.js \
            src/legacy/020-domain.js \
            tsconfig.json
          do
            grep -Fx "$required" /tmp/changed.txt >/dev/null || {
              echo "FEHLER: Erwartete Änderung fehlt: $required"
              exit 1
            }
          done

      - name: Architektur-Migration committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ARCHITECTURE.md \
            app.js \
            package.json \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/core/date.ts \
            src/core/state.ts \
            src/domain/meter-parsing.ts \
            src/legacy/010-schema.js \
            src/legacy/020-domain.js \
            tsconfig.json

          git diff --cached --quiet && {
            echo "FEHLER: Nichts zu committen."
            exit 1
          }

          git commit -m "Extract state and meter parsing into TypeScript modules"
          git push
