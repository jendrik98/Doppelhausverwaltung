name: Architecture migration – TypeScript phase 4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase-3-Ausgangslage schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f src/core/date.ts
          test -f src/core/state.ts
          test -f src/domain/meter-parsing.ts
          test ! -e src/core/persistence.ts
          test ! -e src/io/backup-codec.ts
          grep -F 'APP_VERSION="18.0.0"' app.js
          grep -F 'const DB_NAME="mietverwaltung-v6",DB_VERSION=2,STATE_ID="main"' src/legacy/110-db.js
          grep -F 'mietverwaltung-v81-full-backup' src/legacy/130-backup.js
          grep -F 'mietverwaltung-v75-full-backup' src/legacy/130-backup.js

