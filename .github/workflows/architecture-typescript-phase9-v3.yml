name: Architecture migration – TypeScript phase 9 V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exakten Phase-8-Stand und beide Fehlversuche schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase8.yml
          test -f .github/workflows/architecture-typescript-phase9.yml
          test -f .github/workflows/architecture-typescript-phase9-v2.yml
          test -f .github/workflows/architecture-typescript-phase9-v3.yml
          test ! -e src/ui/ui-core.ts
          test "$(git rev-parse HEAD^)" = "453e753ad5fd09aac995fea019b9f90628a4dd3a"
          test "$(git rev-parse HEAD^^)" = "69c4765d47502e523f09da39b74b5a80f335da6b"
          test "$(git rev-parse HEAD^^^)" = "b0c9019f027162b346d08b0ca0bb6049d052dd1d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-typescript-phase9-v3.yml"
          git diff --name-only b0c9019f027162b346d08b0ca0bb6049d052dd1d HEAD | sort > /tmp/phase9-upload-files.txt
          printf '%s\n' ".github/workflows/architecture-typescript-phase9.yml" ".github/workflows/architecture-typescript-phase9-v2.yml" ".github/workflows/architecture-typescript-phase9-v3.yml" | sort > /tmp/phase9-expected-upload-files.txt
          cmp --silent /tmp/phase9-upload-files.txt /tmp/phase9-expected-upload-files.txt
          test "$(git hash-object ARCHITECTURE.md)" = "e00f170fb2b8df30cbf44d32e47a37b7c8d6a98e"
          test "$(git hash-object scripts/build-app.mjs)" = "883b5bd0629f04d503fdb22ad9ffb9b92e526475"
          test "$(git hash-object scripts/test-architecture.mjs)" = "f3f306b778df6a73d3ac67f24d1af49a3a4ac1da"
          test "$(git hash-object tsconfig.json)" = "7e985bf4fcf2350d7f393cee5203fb6b2f6fa592"
          test "$(git hash-object src/legacy/150-ui.js)" = "c3fd49bcc64a1daaf78034cfc0da5f9c3fc20c44"
          test "$(git hash-object src/legacy/160-app.js)" = "ee33e4db8f9cecb9cd16d8da66e2b59073bfdc91"
          test "$(grep -o 'MODAL_RETURN_FOCUS=null' src/legacy/160-app.js | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'MODAL_RETURN_FOCUS_OVERRIDE=' src/legacy/160-app.js | wc -l | tr -d ' ')" = "1"
          grep -F 'APP_VERSION="18.0.0"' app.js

