      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build, TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp app.js /tmp/app-phase9-first.js
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          node --check src/legacy/150-ui.js
          node --check src/legacy/160-app.js
          grep -F 'compiled src/ui/ui-core.ts' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Reproduzierbaren Build erzwingen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cmp --silent /tmp/app-phase9-first.js app.js || { echo "FEHLER: Zweiter Build erzeugt eine abweichende app.js."; exit 1; }
          git diff --check

      - name: Fach-, Daten- und UI-Invarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const DOMAIN_VERSION=1;' src/legacy/020-domain.js
          grep -F 'export const LAW_DATE="2026-09-05"' src/domain/legal-rules.ts
          grep -F 'mietverwaltung-legal-pack-v1' src/domain/legal-rules.ts
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          grep -F 'export function validateCentralForm' src/ui/ui-core.ts
          grep -F 'export function trapFocusInDialog' src/ui/ui-core.ts
          ! grep -F 'MODAL_RETURN_FOCUS' src/ui/ui-core.ts
          grep -F 'let MODAL_RETURN_FOCUS=null,MODAL_INITIAL_FORM="",MODAL_RETURN_FOCUS_OVERRIDE=null;' src/legacy/150-ui.js
          grep -F 'function closeModal(' src/legacy/150-ui.js
          grep -F 'function modal(' src/legacy/150-ui.js
          grep -F '}=AppUiCore;' src/legacy/150-ui.js
          ! grep -F 'function validateCentralForm' src/legacy/150-ui.js
          grep -F 'MODAL_RETURN_FOCUS=null' src/legacy/160-app.js
          grep -F 'MODAL_RETURN_FOCUS_OVERRIDE=' src/legacy/160-app.js
          test ! -e .github/workflows/architecture-typescript-phase8.yml
          test ! -e .github/workflows/architecture-typescript-phase9.yml
          test ! -e .github/workflows/architecture-typescript-phase9-v2.yml
          test -f .github/workflows/architecture-typescript-phase9-v3.yml
          test -f .github/workflows/e2e-live.yml

      - name: Chromium und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Testserver starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Exakt 25 Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Playwright-Tests, gefunden: ${TOTAL:-0}"
            exit 1
          fi

      - name: Strenges 25-von-25-Gate
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          set +e
          npx playwright test --reporter=json > /tmp/playwright.json
          STATUS=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/playwright.json','utf8'));
          const s=r.stats||{};
          const total=Number(s.expected||0)+Number(s.unexpected||0)+Number(s.flaky||0)+Number(s.skipped||0);
          const retries=(r.suites||[]).flatMap(function walk(xs){return xs.flatMap(x=>[...(x.specs||[]),...walk(x.suites||[])]);}).reduce((n,spec)=>n+(spec.tests||[]).reduce((a,t)=>a+Math.max(0,(t.results||[]).length-1),0),0);
          console.log(`Playwright: total=${total}, passed=${s.expected||0}, failed=${s.unexpected||0}, flaky=${s.flaky||0}, skipped=${s.skipped||0}, retries=${retries}`);
          if(total!==25||s.expected!==25||s.unexpected!==0||s.flaky!==0||s.skipped!==0||retries!==0)process.exit(1);
          NODE
          test "$STATUS" -eq 0

      - name: Änderungsumfang kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD | sort > /tmp/actual-diff.txt
          printf '%s\n' ".github/workflows/architecture-typescript-phase8.yml" ".github/workflows/architecture-typescript-phase9-v2.yml" ".github/workflows/architecture-typescript-phase9.yml" "ARCHITECTURE.md" "app.js" "scripts/build-app.mjs" "scripts/test-architecture.mjs" "src/legacy/150-ui.js" "src/ui/ui-core.ts" "tsconfig.json" > /tmp/allowed-diff.txt
          sort -o /tmp/allowed-diff.txt /tmp/allowed-diff.txt
          echo "Geänderte Dateien:"
          cat /tmp/actual-diff.txt
          cmp --silent /tmp/actual-diff.txt /tmp/allowed-diff.txt || { echo "FEHLER: Unerwarteter Änderungsumfang."; diff -u /tmp/allowed-diff.txt /tmp/actual-diff.txt || true; exit 1; }
          test "$(git diff --numstat HEAD -- src/legacy/160-app.js | wc -l | tr -d ' ')" = "0"

      - name: Phase 9 V3 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Extract stable UI helpers and validation into TypeScript module"
          git push origin HEAD:main
