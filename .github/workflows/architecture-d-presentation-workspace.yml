name: Architecture D – Presentation workspace

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-d-presentation-workspace
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      E2E_BASE_URL: http://127.0.0.1:4173/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten D-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_SHA="ed5b97bd4f18684fdf98c4753c59ad9dbac04ac9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-d-presentation-workspace.yml"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD^
          test -z "$(git diff --name-only "$PRODUCT_SHA" HEAD^ -- . ':(exclude).github/workflows/*')"

          test "$(git hash-object scripts/build-app.mjs)" = "8264c33cbc3527e2397d75180e3e7214e583eed3"
          test "$(git hash-object src/ui/app-runtime.ts)" = "e09d0454430493c681bb00b3305ac8eabd26f648"
          test "$(git hash-object src/runtime/040-traceability.js)" = "10e1bfab210985ce71f79739829951e818f68bbb"
          test "$(git hash-object src/runtime/110-db.js)" = "987211eb31708104b36183bd635f0f9dae653750"
          test "$(git hash-object src/runtime/130-backup.js)" = "2280a024f55547106819b9c944e9430f3ede68ec"
          test "$(git hash-object src/core/traceability.ts)" = "8e2553cd026b91eb42ade1c983f3f1ee4813a1d0"
          test "$(git hash-object package.json)" = "0636026d4180dab9026cdea6dba03e20ca3d1be0"
          test "$(git hash-object index.html)" = "8b789343f6a1b9465b464672788d915de52ba647"
          test "$(git hash-object service-worker.js)" = "d641419043775801808d208d24e4d4c433d7dd70"
          test "$(git hash-object scripts/test-pwa-update.mjs)" = "deb025b28f97dff3440105872ff8ebf92d8ddb22"
          test "$(git hash-object tests/deployment.spec.js)" = "2538c8a3816fde028296ea29397c5e1529f7b1db"
          test "$(git hash-object ARCHITECTURE.md)" = "f9a32928e11914957b868ac8d80390a737219ae8"
          test ! -e src/presentation
          test ! -e scripts/test-presentation-layer.mjs
          test ! -e tests/presentation-workspace.spec.js

      - name: Presentation-D Patch anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, textwrap

          root = Path(".")

          def B(value):
              return textwrap.dedent(value).lstrip("\n")

          def read(path):
              return (root / path).read_text(encoding="utf-8")

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              # Exakte Strings (inkl. beabsichtigter Einrückung) zuerst verwenden.
              if text.count(old) == 1:
                  write(path, text.replace(old, new, 1))
                  return
              # Mehrzeilige eingebettete Literale sind im Workflow selbst eingerückt;
              # dafür kontrolliert dedenten und erneut exakt prüfen.
              dedented_old, dedented_new = B(old), B(new)
              count = text.count(dedented_old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: erwartete genau 1 Fundstelle, gefunden {count}: {dedented_old[:100]!r}"
                  )
              write(path, text.replace(dedented_old, dedented_new, 1))

          write("src/presentation/navigation.ts", B(r'''
          export const ROUTE_LABELS = {
            home: "Start",
            rental: "Vermietung",
            data: "Haus",
            owner: "Finanzen",
            more: "Mehr"
          } as const;

          export type TopRoute = keyof typeof ROUTE_LABELS;

          export const DEFAULT_SUB: Record<Exclude<TopRoute, "home">, string> = {
            data: "overview",
            rental: "overview",
            owner: "overview",
            more: "smart"
          };

          export const SUB_PARENT: Record<string, Record<string, string>> = {
            data: { object: "overview", property: "overview", units: "overview", sources: "costs", positions: "costs", assessment: "costs" },
            rental: { lease: "overview", calculation: "billing", workflow: "billing" },
            owner: { tasks: "overview", cashflow: "payments", reconciliation: "payments", finance: "planning", analytics: "planning" },
            more: { overview: "smart", legal: "app", security: "protection", backup: "protection", recovery: "protection", audit: "app", diagnostics: "app" }
          };

          export function normalizeSub(routeName: string, subName: string): string {
            if (!subName) return DEFAULT_SUB[routeName as keyof typeof DEFAULT_SUB] || "";
            if (routeName === "more" && subName === "overview") return "smart";
            if (routeName === "rental" && (subName === "calculation" || subName === "workflow")) return subName;
            return subName;
          }

          export function visibleSub(routeName: string, subName: string): string {
            return SUB_PARENT[routeName]?.[subName]
              || subName
              || DEFAULT_SUB[routeName as keyof typeof DEFAULT_SUB]
              || "";
          }

          export function parseRouteHash(hash: string): { route: TopRoute; sub: string } {
            const raw = decodeURIComponent(String(hash || "").replace(/^#/, "")).trim();
            const parts = raw.split("/").filter(Boolean);
            const route = Object.prototype.hasOwnProperty.call(ROUTE_LABELS, parts[0])
              ? parts[0] as TopRoute
              : "home";
            const sub = route === "home"
              ? ""
              : normalizeSub(route, parts[1] || DEFAULT_SUB[route as keyof typeof DEFAULT_SUB]);
            return { route, sub };
          }

          export function routeHash(route: string, sub: string | null = null): string {
            const safeRoute: TopRoute = Object.prototype.hasOwnProperty.call(ROUTE_LABELS, route)
              ? route as TopRoute
              : "home";
            if (safeRoute === "home") return "#home";
            return `#${safeRoute}/${encodeURIComponent(sub || DEFAULT_SUB[safeRoute as keyof typeof DEFAULT_SUB])}`;
          }
          '''))

          write("src/presentation/building-workspace.ts", B(r'''
          import {
            buildingScopedCollections,
            portfolioNavigation,
            queryBuildingWorkspace,
            queryTaskList
          } from "../application";

          type AnyRecord = Record<string, any>;

          export const PRESENTATION_VERSION = 1;
          export const ACTIVE_BUILDING_STORAGE_KEY = "mietverwaltung-active-building-v1";

          const clone = <T>(value: T): T => {
            if (typeof structuredClone === "function") return structuredClone(value);
            return JSON.parse(JSON.stringify(value)) as T;
          };

          const records = (value: unknown): AnyRecord[] =>
            Array.isArray(value)
              ? value.filter((item): item is AnyRecord => !!item && typeof item === "object")
              : [];

          function recordBelongsToBuilding(item: AnyRecord, buildingId: string, primaryBuildingId: string): boolean {
            const itemBuildingId = String(item?.buildingId || "");
            return itemBuildingId ? itemBuildingId === buildingId : buildingId === primaryBuildingId;
          }

          export interface BuildingChoice {
            id: string;
            name: string;
            address: string;
            active: boolean;
          }

          export interface PresentationWorkspace {
            portfolioId: string;
            portfolioName: string;
            activeBuildingId: string;
            activeBuildingName: string;
            showBuildingSelector: boolean;
            buildings: BuildingChoice[];
            counts: {
              units: number;
              tenancies: number;
              sources: number;
              costPositions: number;
              meters: number;
              tasks: number;
              payments: number;
            };
          }

          export function resolveActiveBuildingId(state: AnyRecord, requestedBuildingId = ""): string {
            const nav = portfolioNavigation(state);
            const requested = String(requestedBuildingId || "");
            if (requested && nav.buildings.some((item) => String(item.id || "") === requested)) return requested;
            return String(nav.activeBuildingId || nav.buildings[0]?.id || "");
          }

          export function createPresentationWorkspace(state: AnyRecord, requestedBuildingId = ""): PresentationWorkspace {
            const nav = portfolioNavigation(state);
            const activeBuildingId = resolveActiveBuildingId(state, requestedBuildingId);
            const workspace = queryBuildingWorkspace(state, { buildingId: activeBuildingId });
            const active = nav.buildings.find((item) => String(item.id || "") === activeBuildingId) || workspace.building;
            const tasks = queryTaskList(state, { buildingId: activeBuildingId });
            return {
              portfolioId: String(nav.portfolio?.id || ""),
              portfolioName: String(nav.portfolio?.name || "Portfolio"),
              activeBuildingId,
              activeBuildingName: String(active?.name || active?.address || "Gebäude"),
              showBuildingSelector: nav.showBuildingSelector,
              buildings: nav.buildings.map((item) => ({
                id: String(item.id || ""),
                name: String(item.name || item.address || "Gebäude"),
                address: String(item.address || ""),
                active: String(item.id || "") === activeBuildingId
              })),
              counts: {
                units: workspace.units.length,
                tenancies: workspace.tenancies.length,
                sources: workspace.sources.length,
                costPositions: workspace.costPositions.length,
                meters: workspace.meters.length,
                tasks: tasks.length,
                payments: workspace.payments.length
              }
            };
          }

          export function projectStateForBuilding(masterState: AnyRecord, requestedBuildingId = ""): AnyRecord {
            const master = clone(masterState || {});
            const activeBuildingId = resolveActiveBuildingId(master, requestedBuildingId);
            if (!activeBuildingId) return master;

            const primaryBuildingId = String(master?.meta?.primaryBuildingId || activeBuildingId);
            const activeBuilding = records(master.buildings).find((item) => String(item.id || "") === activeBuildingId) || null;
            const projected = clone(master);

            for (const key of buildingScopedCollections()) {
              projected[key] = records(master[key])
                .filter((item) => recordBelongsToBuilding(item, activeBuildingId, primaryBuildingId))
                .map((item) => ({ ...clone(item), buildingId: String(item.buildingId || activeBuildingId) }));
            }

            projected.meta = {
              ...(projected.meta || {}),
              primaryBuildingId: activeBuildingId,
              presentationBuildingId: activeBuildingId
            };

            projected.property = {
              ...(projected.property || {}),
              name: String(activeBuilding?.name || ""),
              address: String(activeBuilding?.address || ""),
              totalArea: Number(activeBuilding?.totalArea || 0),
              year: activeBuilding?.year || "",
              billingTakeoverDate: activeBuilding?.billingTakeoverDate || "",
              predecessorBillingEnd: activeBuilding?.predecessorBillingEnd || ""
            };

            if (activeBuilding?.finance && typeof activeBuilding.finance === "object") {
              projected.finance = clone(activeBuilding.finance);
            } else if (activeBuildingId !== primaryBuildingId) {
              projected.finance = { repayment: 0, fixed: 0 };
            }

            return projected;
          }

          export function mergeStateFromBuilding(masterState: AnyRecord, scopedState: AnyRecord, requestedBuildingId = ""): AnyRecord {
            const master = clone(masterState || {});
            const scoped = clone(scopedState || {});
            const activeBuildingId = resolveActiveBuildingId(
              master,
              requestedBuildingId || scoped?.meta?.presentationBuildingId || scoped?.meta?.primaryBuildingId
            );
            if (!activeBuildingId) return scoped;

            const primaryBuildingId = String(master?.meta?.primaryBuildingId || activeBuildingId);
            const scopedKeys = new Set(buildingScopedCollections());
            const result = clone(master);

            for (const key of scopedKeys) {
              const keep = records(master[key]).filter(
                (item) => !recordBelongsToBuilding(item, activeBuildingId, primaryBuildingId)
              );
              const changed = records(scoped[key]).map((item) => ({
                ...clone(item),
                buildingId: String(item.buildingId || activeBuildingId)
              }));
              result[key] = [...keep, ...changed];
            }

            for (const [key, value] of Object.entries(scoped)) {
              if (scopedKeys.has(key)) continue;
              if (["property", "finance", "portfolios", "buildings"].includes(key)) continue;
              result[key] = clone(value);
            }

            result.portfolios = clone(master.portfolios || []);
            result.buildings = clone(master.buildings || []);

            const scopedBuilding = records(scoped.buildings).find((item) => String(item.id || "") === activeBuildingId) || {};
            const index = records(result.buildings).findIndex((item) => String(item.id || "") === activeBuildingId);
            if (index >= 0) {
              const prior = result.buildings[index];
              result.buildings[index] = {
                ...prior,
                ...clone(scopedBuilding),
                id: prior.id,
                portfolioId: prior.portfolioId,
                name: String(scoped?.property?.name || scopedBuilding.name || prior.name || "Gebäude"),
                address: String(scoped?.property?.address ?? scopedBuilding.address ?? prior.address ?? ""),
                totalArea: Number(scoped?.property?.totalArea ?? scopedBuilding.totalArea ?? prior.totalArea ?? 0),
                year: scoped?.property?.year ?? scopedBuilding.year ?? prior.year ?? "",
                billingTakeoverDate: scoped?.property?.billingTakeoverDate ?? scopedBuilding.billingTakeoverDate ?? prior.billingTakeoverDate ?? "",
                predecessorBillingEnd: scoped?.property?.predecessorBillingEnd ?? scopedBuilding.predecessorBillingEnd ?? prior.predecessorBillingEnd ?? "",
                finance: clone(scoped.finance || prior.finance || { repayment: 0, fixed: 0 })
              };
            }

            result.meta = { ...(result.meta || {}) };
            result.meta.primaryBuildingId = primaryBuildingId;
            result.meta.primaryPortfolioId = String(master?.meta?.primaryPortfolioId || result.meta.primaryPortfolioId || "");
            delete result.meta.presentationBuildingId;

            if (activeBuildingId === primaryBuildingId) {
              result.property = clone(scoped.property || master.property || {});
              result.finance = clone(scoped.finance || master.finance || {});
            } else {
              result.property = clone(master.property || {});
              result.finance = clone(master.finance || {});
            }

            return result;
          }
          '''))

          write("src/presentation/index.ts", 'export * from "./navigation";\nexport * from "./building-workspace";\n')

          write("scripts/test-presentation-layer.mjs", B(r'''
          import assert from "node:assert/strict";
          import { build } from "esbuild";

          const compiled = await build({
            entryPoints: ["src/presentation/index.ts"],
            bundle: true,
            write: false,
            format: "esm",
            platform: "node",
            target: "node22",
            logLevel: "silent"
          });
          const source = compiled.outputFiles[0].text;
          const moduleUrl = `data:text/javascript;base64,${Buffer.from(source).toString("base64")}`;
          const presentation = await import(moduleUrl);

          function fixture() {
            return {
              schemaVersion: 15,
              meta: { primaryPortfolioId: "portfolio-1", primaryBuildingId: "building-a", revision: 7, commandLog: [] },
              property: { name: "Haus A", address: "A-Straße 1", totalArea: 180, year: "1990" },
              finance: { repayment: 900, fixed: 20 },
              correspondence: { landlordName: "Vermieter" },
              portfolios: [{ id: "portfolio-1", name: "Privatbestand", kind: "private" }],
              buildings: [
                { id: "building-a", portfolioId: "portfolio-1", name: "Haus A", address: "A-Straße 1", totalArea: 180, year: "1990" },
                { id: "building-b", portfolioId: "portfolio-1", name: "Haus B", address: "B-Straße 2", totalArea: 210, year: "2001", finance: { repayment: 700, fixed: 12 } }
              ],
              units: [
                { id: "unit-a", buildingId: "building-a", name: "Wohnung A", type: "rental" },
                { id: "unit-b", buildingId: "building-b", name: "Wohnung B", type: "rental" }
              ],
              leases: [
                { id: "lease-a", unitId: "unit-a", buildingId: "building-a", rent: 700 },
                { id: "lease-b", unitId: "unit-b", buildingId: "building-b", rent: 800 }
              ],
              sources: [
                { id: "source-a", buildingId: "building-a", name: "Quelle A" },
                { id: "source-b", buildingId: "building-b", name: "Quelle B" }
              ],
              costPositions: [
                { id: "position-a", buildingId: "building-a", sourceId: "source-a", label: "A", amount: 100, confirmed: true },
                { id: "position-b", buildingId: "building-b", sourceId: "source-b", label: "B", amount: 200, confirmed: true }
              ],
              meters: [
                { id: "meter-a", buildingId: "building-a" },
                { id: "meter-b", buildingId: "building-b" }
              ],
              waterSettlements: [],
              tasks: [
                { id: "task-a", buildingId: "building-a", title: "A", due: "2026-10-01" },
                { id: "task-b", buildingId: "building-b", title: "B", due: "2026-10-02" }
              ],
              payments: [
                { id: "payment-a", buildingId: "building-a", amount: 10 },
                { id: "payment-b", buildingId: "building-b", amount: 20 }
              ],
              billingWorkflows: [],
              billingSnapshots: [],
              containers: [],
              water: [],
              audit: []
            };
          }

          const state = fixture();
          assert.equal(presentation.PRESENTATION_VERSION, 1);
          assert.equal(presentation.parseRouteHash("#data/property").route, "data");
          assert.equal(presentation.parseRouteHash("#data/property").sub, "property");
          assert.equal(presentation.routeHash("rental", "water"), "#rental/water");

          const workspace = presentation.createPresentationWorkspace(state, "building-b");
          assert.equal(workspace.showBuildingSelector, true);
          assert.equal(workspace.activeBuildingId, "building-b");
          assert.equal(workspace.activeBuildingName, "Haus B");
          assert.equal(workspace.counts.units, 1);
          assert.equal(workspace.counts.tenancies, 1);
          assert.equal(workspace.counts.payments, 1);

          const scopedB = presentation.projectStateForBuilding(state, "building-b");
          assert.equal(scopedB.meta.primaryBuildingId, "building-b");
          assert.equal(scopedB.meta.presentationBuildingId, "building-b");
          assert.equal(scopedB.property.name, "Haus B");
          assert.equal(scopedB.finance.repayment, 700);
          assert.deepEqual(scopedB.units.map((item) => item.id), ["unit-b"]);
          assert.deepEqual(scopedB.leases.map((item) => item.id), ["lease-b"]);
          assert.deepEqual(scopedB.payments.map((item) => item.id), ["payment-b"]);

          scopedB.property.name = "Haus B neu";
          scopedB.finance.repayment = 710;
          scopedB.payments.push({ id: "payment-b-new", amount: 33 });
          const merged = presentation.mergeStateFromBuilding(state, scopedB, "building-b");

          assert.equal(merged.meta.primaryBuildingId, "building-a");
          assert.equal(merged.property.name, "Haus A");
          assert.equal(merged.finance.repayment, 900);
          assert.equal(merged.buildings.find((item) => item.id === "building-b").name, "Haus B neu");
          assert.equal(merged.buildings.find((item) => item.id === "building-b").finance.repayment, 710);
          assert.equal(merged.payments.find((item) => item.id === "payment-a").amount, 10);
          assert.equal(merged.payments.find((item) => item.id === "payment-b").amount, 20);
          assert.equal(merged.payments.find((item) => item.id === "payment-b-new").buildingId, "building-b");

          const scopedAAfter = presentation.projectStateForBuilding(merged, "building-a");
          const scopedBAfter = presentation.projectStateForBuilding(merged, "building-b");
          assert.equal(scopedAAfter.payments.some((item) => item.id === "payment-b-new"), false);
          assert.equal(scopedBAfter.payments.some((item) => item.id === "payment-b-new"), true);

          const single = fixture();
          single.buildings = [single.buildings[0]];
          single.units = [single.units[0]];
          single.leases = [single.leases[0]];
          assert.equal(presentation.createPresentationWorkspace(single).showBuildingSelector, false);

          console.log("Presentation-Layer D: Routing, Gebäudeprojektion, Merge und Ein-/Mehrgebäude-UX bestanden.");
          '''))

          write("tests/presentation-workspace.spec.js", B(r'''
          const { test, expect } = require('@playwright/test');
          const { runtimeGuard, openApp } = require('./helpers');

          test('D wechselt Gebäude ohne Datenvermischung und persistiert neue Zahlungen im aktiven Gebäude', async ({ page }) => {
            const guard = runtimeGuard(page);
            await openApp(page);

            const fixture = {
              schemaVersion: 15,
              meta: { primaryPortfolioId: 'portfolio-1', primaryBuildingId: 'building-a', revision: 12 },
              property: { name: 'Haus A', address: 'A-Straße 1', totalArea: 180, year: '1990' },
              finance: { repayment: 900, fixed: 0 },
              correspondence: { landlordName: 'Test' },
              portfolios: [{ id: 'portfolio-1', name: 'Privatbestand', kind: 'private' }],
              buildings: [
                { id: 'building-a', portfolioId: 'portfolio-1', name: 'Haus A', address: 'A-Straße 1', totalArea: 180, year: '1990' },
                { id: 'building-b', portfolioId: 'portfolio-1', name: 'Haus B', address: 'B-Straße 2', totalArea: 210, year: '2001', finance: { repayment: 700, fixed: 0 } }
              ],
              units: [
                { id: 'unit-a', buildingId: 'building-a', type: 'rental', name: 'Wohnung A', area: 80 },
                { id: 'unit-b', buildingId: 'building-b', type: 'rental', name: 'Wohnung B', area: 90 }
              ],
              leases: [
                { id: 'lease-a', unitId: 'unit-a', buildingId: 'building-a', tenantName: 'Mieter A', rent: 700, advance: 100 },
                { id: 'lease-b', unitId: 'unit-b', buildingId: 'building-b', tenantName: 'Mieter B', rent: 800, advance: 120 }
              ],
              sources: [
                { id: 'source-a', buildingId: 'building-a', name: 'Quelle A', dueDates: [] },
                { id: 'source-b', buildingId: 'building-b', name: 'Quelle B', dueDates: [] }
              ],
              costPositions: [],
              meters: [],
              waterSettlements: [],
              tasks: [],
              payments: [
                { id: 'payment-a', buildingId: 'building-a', date: '2026-09-01', direction: 'income', label: 'Nur A', amount: 700 },
                { id: 'payment-b', buildingId: 'building-b', date: '2026-09-01', direction: 'income', label: 'Nur B', amount: 800 }
              ],
              billingWorkflows: [],
              billingSnapshots: [],
              containers: [],
              water: [],
              audit: []
            };

            await page.evaluate(async (state) => {
              localStorage.removeItem('mietverwaltung-active-building-v1');
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open('mietverwaltung-v6', 3);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              await new Promise((resolve, reject) => {
                const tx = db.transaction(['state'], 'readwrite');
                tx.objectStore('state').put({ id: 'main', data: state });
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
              });
              db.close();
            }, fixture);

            await page.reload();
            await expect(page.locator('#buildingSwitchWrap')).toBeVisible();
            await expect(page.locator('#buildingSelect')).toHaveValue('building-a');
            await expect(page.locator('#buildingSelect option')).toHaveCount(2);
            await expect(page.locator('.experience-hero .muted')).toContainText('Haus A');

            await page.locator('#buildingSelect').selectOption('building-b');
            await expect(page.locator('#buildingSelect')).toHaveValue('building-b');
            await expect(page.locator('.experience-hero .muted')).toContainText('Haus B');
            await expect(page.locator('.metric-card').filter({ hasText: 'Kaltmiete' }).locator('strong')).toContainText('800');

            await openApp(page, '#owner/payments');
            await expect(page.locator('#buildingSelect')).toHaveValue('building-b');
            await page.getByRole('button', { name: 'Schnell hinzufügen' }).click();
            await page.locator('#quickOverlay').getByRole('button', { name: /^Zahlung\b/ }).click();
            await page.getByLabel('Bezeichnung').fill('D Zahlung B');
            await page.getByLabel('Betrag €').fill('33');
            await page.getByRole('button', { name: 'Speichern' }).click();
            await expect(page.locator('#modal')).toHaveClass(/hidden/);

            const saved = await page.evaluate(async () => {
              const db = await new Promise((resolve, reject) => {
                const request = indexedDB.open('mietverwaltung-v6', 3);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
              });
              const record = await new Promise((resolve, reject) => {
