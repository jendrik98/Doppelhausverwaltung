          während Einheiten, Mietverhältnisse, Quellen, Kosten, Zähler, Wasserperioden, Aufgaben, Zahlungen,
          Abrechnungsdaten und Dokumente zwischen Gebäuden getrennt bleiben.

          Der Gebäude-Selector erscheint ausschließlich bei mehr als einem Gebäude. Die Auswahl ist eine
          Präsentationspräferenz und verändert `meta.primaryBuildingId` des Domainmodells nicht. Das bestehende
          `property`-Objekt bleibt im vollständigen Persistenz-State die Kompatibilitätsprojektion des
          Primärgebäudes. Vollbackups und Restore-Points enthalten weiterhin das komplette Portfolio und alle
          Dokumente, nicht nur das gerade sichtbare Gebäude.

          Schritt D ändert weder App-Version (`18.0.0`) noch State-Schema (`15`) oder IndexedDB-Version (`3`).
          Der PWA-Asset-Key wird auf `app.js?v=1804`, `style.css?v=1810p3` und
          `mietverwaltung-v18-presentation-d-1` angehoben.
          ''')
          write("ARCHITECTURE.md", arch)

          print("Presentation-D Quellen und Tests geschrieben.")
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App reproduzierbar bauen
        run: npm run build

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Validierung prüfen
        run: npm run test:validation

      - name: Architektur einschließlich D prüfen
        run: npm run test:architecture

      - name: Quality-Ratchet prüfen
        run: npm run test:quality

      - name: PWA-Vertrag prüfen
        run: npm run test:pwa

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/d-server.log 2>&1 &
          echo $! > /tmp/d-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/d-server.log
          exit 1

      - name: Vollständige lokale Browser-E2E-Suite
        run: npm run test:e2e

      - name: D-Änderungsumfang verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -e src/presentation/index.ts
          test -e src/presentation/navigation.ts
          test -e src/presentation/building-workspace.ts
          test -e scripts/test-presentation-layer.mjs
          test -e tests/presentation-workspace.spec.js
          grep -q 'app.js?v=1804' index.html
          grep -q 'style.css?v=1810p3' index.html
          grep -q 'mietverwaltung-v18-presentation-d-1' service-worker.js
          grep -q 'compiled src/presentation/index.ts' app.js

          test -z "$(git diff --name-only HEAD -- .github/workflows/ci.yml .github/workflows/e2e-live.yml)"
          echo "D-Änderungen:"
          git status --short

      - name: D-Produktcommit erstellen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ARCHITECTURE.md \
            app.js \
            index.html \
            style.css \
            service-worker.js \
            package.json \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            scripts/test-presentation-layer.mjs \
            scripts/test-pwa-update.mjs \
            src/presentation/index.ts \
            src/presentation/navigation.ts \
            src/presentation/building-workspace.ts \
            src/core/traceability.ts \
            src/runtime/040-traceability.js \
            src/runtime/110-db.js \
            src/runtime/130-backup.js \
            src/ui/app-runtime.ts \
            tests/deployment.spec.js \
            tests/presentation-workspace.spec.js

          git diff --cached --check
          git commit -m "Introduce presentation workspace and building-scoped UI context"
          git push origin HEAD:main
          echo "D_PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Ergebnis
        run: |
          echo "Architecture D Produktcommit: ${D_PRODUCT_SHA}"
          echo "Als Nächstes CI, Pages und Live-E2E für exakt diesen SHA prüfen."
