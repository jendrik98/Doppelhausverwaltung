name: Architecture B1 – Portfolio model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-b1-portfolio-model
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aa51814ab94f6712f5ad0a27e97de570bd501b9c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-b1-portfolio-model.yml"
          test "$(git hash-object src/core/state.ts)" = "e33d015e361d8b4ce19b4f244b1783a4e74d9dd5"
          test "$(git hash-object src/core/integrity.ts)" = "42ad0a6d0f9bb98148d4466bf36032a0ac6725ce"
          test "$(git hash-object scripts/build-app.mjs)" = "3ef1d020e1f54dcac5b6e8bab337cad5bfd18626"
          test "$(git hash-object scripts/test-architecture.mjs)" = "8c5a771f6ade1c6f3a73609a4775743cfbd9bb13"
          test "$(git hash-object package.json)" = "fe38e667a0ece39243f85a955237f743ba507109"
          test "$(git hash-object ARCHITECTURE.md)" = "e6038b860ee56165cf97ee5a3c3cdf398e4d95c6"
          test "$(git hash-object app.js)" = "1beeb04a07a62b181c40bee759def6f5ff513a11"

      - name: B1-Patch anwenden
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/b1_patch.py
          python3 -m py_compile /tmp/b1_patch.py
          python3 /tmp/b1_patch.py

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build, TypeScript und Qualitätsgates
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          node --check scripts/test-portfolio-model.mjs
          git diff --check

      - name: Reproduzierbaren Build verifizieren
        shell: bash
        run: |
          set -euo pipefail
          cp app.js /tmp/app-first.js
          npm run build
          cmp -s /tmp/app-first.js app.js

      - name: B1-Invarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SCHEMA_VERSION = 14' src/core/state.ts
          grep -F 'PORTFOLIO_MODEL_VERSION = 1' src/domain/portfolio-model.ts
          grep -F 'DEFAULT_PORTFOLIO_ID = "portfolio-main"' src/domain/portfolio-model.ts
          grep -F 'DEFAULT_BUILDING_ID = "building-main"' src/domain/portfolio-model.ts
          grep -F 'AppPortfolioModel.ensurePortfolioModel(repaired)' src/core/integrity.ts
          grep -F 'AppPortfolioModel.validatePortfolioModel(value)' src/core/integrity.ts
          grep -F 'compileModule("src/domain/portfolio-model.ts", "AppPortfolioModel")' scripts/build-app.mjs
          grep -F 'compiled src/domain/portfolio-model.ts' app.js
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts

      - name: Chromium und PDF-Werkzeuge installieren
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mietverwaltung-http.log 2>&1 &
          echo $! > /tmp/mietverwaltung-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/mietverwaltung-http.log
          exit 1

      - name: Vollständige lokale E2E-Suite
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: npm run test:e2e

      - name: Änderungsumfang prüfen
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          mapfile -t ACTUAL < <(git diff --cached --name-only | sort)
          EXPECTED=(
            "ARCHITECTURE.md"
            "app.js"
            "package.json"
            "scripts/build-app.mjs"
            "scripts/test-architecture.mjs"
            "scripts/test-portfolio-model.mjs"
            "src/core/integrity.ts"
            "src/core/state.ts"
            "src/domain/portfolio-model.ts"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          printf 'Geändert:\n'; printf '  %s\n' "${ACTUAL[@]}"
          diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          git reset

      - name: B1 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add portfolio and building domain model"
          git push origin HEAD:main
