name: Architecture migration – TypeScript phase 6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase-5-Ausgangslage schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase5.yml
          test -f src/core/auth.ts
          test -f src/core/persistence.ts
          test -f src/io/backup-codec.ts
          test ! -e src/core/integrity.ts
          test ! -e src/core/traceability.ts
          grep -F 'const APP_VERSION="18.0.0";' src/legacy/030-integrity.js
          grep -F 'function validateDomainState' src/legacy/030-integrity.js
          grep -F 'const TRACE_VERSION=1;' src/legacy/040-traceability.js
          grep -F 'async function executeCommand' src/legacy/040-traceability.js

