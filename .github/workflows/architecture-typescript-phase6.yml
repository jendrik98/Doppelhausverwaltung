      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build, TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          grep -F 'compiled src/core/integrity.ts' app.js
          grep -F 'compiled src/core/traceability.ts' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Integritäts- und Persistenz-Invarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const APP_VERSION="18.0.0";' src/legacy/030-integrity.js
          grep -F 'let LAST_STABLE_STATE=null;' src/legacy/030-integrity.js
          grep -F '}=AppIntegrity;' src/legacy/030-integrity.js
          grep -F 'const TRACE_VERSION=1;' src/legacy/040-traceability.js
          grep -F 'const COMMAND_VERSION=1;' src/legacy/040-traceability.js
          grep -F '}=AppTraceability;' src/legacy/040-traceability.js
          ! grep -F 'function validateDomainState' src/legacy/030-integrity.js
          ! grep -F 'async function sha256Text' src/legacy/030-integrity.js
          ! grep -F 'function ensureTraceShape' src/legacy/040-traceability.js
          ! grep -F 'async function executeCommand' src/legacy/040-traceability.js
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          test ! -e .github/workflows/architecture-typescript-phase5.yml
          test -f .github/workflows/architecture-typescript-phase6.yml

      - name: Chromium und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Testserver starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Exakt 25 Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Tests, gefunden: ${TOTAL:-unbekannt}"
            exit 1
          fi

      - name: Strenges 25-von-25-Gate
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --retries=0 --reporter=json > /tmp/e2e.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/e2e.json').read_text(encoding='utf-8'))
          stats = report.get('stats') or {}
          expected = int(stats.get('expected', -1))
          unexpected = int(stats.get('unexpected', -1))
          flaky = int(stats.get('flaky', -1))
          skipped = int(stats.get('skipped', -1))
          total = expected + unexpected + flaky + skipped
          print(f"Playwright: total={total}, passed={expected}, failed={unexpected}, flaky={flaky}, skipped={skipped}, retries=0")
          if not (total == 25 and expected == 25 and unexpected == 0 and flaky == 0 and skipped == 0):
              raise SystemExit("FEHLER: Strenges Gate verlangt exakt 25/25 bestanden, 0 Fehler, 0 Flakes, 0 Skips und 0 Retries.")
          PY

      - name: Änderungsumfang kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          echo "Geänderte/neue/gelöschte Dateien:"
          cat /tmp/changed.txt

          for required in \
            .github/workflows/architecture-typescript-phase5.yml \
            ARCHITECTURE.md \
            app.js \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/core/integrity.ts \
            src/core/traceability.ts \
            src/legacy/030-integrity.js \
            src/legacy/040-traceability.js
          do
            grep -Fx "$required" /tmp/changed.txt >/dev/null || { echo "FEHLER: Erwartete Änderung fehlt: $required"; exit 1; }
          done

          ALLOWED='^(\.github/workflows/architecture-typescript-phase5\.yml|ARCHITECTURE\.md|app\.js|scripts/build-app\.mjs|scripts/test-architecture\.mjs|src/core/integrity\.ts|src/core/traceability\.ts|src/legacy/030-integrity\.js|src/legacy/040-traceability\.js)$'
          if grep -Ev "$ALLOWED" /tmp/changed.txt; then
            echo "FEHLER: Unerwartete Dateiänderung erkannt."
            exit 1
          fi
          test ! -e .github/workflows/architecture-typescript-phase5.yml
          test -f .github/workflows/architecture-typescript-phase6.yml

      - name: Phase 6 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/architecture-typescript-phase5.yml \
            ARCHITECTURE.md \
            app.js \
            scripts/build-app.mjs \
            scripts/test-architecture.mjs \
            src/core/integrity.ts \
            src/core/traceability.ts \
            src/legacy/030-integrity.js \
            src/legacy/040-traceability.js
          git diff --cached --quiet && { echo "FEHLER: Nichts zu committen."; exit 1; }
          git commit -m "Extract integrity and traceability into TypeScript modules"
          git push
