      - name: Quality-Ratchet prüfen
        run: npm run test:quality

      - name: PWA-Vertrag prüfen
        run: npm run test:pwa

      - name: Reproduzierbarkeit prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- style.css
          cp app.js /tmp/g-app.js
          npm run build
          cmp -s /tmp/g-app.js app.js
          cmp -s src/ui/design-system.css style.css

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/g-http.log 2>&1 &
          echo $! > /tmp/g-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/g-http.log
          exit 1

      - name: Dedicated G E2E
