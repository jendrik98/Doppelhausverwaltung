      - name: Vollständige E2E-Suite
        run: npm run test:e2e

      - name: G-Änderungsumfang verifizieren
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(cat <<'EOF'
          ARCHITECTURE.md
          app.js
          index.html
          package.json
          scripts/build-app.mjs
          scripts/test-lifecycle-ledger.mjs
          scripts/test-pwa-update.mjs
