name: Architecture G – Rental lifecycle & revision-safe ledger

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-g-lifecycle-ledger
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      E2E_BASE_URL: http://127.0.0.1:4173/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten G-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          F_PRODUCT_SHA="c2a8a5cdf3a8cf2f695808f40cbdf8a8b09ac6d7"
          test "$(git merge-base HEAD "$F_PRODUCT_SHA")" = "$F_PRODUCT_SHA"
          test "$(git diff --name-only "$F_PRODUCT_SHA" HEAD)" = ".github/workflows/architecture-g-lifecycle-ledger.yml"
          test -e .github/workflows/architecture-e-portfolio-administration.yml
          test -e .github/workflows/architecture-f-design-system.yml
          test -e .github/workflows/ci.yml
          test -e .github/workflows/e2e-live.yml
          test ! -e src/domain/lifecycle-ledger.ts
          test ! -e src/application/rental-lifecycle.ts
          test ! -e src/ui/rental-lifecycle-ui.ts
          test ! -e scripts/test-lifecycle-ledger.mjs
          test ! -e tests/lifecycle-ledger.spec.js
          grep -q 'app.js?v=1805' index.html
          grep -q 'style.css?v=1810p10' index.html
          grep -q 'mietverwaltung-v18-design-system-f-1' service-worker.js
          test "$(wc -c < src/ui/design-system.css)" -eq 44164
          cmp -s src/ui/design-system.css style.css

      - name: Architecture-G Patch anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, json, re
          root=Path('.')

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path,text):
              p=root/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          def replace_once(path,old,new):
              text=read(path);n=text.count(old)
              if n==1:
                  write(path,text.replace(old,new,1));return
              # YAML-Blockskalare entfernen die gemeinsame Einrückung auch innerhalb
              # eingebetteter Triple-Quoted Strings. Für mehrzeilige Anker wird daher
              # bei Bedarf ausschließlich führender Zeilen-Whitespace tolerant gematcht.
              if n==0 and "\n" in old:
                  lines=old.splitlines()
                  pattern="\n".join(r"[ \t]*"+re.escape(line.strip()) for line in lines)
                  matches=list(re.finditer(pattern,text,flags=re.M))
                  if len(matches)==1:
                      match=matches[0]
                      matched_first=match.group(0).splitlines()[0]
                      indent=re.match(r"[ \t]*",matched_first).group(0)
                      repl_lines=new.splitlines()
                      replacement="\n".join((indent+line.lstrip()) if line.strip() else "" for line in repl_lines)
                      write(path,text[:match.start()]+replacement+text[match.end():]);return
                  raise SystemExit(f"{path}: toleranter Mehrzeilenanker gefunden {len(matches)}x für {old[:90]!r}")
              raise SystemExit(f"{path}: erwartete 1 Fundstelle, gefunden {n} für {old[:90]!r}")
          def regex_once(path,pattern,repl,flags=re.S):
              text=read(path);new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n!=1: raise SystemExit(f"{path}: Regex nicht eindeutig: {pattern[:100]}")
              write(path,new)

          NEW_FILES={
          'src/domain/lifecycle-ledger.ts': '',
          'src/application/rental-lifecycle.ts': '',
          'src/ui/rental-lifecycle-ui.ts': '',
          'scripts/test-lifecycle-ledger.mjs': '',
          }
          for path,data in NEW_FILES.items(): write(path,base64.b64decode(data).decode('utf-8'))

          # State: additive JSON collections; schema and IndexedDB stay unchanged.
          replace_once('src/core/state.ts','''  "billingSnapshots",
          "payments",''','''  "billingSnapshots",
          "rentAllocations",
          "meterReplacements",
          "payments",''')
          replace_once('src/core/state.ts','''  billingSnapshots: any[];
          payments: any[];''','''  billingSnapshots: any[];
          rentAllocations: any[];
          meterReplacements: any[];
          payments: any[];''')
          replace_once('src/core/state.ts','''    billingSnapshots: [],
          payments: [],''','''    billingSnapshots: [],
          rentAllocations: [],
          meterReplacements: [],
          payments: [],''')

          # Portfolio/building scope for the new lifecycle records.
          replace_once('src/domain/portfolio-model.ts','''    "payments", "waterSettlements", "billingWorkflows", "billingSnapshots", "containers", "water"''','''    "payments", "waterSettlements", "billingWorkflows", "billingSnapshots", "rentAllocations", "meterReplacements", "containers", "water"''')
          replace_once('src/domain/portfolio-model.ts','''for (const key of ["unitId", "leaseId", "positionId", "sourceId", "meterId", "mainMeterId", "ownerMeterId"])''','''for (const key of ["unitId", "leaseId", "positionId", "sourceId", "meterId", "mainMeterId", "ownerMeterId", "oldMeterId", "newMeterId"])''')
          replace_once('src/domain/portfolio-model.ts','''  for (const key of ["billingWorkflows", "billingSnapshots", "containers", "water"]) {''','''  for (const key of ["billingWorkflows", "billingSnapshots", "rentAllocations", "meterReplacements", "containers", "water"]) {''')
          replace_once('src/domain/portfolio-model.ts','''    ["billingSnapshots", "Snapshots"],
          ["containers", "Behälter"],''','''    ["billingSnapshots", "Snapshots"],
          ["rentAllocations", "Mietkonto-Zuordnungen"],
          ["meterReplacements", "Zählerwechsel"],
          ["containers", "Behälter"],''')

          replace_once('src/application/context.ts','''  "billingSnapshots",
          "containers",''','''  "billingSnapshots",
          "rentAllocations",
          "meterReplacements",
          "containers",''')
          replace_once('src/application/queries.ts','''  billingSnapshots: AnyRecord[];
          containers: AnyRecord[];''','''  billingSnapshots: AnyRecord[];
          rentAllocations: AnyRecord[];
          meterReplacements: AnyRecord[];
          containers: AnyRecord[];''')
          replace_once('src/application/queries.ts','''    billingSnapshots: scoped(records(state.billingSnapshots), buildingId),
          containers: scoped(records(state.containers), buildingId),''','''    billingSnapshots: scoped(records(state.billingSnapshots), buildingId),
          rentAllocations: scoped(records(state.rentAllocations), buildingId),
          meterReplacements: scoped(records(state.meterReplacements), buildingId),
          containers: scoped(records(state.containers), buildingId),''')
          replace_once('src/application/index.ts','''export * from "./portfolio-admin";''','''export * from "./portfolio-admin";
          export * from "./rental-lifecycle";''')

          # Integrity repair/validation owns lifecycle migration.
          replace_once('src/core/integrity.ts','''declare const AppPortfolioModel: {''','''declare const AppLifecycleLedger: {
          ensureLifecycleState: (value: any) => any;
          validateLifecycleState: (value: any) => { errors: string[]; warnings: string[] };
          };
          declare const AppPortfolioModel: {''')
          replace_once('src/core/integrity.ts','''    ["billingSnapshots", "Snapshots"],
          ] as const)''','''    ["billingSnapshots", "Snapshots"],
          ["rentAllocations", "Mietkonto-Zuordnungen"],
          ["meterReplacements", "Zählerwechsel"],
          ] as const)''')
          replace_once('src/core/integrity.ts','''  const portfolioIssues = AppPortfolioModel.validatePortfolioModel(value);
          issues.errors.push(...portfolioIssues.errors);
          issues.warnings.push(...portfolioIssues.warnings);''','''  const portfolioIssues = AppPortfolioModel.validatePortfolioModel(value);
          issues.errors.push(...portfolioIssues.errors);
          issues.warnings.push(...portfolioIssues.warnings);
          const lifecycleIssues = AppLifecycleLedger.validateLifecycleState(value);
          issues.errors.push(...lifecycleIssues.errors);
          issues.warnings.push(...lifecycleIssues.warnings);''')
          replace_once('src/core/integrity.ts','''  repaired = AppPortfolioModel.ensurePortfolioModel(repaired);
          for (const meter of repaired.meters || []) {''','''  repaired = AppPortfolioModel.ensurePortfolioModel(repaired);
          repaired = AppLifecycleLedger.ensureLifecycleState(repaired);
          for (const meter of repaired.meters || []) {''')

          # Property/billing domain: replacement-aware water and lease/version-aware snapshots.
          replace_once('src/domain/property-domain.ts','''declare const DOMAIN_VERSION: number;''','''declare const DOMAIN_VERSION: number;
          declare const AppLifecycleLedger: any;''')
          old='''  const ms=readingById(main,settlement.mainStartReadingId),me=readingById(main,settlement.mainEndReadingId);
          const os=readingById(owner,settlement.ownerStartReadingId),oe=readingById(owner,settlement.ownerEndReadingId);
          if(!ms||!me||!os||!oe)return null;'''
          new='''  const bp=Number.isInteger(Number(settlement.periodYear))?billingPeriodInfo(state,Number(settlement.periodYear)):null;
          const buildingId=String(settlement.buildingId||main?.buildingId||owner?.buildingId||state?.meta?.primaryBuildingId||"");
          if(bp&&AppLifecycleLedger.replacementsInPeriod(state,bp.start,bp.end,buildingId).length){
          const chained=AppLifecycleLedger.waterConsumptionBetween(state,bp.start,bp.end,buildingId);
          return {...chained,periodAligned:true,valid:!!chained.valid}
          }
          const ms=readingById(main,settlement.mainStartReadingId),me=readingById(main,settlement.mainEndReadingId);
          const os=readingById(owner,settlement.ownerStartReadingId),oe=readingById(owner,settlement.ownerEndReadingId);
          if(!ms||!me||!os||!oe)return null;'''
          replace_once('src/domain/property-domain.ts',old,new)
          replace_once('src/domain/property-domain.ts','''  const bp=Number.isInteger(Number(settlement.periodYear))?billingPeriodInfo(state,Number(settlement.periodYear)):null;
          const periodAligned=''','''  const periodAligned=''')
          replace_once('src/domain/property-domain.ts','''  const lease=s.leases[0],advanceEvidence=actualAdvanceEvidenceInPeriod(s,lease,periodYear),advances=advanceEvidence.amount;''','''  const lease=(s.leases||[]).find(l=>(!l.start||l.start<=bp.end)&&(!l.end||l.end>=bp.start))||s.leases[0],advanceEvidence=actualAdvanceEvidenceInPeriod(s,lease,periodYear),advances=advanceEvidence.amount;''')

          replace_once('src/domain/billing-domain.ts','''declare const SCHEMA_VERSION: number;''','''declare const SCHEMA_VERSION: number;
          declare const AppLifecycleLedger: any;''')
          old='''export function actualAdvanceEvidenceInPeriod(s: BillingState,lease: AnyRecord | null | undefined,periodYear: number){
          if(!lease)return{amount:0,recognizedPayments:0};
          const bp=billingPeriodInfo(s,periodYear);if(!bp.active)return{amount:0,recognizedPayments:0};'''
          new='''export function actualAdvanceEvidenceInPeriod(s: BillingState,lease: AnyRecord | null | undefined,periodYear: number){
          if(!lease)return{amount:0,recognizedPayments:0};
          const bp=billingPeriodInfo(s,periodYear);if(!bp.active)return{amount:0,recognizedPayments:0};
          const ledger=AppLifecycleLedger.actualAdvanceFromLedger(s,lease,bp.start,bp.end);
          if(Number(ledger.allocationCount||0)>0)return ledger;'''
          replace_once('src/domain/billing-domain.ts',old,new)
          replace_once('src/domain/billing-domain.ts','''export function snapshotFor(state: BillingState,periodYear: number){return (state.billingSnapshots||[]).find(s=>Number(s.periodYear)===Number(periodYear))}''','''export function snapshotFor(state: BillingState,periodYear: number,leaseId=""){return AppLifecycleLedger.latestSnapshotFor(state,periodYear,leaseId)}''')
          regex_once('src/domain/billing-domain.ts',r'export function createBillingSnapshot\(state: BillingState,periodYear: number\)\{.*?\n\}\n', '''export function createBillingSnapshot(state: BillingState,periodYear: number,options: AnyRecord = {}){
          const base=billingAnalysis(state,periodYear),leaseId=String(options.leaseId||"");
          const analysis=leaseId?AppLifecycleLedger.leaseBillingAnalysis(state,base,periodYear,leaseId):base;
          const waterConsumption=analysis.waterConsumption||settlementConsumption(state,settlementByPeriod(state,periodYear));
          const snapshot={
          id:uid(),buildingId:String(analysis.lease?.buildingId||state.meta?.primaryBuildingId||""),leaseId,periodYear:Number(periodYear),period:structuredClone(analysis.period),createdAt:new Date().toISOString(),
          legalPackVersion:ACTIVE_LEGAL_PACK?.version||"Fallback",
          legalEffectiveDate:ACTIVE_LEGAL_PACK?.effectiveDate||LAW_DATE,domainVersion:DOMAIN_VERSION,schemaVersion:SCHEMA_VERSION,
          property:structuredClone(state.property),correspondence:structuredClone(state.correspondence||{}),units:structuredClone(state.units),
          lease:structuredClone(analysis.lease||null),events:structuredClone(analysis.events),
          waterConsumption:structuredClone(waterConsumption||null),allocationBases:{totalArea:Number(state.property?.totalArea||0),rentalArea:Number(unitByType(state,"rental")?.area||0)},
          unresolved:structuredClone(analysis.unresolved),tenantCosts:Number(analysis.tenantCosts||0),
          advances:Number(analysis.advances||0),result:Number(analysis.result||0),frozen:true
          };
          return AppLifecycleLedger.decorateSnapshotRevision(state,snapshot,options)
          }
          ''')

          # Existing smart rent status becomes a view on the explicit G ledger.
          regex_once('src/domain/smart-engine.ts',r'export function rentMonthStatus\(state,key=smartMonthKey\(\)\)\{.*?\n\}\n', '''export function rentMonthStatus(state,key=smartMonthKey()){
          AppLifecycleLedger.ensureLifecycleState(state);const lease=(state.leases||[]).find(l=>activeLeaseInMonth(l,key));if(!lease)return {key,status:"none",expected:0,paid:0,confidence:0,payments:[]};
          const row=AppLifecycleLedger.ledgerRow(state,lease,key),paymentIds=new Set((row.allocations||[]).map(a=>a.paymentId));
          return {key,lease,expected:row.total,paid:row.paid,difference:row.difference,status:row.status==="overpaid"?"over":row.status,confidence:(row.allocations||[]).length?100:0,payments:(state.payments||[]).filter(p=>paymentIds.has(p.id))}
          }
          ''')
          replace_once('src/domain/smart-engine.ts','''  return (state.billingSnapshots||[]).slice().sort((a,b)=>Number(b.periodYear)-Number(a.periodYear))[0]||null''','''  return (state.billingSnapshots||[]).slice().sort((a,b)=>Number(b.periodYear)-Number(a.periodYear)||Number(b.version||1)-Number(a.version||1)||String(b.createdAt||"").localeCompare(String(a.createdAt||"")))[0]||null''')

          # Lifecycle warnings join the existing decision queue.
          replace_once('src/domain/v18-assistant.ts','''export function decisionActionLabel(x){if(x.route==="rental"&&x.sub==="calculation")return"Abrechnung prüfen";''','''export function decisionActionLabel(x){if(x.route==="rental"&&x.sub==="lifecycle")return"Mietkonto öffnen";if(x.route==="rental"&&x.sub==="calculation")return"Abrechnung prüfen";''')
          replace_once('src/domain/v18-assistant.ts','''export function smartInsights(state){
          const out=[],today=smartToday(),rent=rentMonthStatus(state),proj=billingProjection(state),paymentPlan=smartPaymentPlan(state),todayDay=Number(today.slice(8,10)),rentAttention=rentAttentionDay(state);''','''export function smartInsights(state){
          const out=[],today=smartToday(),rent=rentMonthStatus(state),proj=billingProjection(state),paymentPlan=smartPaymentPlan(state),todayDay=Number(today.slice(8,10)),rentAttention=rentAttentionDay(state);
          for(const item of AppLifecycleLedger.lifecycleAlerts(state,String(state?.meta?.primaryBuildingId||""),today))out.push({...item,why:"Vermietungs-Lifecycle & explizites Mietkonto",confidence:100});''')

          # Compile G modules before application/UI runtime users.
          replace_once('scripts/build-app.mjs','''    compileModule("src/domain/portfolio-model.ts", "AppPortfolioModel"),
          compileModule("src/infrastructure/portfolio-repository.ts", "AppPortfolioRepository"),''','''    compileModule("src/domain/portfolio-model.ts", "AppPortfolioModel"),
          compileModule("src/domain/lifecycle-ledger.ts", "AppLifecycleLedger"),
          compileModule("src/infrastructure/portfolio-repository.ts", "AppPortfolioRepository"),''')
          replace_once('scripts/build-app.mjs','''    compileModule("src/ui/building-workspace-ui.ts", "AppBuildingWorkspaceUi")''','''    compileModule("src/ui/building-workspace-ui.ts", "AppBuildingWorkspaceUi"),
          compileModule("src/ui/rental-lifecycle-ui.ts", "AppRentalLifecycleUi")''')

          # Rental UI: dedicated Lifecycle tab, thin runtime adapter, modular compact ledger.
          replace_once('src/ui/app-runtime.ts','''    {id:"overview",label:"Überblick",icon:"⌂"},
          {id:"water",label:"Kaltwasser",icon:"◌"},''','''    {id:"overview",label:"Überblick",icon:"⌂"},
          {id:"lifecycle",label:"Mietkonto",icon:"↔"},
          {id:"water",label:"Kaltwasser",icon:"◌"},''')
          replace_once('src/ui/app-runtime.ts','''  if(active==="overview")rentalOverview();
          else if(active==="lease")leaseDataView();
          else if(active==="water")waterRentalView();''','''  if(active==="overview")rentalOverview();
          else if(active==="lifecycle")rentalLifecycleView();
          else if(active==="lease")leaseDataView();
          else if(active==="water")waterRentalView();''')
          regex_once('src/ui/app-runtime.ts',r'function v17RentLedgerCard\(s\)\{.*?\n\}\nfunction v17UtilitiesCard', '''function v17RentLedgerCard(s){return AppRentalLifecycleUi.renderCompactLedger(s,{euro,esc})}
          function rentalLifecycleView(){
          AppRentalLifecycleUi.renderRentalLifecycle({state,activeBuildingId:String(state?.meta?.presentationBuildingId||state?.meta?.primaryBuildingId||""),host:$("workspaceBody"),esc,euro,dateDE,modal,closeModal,formField,executeCommand,rerender:rentalLifecycleView,go})
          }
          function v17UtilitiesCard''')
          replace_once('src/ui/app-runtime.ts','''const y=currentPeriodYear(),a=billingAnalysis(state,y),p=billingProjection(state,y),rent=rentMonthStatus(state),ctx=billingPeriodContext(state,y),cb=confidenceBand(p.confidence),l=state.leases[0];''','''const y=currentPeriodYear(),a=billingAnalysis(state,y),p=billingProjection(state,y),rent=rentMonthStatus(state),ctx=billingPeriodContext(state,y),cb=confidenceBand(p.confidence),l=AppLifecycleLedger.activeLeaseAt(state,localDateISO())||state.leases.slice().sort((x,y)=>String(y.start||"").localeCompare(String(x.start||"")))[0];''')
          replace_once('src/ui/app-runtime.ts','''  $("editLeaseOverview").onclick=()=>openLeaseEditor(l||null);''','''  $("editLeaseOverview").onclick=()=>go("rental","lifecycle");''')

          # Billing gets tenancy selector and revision-safe correction without rewriting v1.
          old='''  const y=selectedBillingYear(state),yearOptions=billingSelectableYears(state),closure=billingClosureChecklist(state,y),a=closure.analysis,snap=(state.billingSnapshots||[]).find(s=>Number(s.periodYear)===Number(y)),ctx=billingPeriodContext(state,y),v18=v18BillingAssistant(state,y);'''
          new='''  const y=selectedBillingYear(state),yearOptions=billingSelectableYears(state),baseClosure=billingClosureChecklist(state,y),g=AppRentalLifecycleUi.billingLifecycleContext(state,y,baseClosure,sessionStorage.getItem("billingSelectedLeaseId")||""),closure=g.closure,a=g.analysis,snap=g.snapshot,ctx=billingPeriodContext(state,y),v18=v18BillingAssistant(state,y);'''
          replace_once('src/ui/app-runtime.ts',old,new)
          replace_once('src/ui/app-runtime.ts','''</select></label></div><span class="pill ${closure.ok?"good":"warn"}">''','''</select></label>${g.leases.length>1?`<label style="display:block;margin-top:10px"><span class="muted">Mietverhältnis</span><select id="billingLeaseSelect" aria-label="Mietverhältnis">${g.leases.map(l=>`<option value="${esc(l.id)}" ${l.id===g.selectedLeaseId?"selected":""}>${esc(l.tenantName||l.id)} · ${dateDE(l.start)}${l.end?` – ${dateDE(l.end)}`:""}</option>`).join("")}</select></label>`:""}</div><span class="pill ${closure.ok?"good":"warn"}">''')
          replace_once('src/ui/app-runtime.ts','''${snap?`<div class="legal-ok"><strong>Abrechnung eingefroren</strong><br>${esc(snapshotVerification(snap).label)}</div><div class="card action-row"><button id="downloadBillingPDF" class="primary">PDF erstellen</button><button id="printBillingBtn" class="secondary">Druckansicht</button></div>`:''','''${snap?`<div class="legal-ok"><strong>Abrechnung eingefroren · Version ${Number(snap.version||1)}</strong><br>${esc(snapshotVerification(snap).label)}${snap.correctionReason?`<br><small>Korrekturgrund: ${esc(snap.correctionReason)}</small>`:""}</div><div class="card action-row"><button id="downloadBillingPDF" class="primary">PDF erstellen</button><button id="printBillingBtn" class="secondary">Druckansicht</button><button id="correctBillingBtn" class="secondary">Korrektur erstellen</button></div>`:''')
          replace_once('src/ui/app-runtime.ts','''  if($("billingYearSelect"))$("billingYearSelect").onchange=e=>{sessionStorage.setItem("billingSelectedYear",String(Number(e.target.value)));calculationView()};''','''  if($("billingYearSelect"))$("billingYearSelect").onchange=e=>{sessionStorage.setItem("billingSelectedYear",String(Number(e.target.value)));sessionStorage.removeItem("billingSelectedLeaseId");calculationView()};
          if($("billingLeaseSelect"))$("billingLeaseSelect").onchange=e=>{sessionStorage.setItem("billingSelectedLeaseId",String(e.target.value));calculationView()};''')
          replace_once('src/ui/app-runtime.ts','''  if($("freezeBilling"))$("freezeBilling").onclick=()=>openBillingFinalReview(y);''','''  if($("freezeBilling"))$("freezeBilling").onclick=()=>openBillingFinalReview(y,g.selectedLeaseId);
          if($("correctBillingBtn"))$("correctBillingBtn").onclick=()=>openBillingFinalReview(y,g.selectedLeaseId,snap);''')
          regex_once('src/ui/app-runtime.ts',r'function openBillingFinalReview\(y\)\{.*?\n\}\nfunction printBilling', '''function openBillingFinalReview(y,leaseId="",supersedes=null){
          const baseClosure=billingClosureChecklist(state,y),g=AppRentalLifecycleUi.billingLifecycleContext(state,y,baseClosure,leaseId),closure=g.closure;if(!closure.ok)return alert("Die Abrechnung ist noch nicht vollständig.");
          const a=closure.analysis,isCorrection=!!supersedes,nextVersion=isCorrection?Number(supersedes.version||1)+1:1;
          modal(isCorrection?`Abrechnung korrigieren · Version ${nextVersion}`:"Abrechnung finalisieren",`<div class="legal-warn"><strong>${isCorrection?"Revisionssichere Korrektur":"Letzte Prüfung"}</strong><br>${isCorrection?"Die bisherige Abrechnung bleibt unverändert erhalten. Es entsteht eine neue Version mit eigener Prüfsumme.":"Nach dem Einfrieren wird ein revisionssicherer Snapshot mit Prüfsumme erstellt. Änderungen an Stammdaten wirken nicht rückwirkend auf diesen Snapshot."}</div>
          <div class="card"><p>Mietverhältnis: <strong>${esc(a.lease?.tenantName||"Mieter/in")}</strong></p><p>Umlagefähige Kosten: <strong>${euro(a.tenantCosts)}</strong></p><p>Vorauszahlungen: <strong>${euro(a.advances)}</strong></p><p>Ergebnis: <strong>${euro(a.result)}</strong></p></div>
          ${isCorrection?`<label class="full">Korrekturgrund<textarea id="billingCorrectionReason" class="big-input" rows="3" placeholder="z. B. nachgereichter Gebührenbescheid"></textarea></label>`:""}
          <label class="confirm-row"><input id="billingConfirm" type="checkbox"> Ich habe Zeitraum, Belege, Umlageschlüssel und Vorauszahlungen geprüft.</label>
          <button id="billingFinalize" class="primary" disabled>${isCorrection?`Version ${nextVersion} einfrieren`:"Abrechnung einfrieren"}</button>`,()=>{
          $("billingConfirm").onchange=e=>$("billingFinalize").disabled=!e.target.checked;
          $("billingFinalize").onclick=async()=>{
          const correctionReason=isCorrection?String($("billingCorrectionReason")?.value||"").trim():"";if(isCorrection&&!correctionReason)return alert("Bitte den Korrekturgrund dokumentieren.");
          const payload={periodYear:y,leaseId:g.selectedLeaseId,correctionReason,supersedesSnapshotId:supersedes?.id||""};
