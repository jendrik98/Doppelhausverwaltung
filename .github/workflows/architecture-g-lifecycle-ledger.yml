          )
          ACTUAL=$(git diff --name-only HEAD | sort)
          test "$ACTUAL" = "$(printf '%s\n' "$EXPECTED" | sort)"
          test -z "$(git diff --name-only HEAD -- '.github/workflows/*')"
          test -z "$(git diff --name-only HEAD -- 'src/presentation/*' 'src/infrastructure/*' 'src/io/*')"
          grep -q 'app.js?v=1806' index.html
          grep -q 'style.css?v=1810p10' index.html
