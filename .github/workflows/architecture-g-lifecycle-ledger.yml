name: Repository Hygiene + Architecture H1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-g-lifecycle-ledger.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-hygiene-h1
  cancel-in-progress: false

env:
  BASE_SHA: 592f269a9d1a9231ab5f32f26ffcdc45ed5c91ba
  SELF_PATH: .github/workflows/architecture-g-lifecycle-ledger.yml

jobs:
  cleanup-and-h1:
    name: Clean baseline, H1, tests, push, verify
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
      GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}

    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAINT_TOKEN:-}" ]; then
            echo "::error::Repository-Secret REPO_MAINTENANCE_TOKEN fehlt. Der Token benötigt Contents: read/write, Workflows: read/write und Actions: read."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA"; then
            echo "::error::Abbruch: Basis $BASE_SHA ist kein Vorfahr des aktuellen Workflow-Commits $TRIGGER_SHA."
            exit 1
          fi

          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            printf 'Seit dem Basis-Commit geänderte Dateien:\n%s\n' "${CHANGED[*]}"
            echo "::error::Zwischen Basis und Wartungslauf darf ausschließlich $SELF_PATH geändert worden sein."
            exit 1
          fi

          echo "TRIGGER_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"
          echo "Basis-SHA und ausschließlich Workflow-Uploads seit der Basis sind sauber verifiziert."

      - name: Architecture-H1-Patch bereitstellen und anwenden
