          IHJlYWQoJ3NyYy91aS9hcHAtcnVudGltZS50cycpCmFzc2VydCBub3QgcCgnUkVBRE1FX0UyRS5tZCcpLmV4aXN0cygpCnByaW50KCdSZXBvc2l0b3J5IGNs
          ZWFudXAgKyBBcmNoaXRlY3R1cmUgSDEgcGF0Y2ggcHJlcGFyZWQgc3VjY2Vzc2Z1bGx5LicpCg==
          PATCH_B64
          python3 -m py_compile /tmp/maintenance_patch.py
          python3 /tmp/maintenance_patch.py
          rm -f /tmp/maintenance_patch.py

      - name: Temporäre E/F/G-Workflows entfernen
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/architecture-e-portfolio-administration.yml \
            .github/workflows/architecture-f-design-system.yml \
            .github/workflows/architecture-g-lifecycle-ledger.yml

          mapfile -t WORKFLOWS < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          printf 'Verbleibende Workflows:\n%s\n' "${WORKFLOWS[*]}"
          EXPECTED=$'ci.yml\ne2e-live.yml'
          ACTUAL="$(printf '%s\n' "${WORKFLOWS[@]}")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Nach der Bereinigung dürfen nur ci.yml und e2e-live.yml verbleiben."
            exit 1
          fi

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build erzeugen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA_1="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_1="$(sha256sum style.css | awk '{print $1}')"
          npm run build
          APP_SHA_2="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_2="$(sha256sum style.css | awk '{print $1}')"
          test "$APP_SHA_1" = "$APP_SHA_2"
          test "$STYLE_SHA_1" = "$STYLE_SHA_2"
          echo "app.js reproduzierbar: $APP_SHA_2"
          echo "style.css reproduzierbar: $STYLE_SHA_2"

      - name: TypeScript und statische Qualitätsgates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          node --check scripts/test-quality.mjs
          node --check scripts/test-pwa-update.mjs
          node --check scripts/test-hygiene.mjs
          node --check scripts/test-year-archive.mjs

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Vollständige lokale E2E-Suite
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/doppelhaus-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/doppelhaus-http.log
            exit 1
          fi

          npm run test:e2e

      - name: Finalen Repository-Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf playwright-report test-results

          test ! -e maintenance_patch.py
          test ! -e README_E2E.md
          test ! -e .github/workflows/architecture-e-portfolio-administration.yml
          test ! -e .github/workflows/architecture-f-design-system.yml
          test ! -e .github/workflows/architecture-g-lifecycle-ledger.yml
          test -e .github/workflows/ci.yml
          test -e .github/workflows/e2e-live.yml
          test -e src/domain/year-archive.ts
          test -e scripts/test-hygiene.mjs
          test -e scripts/test-year-archive.mjs

          npm run test:hygiene
          npm run build

          git status --short

      - name: Bereinigung und Architecture H1 committen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$TRIGGER_SHA" ]; then
            echo "::error::main hat sich während des Wartungslaufs geändert: remote=$REMOTE_SHA, erwartet=$TRIGGER_SHA. Kein automatischer Push."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::Es gibt unerwartet keine Änderungen zu committen."
            exit 1
          fi

          git commit -m "chore: clean repository and start Architecture H"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          echo "Finaler Produkt-SHA: $FINAL_SHA"

      - name: Dauerhafte CI und Live-E2E für finalen SHA abwarten
        shell: bash
        run: |
          set -euo pipefail

          wait_for_run() {
            local workflow="$1"
            local label="$2"
            local run_id=""

            for i in {1..120}; do
              run_id="$(gh run list \
                --workflow "$workflow" \
                --commit "$FINAL_SHA" \
                --limit 20 \
                --json databaseId,headSha,event,status,conclusion \
                | jq -r --arg sha "$FINAL_SHA" '.[] | select(.headSha == $sha and .event == "push") | .databaseId' \
                | head -n 1 || true)"
              if [ -n "$run_id" ]; then
                echo "$label gefunden: Run #$run_id"
                gh run watch "$run_id" --exit-status
                echo "$label ist grün."
                return 0
              fi
              echo "$label für $FINAL_SHA noch nicht sichtbar ($i/120)."
              sleep 5
            done

            echo "::error::$label wurde für $FINAL_SHA nicht innerhalb von 10 Minuten gefunden."
            return 1
          }

          wait_for_run ci.yml "CI – Build & Quality"
          wait_for_run e2e-live.yml "Live E2E – Mietverwaltung"

      - name: Abschlusszusammenfassung
        if: success()
        shell: bash
        run: |
          {
            echo '## Repository-Bereinigung + Architecture H1 erfolgreich'
            echo
            echo "- Basis: $BASE_SHA"
            echo "- Finaler SHA: $FINAL_SHA"
            echo '- Temporäre E/F/G-Workflows: entfernt'
            echo '- maintenance_patch.py: nicht im Repository'
            echo '- Lokale Build-/TypeScript-/Architektur-/Hygiene-/PWA-Gates: grün'
            echo '- Vollständige lokale Playwright-Suite: grün'
            echo '- Dauerhafte CI: grün'
            echo '- Live E2E / GitHub Pages: grün'
          } >> "$GITHUB_STEP_SUMMARY"
