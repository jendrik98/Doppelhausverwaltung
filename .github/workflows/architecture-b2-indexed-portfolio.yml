name: Architecture B2 – Indexed portfolio persistence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-b2-indexed-portfolio
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten B1-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "964119e7e0273d5ddb7ccb8dcbd9ed8638eec7be"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-b2-indexed-portfolio.yml"
          test "$(git hash-object src/core/state.ts)" = "f0260327feff55f25a7f653a9ee4c7738da4fd5f"
          test "$(git hash-object src/core/persistence.ts)" = "2f0b7b3d1f90a3953c5dafbf835d09ed5ec2169e"
          test "$(git hash-object src/domain/portfolio-model.ts)" = "3c24f2e5d803af4ff70049236d1fb53746ee0149"
          test "$(git hash-object src/runtime/110-db.js)" = "6a00a144119a0102a5d86ab83730819bce21fa5a"
          test "$(git hash-object scripts/build-app.mjs)" = "cc983f6699030e774208938aad093ccc9ea82396"
          test "$(git hash-object scripts/test-architecture.mjs)" = "0d7a2828fa2d58d4507fbeec080caf6aeec42c7b"
          test "$(git hash-object scripts/test-portfolio-model.mjs)" = "7a103d23eabd56ad68e12e4b50d0283f78fa9278"
          test "$(git hash-object package.json)" = "52e863af5f33296ba87fc4b97a4b97aba92c60ce"
          test "$(git hash-object tsconfig.json)" = "ce58c91abce12b574fdfe8168ccd3a236ab6dfbd"
          test "$(git hash-object index.html)" = "837a6138358bdfd52bf08f7ac912d32bc6de3768"
          test "$(git hash-object service-worker.js)" = "efc3d83994f740a1353a6f21550b5a25fcda2a3e"
          test "$(git hash-object ARCHITECTURE.md)" = "5882420bd3147efacdeb97ae843df1859b9ffef3"
          test "$(git hash-object app.js)" = "76280eacc9b56cc0392ea7a8d4c6e8babea3821d"
          test ! -e src/infrastructure/portfolio-repository.ts
          test ! -e scripts/test-portfolio-repository.mjs
          test ! -e tests/multibuilding-persistence.spec.js

      - name: B2-Patch anwenden
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/b2_patch.py
          python3 -m py_compile /tmp/b2_patch.py
          python3 /tmp/b2_patch.py

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktbundle erzeugen
        run: npm run build

      - name: TypeScript und Verträge prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js
          node --check service-worker.js
          node --check scripts/test-portfolio-model.mjs
          node --check scripts/test-portfolio-repository.mjs
          node --check tests/multibuilding-persistence.spec.js

      - name: Reproduzierbaren Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          cp app.js /tmp/app-first.js
          npm run build
          cmp -s /tmp/app-first.js app.js

      - name: Browserwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/b2-http.log 2>&1 &
          echo $! > /tmp/b2-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b2-http.log
          exit 1

      - name: Vollständige E2E-Suite strikt prüfen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --reporter=json > /tmp/b2-e2e.json
          python3 - <<'PYTEST'
          import json
          data=json.load(open('/tmp/b2-e2e.json',encoding='utf-8'))
          stats=data.get('stats',{})
          expected=int(stats.get('expected',0))
          unexpected=int(stats.get('unexpected',0))
          flaky=int(stats.get('flaky',0))
          skipped=int(stats.get('skipped',0))
          print(f"B2 Playwright: expected={expected}, unexpected={unexpected}, flaky={flaky}, skipped={skipped}")
          if (expected,unexpected,flaky,skipped)!=(26,0,0,0):
              raise SystemExit('Strenger B2-E2E-Vertrag verletzt')
          PYTEST

      - name: B2-Invarianten und Scope prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SCHEMA_VERSION = 15' src/core/state.ts
          grep -q 'PORTFOLIO_MODEL_VERSION = 2' src/domain/portfolio-model.ts
          grep -q 'DB_VERSION = 3' src/core/persistence.ts
          grep -q 'PORTFOLIO_REPOSITORY_VERSION = 1' src/infrastructure/portfolio-repository.ts
          grep -q 'AppPortfolioRepository' src/runtime/110-db.js
          grep -q 'app.js?v=1802' index.html
          grep -q './app.js?v=1802' service-worker.js
          grep -q 'const APP_VERSION="18.0.0"' src/runtime/030-integrity.js
          grep -q 'mietverwaltung-v6' src/core/persistence.ts
          grep -q 'mietverwaltung_webauthn' src/core/auth.ts
          test ! -d src/legacy
          git diff --check

      - name: One-off Workflow entfernen und exakten Diff prüfen
        shell: bash
        run: |
          set -euo pipefail
          rm ".github/workflows/architecture-b2-indexed-portfolio.yml"
          git add -A
          git diff --cached --check
          cat > /tmp/expected-files <<'FILES'
          .github/workflows/architecture-b2-indexed-portfolio.yml
          ARCHITECTURE.md
          app.js
          index.html
          package.json
          scripts/build-app.mjs
          scripts/test-architecture.mjs
          scripts/test-portfolio-model.mjs
          scripts/test-portfolio-repository.mjs
          service-worker.js
          src/core/persistence.ts
          src/core/state.ts
          src/domain/portfolio-model.ts
          src/infrastructure/portfolio-repository.ts
          src/runtime/110-db.js
          tests/multibuilding-persistence.spec.js
          tsconfig.json
          FILES
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git diff --cached --name-only | grep -c '^package-lock.json$' || true)" = "0"

      - name: Commit und Push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add indexed portfolio persistence and building isolation"
          git push origin HEAD:main
