          replace_once("index.html", "style.css?v=1810p9", "style.css?v=1810p10")
          replace_once("service-worker.js", "mietverwaltung-v18-portfolio-admin-e-1", "mietverwaltung-v18-design-system-f-1")
          replace_once("service-worker.js", "./style.css?v=1810p9", "./style.css?v=1810p10")

          deployment = read("tests/deployment.spec.js")
          if deployment.count("style.css?v=1810p9") != 3:
              raise SystemExit(
                  f"tests/deployment.spec.js: erwartete 3 Style-Key-Fundstellen, gefunden "
