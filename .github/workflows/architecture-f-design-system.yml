name: Architecture F – Design system & UX consolidation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-f-design-system
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: http://127.0.0.1:4173/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten F-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          E_PRODUCT_SHA="f96a9611e7a5379d2ade706108400a5a105ce32d"
          test "$(git merge-base HEAD "$E_PRODUCT_SHA")" = "$E_PRODUCT_SHA"
          test "$(git diff --name-only "$E_PRODUCT_SHA" HEAD)" = ".github/workflows/architecture-f-design-system.yml"

          test -e .github/workflows/architecture-e-portfolio-administration.yml
          test ! -e .github/workflows/architecture-d-presentation-workspace.yml
          test -e .github/workflows/ci.yml
          test -e .github/workflows/e2e-live.yml

          test ! -e src/ui/design-system.css
          test ! -e scripts/build-styles.mjs
          test ! -e scripts/test-design-system.mjs
          test ! -e tests/design-system.spec.js

          grep -q 'style.css?v=1810p9' index.html
          grep -q 'mietverwaltung-v18-portfolio-admin-e-1' service-worker.js
          grep -q 'V14 Navigation & UX' style.css
          grep -q 'V16 Premium Final' style.css
          grep -q 'V18 consolidated olive theme' style.css
          grep -q 'Architecture E: mobile touch safety' style.css

      - name: Design-System-F Patch anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          root = Path(".")

          def B(value):
              return textwrap.dedent(value).lstrip("\n")

          def read(path):
              return (root / path).read_text(encoding="utf-8")

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: erwartete genau 1 Fundstelle, gefunden {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          def between(text, start_marker, end_marker):
              if text.count(start_marker) != 1:
                  raise SystemExit(f"style.css: Marker nicht eindeutig: {start_marker}")
              if text.count(end_marker) != 1:
                  raise SystemExit(f"style.css: Endmarker nicht eindeutig: {end_marker}")
              start = text.index(start_marker) + len(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          def remove_balanced(text, token):
              while token in text:
                  start = text.index(token)
                  opening = text.find("{", start)
                  if opening < 0:
                      raise SystemExit(f"CSS-Block ohne öffnende Klammer: {token}")
                  depth = 0
                  closing = None
                  for i in range(opening, len(text)):
                      ch = text[i]
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              closing = i
                              break
                  if closing is None:
                      raise SystemExit(f"CSS-Block nicht geschlossen: {token}")
                  text = text[:start] + text[closing + 1:]
              return text

          COLOR_MAP = {
              "#ffffff": "var(--surface)",
              "#f8fafc": "var(--surface-2)",
              "#f5f8fb": "var(--surface-2)",
              "#f4f7fa": "var(--surface-2)",
              "#f2f4f7": "var(--surface-2)",
              "#eef2f7": "var(--surface-2)",
              "#edf2f7": "var(--line)",
              "#e2e8f0": "var(--line)",
              "#e1e7ed": "var(--line)",
              "#dce4eb": "var(--line)",
              "#dbe2ea": "var(--line)",
              "#d9e1e8": "var(--line)",
              "#cbd5e1": "var(--line-strong)",
              "#667085": "var(--muted)",
              "#64748b": "var(--muted)",
              "#475467": "var(--text-secondary)",
              "#334155": "var(--text)",
              "#0f172a": "var(--primary)",
              "#101828": "var(--text)",
              "#dcfce7": "var(--success-soft)",
              "#166534": "var(--success)",
              "#fef3c7": "var(--warning-soft)",
              "#92400e": "var(--warning)",
              "#9a3412": "var(--warning)",
              "#fee2e2": "var(--danger-soft)",
              "#991b1b": "var(--danger)",
              "#b42318": "var(--danger)",
              "#b54708": "var(--warning)",
              "#175cd3": "var(--accent)",
              "#93c5fd": "var(--focus)",
              "#84adff": "var(--focus)",
              "#1849a9": "var(--accent-strong)",
              "#d1e0ff": "var(--line)",
              "#abefc6": "var(--success)",
              "#fedf89": "var(--warning)",
              "#fed7aa": "var(--warning)",
              "#fff7ed": "var(--warning-soft)",
              "#fecdca": "var(--danger)",
              "#98a2b3": "var(--muted)",
              "#f0f9ff": "var(--accent-soft)",
              "#b9e6fe": "var(--line)",
              "#026aa2": "var(--accent-strong)",
              "#fbfcfd": "var(--surface-2)",
              "#b7c0ce": "var(--muted)",
              "#fff": "var(--surface)"
          }

          def tokenise(fragment):
              fragment = fragment.replace("!important", "")
              fragment = re.sub(
                  r"#[0-9a-fA-F]{3,8}\b",
                  lambda match: COLOR_MAP.get(match.group(0).lower(), match.group(0)),
                  fragment
              )
              fragment = re.sub(r"/\*\s*=====.*?=====\s*\*/", "", fragment, flags=re.S)
              while fragment.count("}") > fragment.count("{"):
                  idx = fragment.rfind("}")
                  fragment = fragment[:idx] + fragment[idx + 1:]
              if fragment.count("{") != fragment.count("}"):
                  raise SystemExit("CSS-Fragment ist nach Bereinigung nicht ausgeglichen.")
              return fragment.strip()

          old_style = read("style.css")
          markers = {
              "v14": "/* ===== V14 Navigation & UX ===== */",
              "v15": "/* ===== V15 Meter Vision ===== */",
              "v16": "/* ===== V16 Premium Final ===== */",
              "v18": "/* ===== V18 consolidated olive theme ===== */",
              "simple": "/* ===== V18 simplified navigation preview ===== */",
              "validation": "/* ===== Phase 2 validation feedback ===== */",
              "building": "/* ===== D Presentation / Building context ===== */",
              "touch": "/* ===== Architecture E: mobile touch safety ===== */",
          }
          for marker in markers.values():
              if old_style.count(marker) != 1:
                  raise SystemExit(f"style.css: erwartete genau einen Marker {marker!r}")

          tail_start = ".storage-meter{"
          if old_style.count(tail_start) != 1:
              raise SystemExit("style.css: Feature-Tail konnte nicht eindeutig gefunden werden.")

          legacy_features = old_style[old_style.index(tail_start):old_style.index(markers["v14"])]
          components = between(old_style, markers["v14"], markers["v15"])
          meter_features = between(old_style, markers["v15"], markers["v16"])
          premium_patterns = between(old_style, markers["v16"], markers["v18"])
          simplified = between(old_style, markers["simple"], markers["validation"])
          validation = between(old_style, markers["validation"], markers["building"])
          building = between(old_style, markers["building"], markers["touch"])

          components = remove_balanced(components, ":root{")
          premium_patterns = remove_balanced(premium_patterns, ":root{")
          premium_patterns = remove_balanced(premium_patterns, "@media(prefers-color-scheme:dark){")

          legacy_features = tokenise(legacy_features)
          components = tokenise(components)
          meter_features = tokenise(meter_features)
          premium_patterns = tokenise(premium_patterns)
          simplified = tokenise(simplified)
          validation = tokenise(validation)
          building = tokenise(building)

          design = B(r'''
          /*
           * Mietverwaltung Design System F
           * Source of truth: src/ui/design-system.css
           * style.css is generated and must be byte-identical.
           */
          @layer reset, base, components, patterns, features, responsive, accessibility;

          @layer reset {
            *,*::before,*::after{box-sizing:border-box}
            html,body{margin:0;width:100%;max-width:100%}
            button,input,select,textarea{font:inherit}
            button{cursor:pointer;-webkit-tap-highlight-color:transparent}
            img,svg,canvas{max-width:100%}
          }

          @layer base {
            :root{
              color-scheme:light dark;
              --color-bg:#f4f6ef;
              --color-surface:#ffffff;
              --color-surface-muted:#edf2e3;
              --color-surface-subtle:#f1f4e9;
              --color-text:#202817;
              --color-text-secondary:#46513a;
              --color-text-muted:#5d684f;
              --color-border:#cbd4bc;
              --color-border-strong:#adb99b;
              --color-primary:#647335;
              --color-primary-soft:#e3ead2;
              --color-accent:#6f7d37;
              --color-accent-strong:#556326;
              --color-accent-soft:#e6edd6;
              --color-on-primary:#ffffff;
              --color-success:#3b7044;
              --color-success-soft:#e7f2e5;
              --color-warning:#8c6818;
              --color-warning-soft:#faf1d8;
              --color-danger:#914848;
              --color-danger-soft:#f7e5e5;
              --color-focus:#6f7d37;
              --space-1:4px;
              --space-2:8px;
              --space-3:12px;
              --space-4:16px;
              --space-5:20px;
              --space-6:24px;
              --radius-sm:11px;
              --radius:16px;
              --radius-lg:22px;
              --shadow:0 10px 26px rgba(62,76,35,.09);
              --shadow-strong:0 16px 34px rgba(62,76,35,.14);
              --content-max:1180px;
              --touch:44px;

              --bg:var(--color-bg);
              --surface:var(--color-surface);
              --surface-2:var(--color-surface-muted);
              --surface-elevated:var(--color-surface);
              --surface-subtle:var(--color-surface-subtle);
              --text:var(--color-text);
              --text-secondary:var(--color-text-secondary);
              --muted:var(--color-text-muted);
              --line:var(--color-border);
              --line-strong:var(--color-border-strong);
              --border:var(--color-border);
              --primary:var(--color-primary);
              --primary-soft:var(--color-primary-soft);
              --accent:var(--color-accent);
              --accent-strong:var(--color-accent-strong);
              --accent-soft:var(--color-accent-soft);
              --on-primary:var(--color-on-primary);
              --success:var(--color-success);
              --success-soft:var(--color-success-soft);
              --warning:var(--color-warning);
              --warning-soft:var(--color-warning-soft);
              --danger:var(--color-danger);
              --danger-soft:var(--color-danger-soft);
              --focus:var(--color-focus);
              --premium-glass:rgba(255,255,255,.88);
            }

            @media(prefers-color-scheme:dark){
              :root{
                --color-bg:#0f130c;
                --color-surface:#181e13;
                --color-surface-muted:#222a1a;
                --color-surface-subtle:#202818;
                --color-text:#f0f3e7;
                --color-text-secondary:#d5dccb;
                --color-text-muted:#b5bea8;
                --color-border:#39442f;
                --color-border-strong:#536045;
                --color-primary:#a9b96a;
                --color-primary-soft:#2c351f;
                --color-accent:#b8c979;
                --color-accent-strong:#cedb98;
                --color-accent-soft:#303923;
                --color-on-primary:#11150d;
                --color-success:#78bd7d;
                --color-success-soft:#1e3321;
                --color-warning:#d8b75d;
                --color-warning-soft:#3b3018;
                --color-danger:#dda0a0;
                --color-danger-soft:#402323;
                --color-focus:#b8c979;
                --shadow:0 16px 34px rgba(0,0,0,.28);
                --shadow-strong:0 20px 42px rgba(0,0,0,.38);
                --premium-glass:rgba(24,30,19,.9);
              }
            }

            html,body{background:var(--bg);color:var(--text)}
            body{
              min-height:100vh;
              padding-bottom:calc(100px + env(safe-area-inset-bottom));
              overflow-x:hidden;
              font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              -webkit-font-smoothing:antialiased;
              text-rendering:optimizeLegibility;
            }
            button,input,select,textarea{color:var(--text)}
            button{min-height:var(--touch);border-radius:var(--radius-sm)}
            button:disabled{opacity:.48;cursor:not-allowed}
            a{color:var(--accent-strong)}
            h1,h2,h3,h4,p{overflow-wrap:anywhere}
            .muted,.subtitle,.caption,.hint,.subtle{color:var(--muted)}
            .negative{color:var(--danger)}
            .positive{color:var(--success)}
            .warning-text{color:var(--warning)}

            main{
              width:100%;
              max-width:var(--content-max);
              min-width:0;
              margin:0 auto;
              padding:22px 16px 92px;
              background:var(--bg);
            }
            #app,.workspace-content{min-width:0;max-width:100%}

            .topbar{
              position:sticky;
              top:0;
              z-index:700;
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:12px;
              padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
              background:color-mix(in srgb,var(--surface) 94%,transparent);
              color:var(--text);
              border-bottom:1px solid var(--line);
              backdrop-filter:saturate(160%) blur(18px);
              -webkit-backdrop-filter:saturate(160%) blur(18px);
            }
            .topbar h1{margin:0}
            .brand{display:flex;align-items:center;gap:10px;min-width:0}
            .brand>div:nth-child(2){min-width:0}
            .brand-mark{display:grid;place-items:center;flex:0 0 auto}
            .top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
            .subtitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

            .main-tabs{
              position:fixed;
              left:0;
              right:0;
              bottom:0;
              z-index:500;
              display:grid;
              grid-template-columns:repeat(5,minmax(0,1fr));
              width:min(680px,100vw);
              margin-inline:auto;
              padding:6px 7px calc(6px + env(safe-area-inset-bottom));
              background:color-mix(in srgb,var(--surface) 97%,transparent);
              border:1px solid var(--line);
              border-bottom:0;
              border-radius:18px 18px 0 0;
              box-shadow:0 -8px 24px rgba(16,24,40,.06);
              backdrop-filter:blur(18px);
              -webkit-backdrop-filter:blur(18px);
            }
            .main-tabs button{
              min-width:0;
              min-height:55px;
              border:0;
              background:transparent;
              color:var(--muted);
            }

            .hero,.card,.item,.workspace-card{
              min-width:0;
              max-width:100%;
              background:var(--surface);
              color:var(--text);
              border:1px solid var(--line);
              border-radius:var(--radius);
              box-shadow:var(--shadow);
            }
            .hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:13px}
            .card,.item{margin-bottom:13px}
            .eyebrow{margin:0 0 5px;font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted)}
            .grid{display:grid;gap:12px}
            .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
            .row{display:flex;align-items:center;gap:10px;min-width:0}
            .between{justify-content:space-between}
            .stack{display:flex;flex-direction:column;gap:10px}
            .two-up{grid-template-columns:repeat(2,minmax(0,1fr))}
            .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
            .card-head>div{min-width:0}

            .primary,.secondary,.danger,.ghost,.icon-action,.close-action{
              border:1px solid transparent;
              padding:10px 14px;
              font-weight:750;
            }
            .primary,.primary-action{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
            .secondary,.ghost{background:var(--accent-soft);color:var(--text);border-color:var(--line)}
            .danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
            .compact{min-height:var(--touch);padding:7px 10px;font-size:13px}
            .wide{width:100%;margin-top:12px}
            .linkbutton{background:transparent;border:0;text-decoration:underline;color:inherit}

            .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
            .form-grid label,.file-label{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:14px;min-width:0}
            .form-grid input,.form-grid select,.form-grid textarea,.big-input{
              width:100%;
              min-width:0;
              max-width:100%;
              border:1px solid var(--line-strong);
              border-radius:var(--radius-sm);
              padding:11px 12px;
              background:var(--surface-2);
              color:var(--text);
            }
            input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
            .full{grid-column:1/-1}
            .form-actions{display:flex;justify-content:flex-end;gap:8px}

            .legal-ok,.legal-warn,.legal-bad,.info{
              padding:12px;
              border-radius:12px;
              border:1px solid var(--line);
              margin:8px 0;
            }
            .legal-ok{background:var(--success-soft);border-color:var(--success);color:var(--success)}
            .legal-warn{background:var(--warning-soft);border-color:var(--warning);color:var(--warning)}
            .legal-bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
            .info{background:var(--accent-soft);color:var(--text)}
            .pill,.tag,.chip,.badge,.confidence{
              display:inline-flex;
              align-items:center;
              border:1px solid var(--line);
              border-radius:999px;
              padding:4px 8px;
              background:var(--surface-2);
              color:var(--text);
              font-size:11px;
              font-weight:750;
            }
            .pill.good,.badge.good,.confidence-good{background:var(--success-soft);color:var(--success);border-color:var(--success)}
            .pill.warn,.badge.warn,.confidence-warn{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
            .pill.bad,.badge.bad,.confidence-bad{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

            .analysis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
            .analysis-grid>div{padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
            .analysis-grid small,.analysis-grid strong{display:block}
            .task{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:var(--surface-2)}
            .task h4{margin:0 0 4px}

            .tablewrap{max-width:100%;overflow:auto;border-radius:12px}
            .costtable{width:100%;border-collapse:collapse}
            .costtable th,.costtable td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
            .costtable th{position:sticky;top:0;background:var(--surface-2);z-index:1}

            .action-grid,.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
            .action-grid button,.quick-grid button,.search-result{
              width:100%;
              min-width:0;
              border:1px solid var(--line);
              background:var(--surface-2);
              color:var(--text);
              border-radius:14px;
              padding:14px;
              text-align:left;
            }
            .action-grid strong,.action-grid small,.quick-grid strong,.quick-grid small,.search-result strong,.search-result small{display:block}
            .action-grid small,.quick-grid small,.search-result small{color:var(--muted);margin-top:4px}

            .overlay{
              position:fixed;
              inset:0;
              z-index:1000;
              display:flex;
              align-items:flex-end;
              justify-content:center;
              padding:10px;
              background:rgba(10,14,8,.66);
              backdrop-filter:blur(4px);
              -webkit-backdrop-filter:blur(4px);
            }
            .overlay.hidden{display:none}
            .sheet{
              position:relative;
              width:100%;
              max-width:760px;
              max-height:90vh;
              min-width:0;
              overflow:auto;
              overscroll-behavior:contain;
              padding:18px;
              background:var(--surface);
              color:var(--text);
              border:1px solid var(--line);
              border-radius:22px 22px 14px 14px;
              box-shadow:var(--shadow-strong);
            }
            .sheet-head{margin-bottom:14px}
            .sheet-head h2{margin:0}
            .close-action{display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;background:var(--surface-2);color:var(--text)}
            .section-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px;scrollbar-width:none}
            .section-tabs::-webkit-scrollbar{display:none}
            .section-tabs button{white-space:nowrap}
          }
          ''') + "\n"

          design += "@layer components {\n" + components + "\n}\n\n"
          design += "@layer patterns {\n" + premium_patterns + "\n" + simplified + "\n" + building + "\n}\n\n"
          design += "@layer features {\n" + legacy_features + "\n" + meter_features + "\n" + validation + "\n}\n\n"
          design += B(r'''
          @layer responsive {
            html,body{width:100%;max-width:100%;overflow-x:hidden}
            body{min-width:0}
            .topbar{width:100%;max-width:100vw;min-width:0}
            .brand,.building-switch,.top-actions{min-width:0}
            main,#app,.workspace-content,.card,.item,.sheet{min-width:0;max-width:100%}

            nav.main-tabs{
              left:0;
              right:0;
              bottom:0;
              transform:none;
              width:100%;
              max-width:680px;
              box-sizing:border-box;
              margin-inline:auto;
              pointer-events:auto;
            }
            nav.main-tabs button{position:relative;min-width:0;pointer-events:auto}

            #buildingAdminForm{display:block;width:100%;min-width:0}
            #buildingAdminForm>label{
              display:flex;
              width:100%;
              min-width:0;
              min-height:66px;
              margin:0 0 14px;
            }
            #buildingAdminForm>label>input,
            #buildingAdminForm>label>select,
            #buildingAdminForm>label>textarea{min-width:0;max-width:100%}
            #buildingAdminForm>.form-actions{
              display:block;
              position:static;
              width:100%;
              min-width:0;
              min-height:64px;
              margin:24px 0 0;
              padding:10px 0 0;
              background:transparent;
            }
            #buildingAdminForm>.form-actions>.primary{display:block;width:100%;min-width:0;min-height:48px}

            @media(max-width:820px){
              main{padding:16px 12px 96px}
              .workspace-layout{display:block}
              .workspace-sidebar{display:none}
