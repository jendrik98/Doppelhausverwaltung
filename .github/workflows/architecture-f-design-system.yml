          if deployment.count("mietverwaltung-v18-portfolio-admin-e-1") != 1:
              raise SystemExit("tests/deployment.spec.js: E-Cache-Fundstelle nicht eindeutig.")
          deployment = deployment.replace(
              "mietverwaltung-v18-portfolio-admin-e-1",
              "mietverwaltung-v18-design-system-f-1"
          )
          write("tests/deployment.spec.js", deployment)

          pwa = read("scripts/test-pwa-update.mjs")
          old_line = 'must(sw.includes("mietverwaltung-v18-portfolio-admin-e-1"),"Portfolio-E Production-Cache fehlt");\n'
          new_line = (
              'must(sw.includes("mietverwaltung-v18-design-system-f-1"),"Design-System-F Production-Cache fehlt");\n'
              'must(!sw.includes("mietverwaltung-v18-portfolio-admin-e-1"),"alter Portfolio-E Cache ist noch vorhanden");\n'
          )
          if pwa.count(old_line) != 1:
              raise SystemExit("scripts/test-pwa-update.mjs: E-Cache-Vertrag nicht eindeutig.")
          write("scripts/test-pwa-update.mjs", pwa.replace(old_line, new_line, 1))

          arch = read("ARCHITECTURE.md")
          if "## Schritt F: Design System & UX-Konsolidierung" in arch:
              raise SystemExit("ARCHITECTURE.md enthält Schritt F bereits.")
          arch += B(r'''

          ## Schritt F: Design System & UX-Konsolidierung

          Schritt F ersetzt die historisch gewachsene CSS-Kaskade aus Basisregeln sowie V14-/V15-/V16-/V18-
          Override-Schichten durch genau eine reproduzierbare Design-System-Quelle:
          `src/ui/design-system.css`. `style.css` ist ab F ausschließlich Build-Ausgabe aus dieser Quelle.
          Der Style-Build verweigert unter CI einen veralteten `style.css`-Stand, bevor er die Datei erzeugt.
          Damit schützt der bestehende permanente CI-Build die reproduzierbare CSS-Ausgabe ohne Workflow-Mutation.

          Das Design-System ordnet Regeln in semantische CSS-Layer (`reset`, `base`, `components`, `patterns`,
          `features`, `responsive`, `accessibility`) und definiert Light-/Dark-Mode zentral über Design Tokens.
          Historische Versionsmarker und `!important`-Notbremsen sind als Architektur-Ratchet verboten.

          Die bereits in C/D/E aufgebaute Fach- und Presentation-Architektur bleibt unverändert. Sichtbar werden
          insbesondere eine konsistente Aufgaben-/Kartenhierarchie, einheitliche Formulare, Status- und
          Leerezustände, robuste Modals, sichere iPhone-Touchflächen sowie eine eigenständige Desktop-
          Arbeitsnavigation. Die Startseite bleibt auf den nächsten sinnvollen Schritt und kontextbezogene
          Schnellaktionen ausgerichtet; der Gebäude-/Workspace-Kontext aus D/E wird nicht neu modelliert.

          `scripts/test-design-system.mjs` schützt die eine CSS-Quelle, Tokenvertrag, Layerstruktur,
          Dark-Mode-Zentralisierung, Größenratchet und das Verbot historischer Override-Schichten.
          `tests/design-system.spec.js` prüft zusätzlich 390×844-iPhone-Geometrie, Touch-Hit-Tests,
          horizontales Overflow sowie die Desktop-Arbeitsnavigation im echten Browser.

          Schritt F ändert weder App-Version (`18.0.0`), State-Schema (`15`), IndexedDB-Version (`3`) noch
          Backupformate. `app.js?v=1805` bleibt unverändert. Der Stylesheet-Key steigt auf
          `style.css?v=1810p10`, der Production-Cache auf `mietverwaltung-v18-design-system-f-1`.
          ''')
          write("ARCHITECTURE.md", arch)

          print(
              "Architecture F geschrieben: "
              f"alte CSS={len(old_style.encode('utf-8'))} Bytes, "
              f"Design-System={len(design.encode('utf-8'))} Bytes."
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App und Styles reproduzierbar bauen
        run: npm run build

      - name: TypeScript prüfen
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Validierung prüfen
        id: validation
        continue-on-error: true
        run: npm run test:validation

      - name: Architektur einschließlich F prüfen
        id: architecture
        continue-on-error: true
        run: npm run test:architecture

      - name: Quality-Ratchet prüfen
        id: quality
        continue-on-error: true
        run: npm run test:quality

      - name: PWA-Vertrag prüfen
        id: pwa
        continue-on-error: true
        run: npm run test:pwa

      - name: Reproduzierbare Build-Ausgaben prüfen
        id: reproducible
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app.js
          cmp -s src/ui/design-system.css style.css
          node scripts/test-design-system.mjs

      - name: Chromium installieren
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /etc/apt/sources.list.d ]; then
            mapfile -t google_sources < <(sudo grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null || true)
            for source in "${google_sources[@]:-}"; do
              [ -n "$source" ] || continue
              echo "Deaktiviere instabile Runner-APT-Quelle: $source"
              sudo mv "$source" "$source.disabled-architecture-f"
            done
          fi
          if [ -f /etc/apt/sources.list ] && sudo grep -q 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list; then
            sudo sed -i '\|dl.google.com/linux/chrome-stable/deb| s|^[[:space:]]*deb |# disabled by Architecture F: deb |' /etc/apt/sources.list
          fi
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/f-server.log 2>&1 &
          echo $! > /tmp/f-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/f-server.log
          exit 1

      - name: Design-System Browservertrag
        id: design_e2e
        continue-on-error: true
        run: npx playwright test tests/design-system.spec.js

      - name: Gebäude-Workspace Stabilitätsprobe
        id: workspace_stress
        continue-on-error: true
        run: npx playwright test tests/presentation-workspace.spec.js --repeat-each=3 --retries=1

      - name: Vollständige lokale Browser-E2E-Suite
        id: e2e
        continue-on-error: true
        run: npx playwright test --retries=1

      - name: F-Prüfmatrix auswerten
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1" outcome="$2"
            if [ "$outcome" = "success" ]; then
              echo "✓ $name"
            else
              echo "✗ $name: $outcome"
              failed=1
            fi
          }
          check "TypeScript" "${{ steps.typecheck.outcome }}"
          check "Validation" "${{ steps.validation.outcome }}"
          check "Architecture + Design System" "${{ steps.architecture.outcome }}"
          check "Quality" "${{ steps.quality.outcome }}"
          check "PWA" "${{ steps.pwa.outcome }}"
          check "Reproducible build" "${{ steps.reproducible.outcome }}"
          check "Design-System E2E" "${{ steps.design_e2e.outcome }}"
          check "Building workspace stress" "${{ steps.workspace_stress.outcome }}"
          check "Full E2E" "${{ steps.e2e.outcome }}"
          test "$failed" -eq 0

      - name: F-Änderungsumfang verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          cat > /tmp/f-expected-files.txt <<'EOF'
          ARCHITECTURE.md
          index.html
          package.json
          scripts/build-styles.mjs
          scripts/test-design-system.mjs
          scripts/test-pwa-update.mjs
          service-worker.js
          src/ui/design-system.css
          style.css
          tests/deployment.spec.js
          tests/design-system.spec.js
          EOF

          { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u > /tmp/f-actual-files.txt
          sort -o /tmp/f-expected-files.txt /tmp/f-expected-files.txt
          diff -u /tmp/f-expected-files.txt /tmp/f-actual-files.txt

          test -e .github/workflows/architecture-e-portfolio-administration.yml
          test ! -e .github/workflows/architecture-d-presentation-workspace.yml
          test -e .github/workflows/architecture-f-design-system.yml
          test -e .github/workflows/ci.yml
          test -e .github/workflows/e2e-live.yml

          test -e src/ui/design-system.css
          test -e scripts/build-styles.mjs
          test -e scripts/test-design-system.mjs
          test -e tests/design-system.spec.js
          cmp -s src/ui/design-system.css style.css

          grep -q 'Mietverwaltung Design System F' src/ui/design-system.css
          grep -q '@layer reset, base, components, patterns, features, responsive, accessibility;' src/ui/design-system.css
          ! grep -q 'V14 Navigation & UX' style.css
          ! grep -q 'V16 Premium Final' style.css
          ! grep -q 'V18 consolidated olive theme' style.css
          ! grep -q 'Architecture E: mobile touch safety' style.css
          ! grep -q '!important' style.css

          grep -q 'style.css?v=1810p10' index.html
          grep -q 'app.js?v=1805' index.html
          grep -q 'mietverwaltung-v18-design-system-f-1' service-worker.js
          grep -q 'git diff --exit-code -- app.js' .github/workflows/ci.yml
          test -z "$(git diff --name-only HEAD -- .github/workflows)"

          test -z "$(git diff --name-only HEAD -- src/application src/presentation src/domain src/core src/infrastructure src/io src/ui/app-runtime.ts src/ui/building-workspace-ui.ts app.js)"
          echo "F-Änderungen:"
          git status --short

      - name: F-Produktcommit erstellen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ARCHITECTURE.md \
            index.html \
            package.json \
            scripts/build-styles.mjs \
            scripts/test-design-system.mjs \
            scripts/test-pwa-update.mjs \
            service-worker.js \
            src/ui/design-system.css \
            style.css \
            tests/deployment.spec.js \
            tests/design-system.spec.js

          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m "Consolidate design system and responsive UX"
          git push origin HEAD:main
          echo "F_PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Ergebnis
        run: |
          echo "Architecture F Produktcommit: ${F_PRODUCT_SHA}"
          echo "Temporäre E/F-Workflows bleiben absichtlich unverändert und werden nach der F-Verifikation manuell entfernt."
          echo "Danach Pages, permanentes CI und permanentes Live-E2E exakt für F_PRODUCT_SHA prüfen."
