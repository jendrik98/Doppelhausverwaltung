      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build, TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp app.js /tmp/app-phase10-first.js
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          test ! -e src/legacy
          test -f src/runtime/order.json
          test -f src/runtime/900-app-entry.js
          test -f src/ui/app-runtime.ts
          grep -F 'compiled src/ui/app-runtime.ts' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Reproduzierbaren Build erzwingen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cmp --silent /tmp/app-phase10-first.js app.js || { echo "FEHLER: Zweiter Build erzeugt eine abweichende app.js."; exit 1; }
          git diff --check

      - name: Fach-, Daten-, Runtime- und Sicherheitsinvarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const DOMAIN_VERSION=1;' src/runtime/020-domain.js
          grep -F 'const APP_VERSION="18.0.0";' src/runtime/030-integrity.js
          grep -F 'let LAST_STABLE_STATE=null;' src/runtime/030-integrity.js
          grep -F 'let ACTIVE_LEGAL_PACK=null;' src/runtime/090-legal-rules.js
          grep -F 'export const LAW_DATE="2026-09-05"' src/domain/legal-rules.ts
          grep -F 'mietverwaltung-legal-pack-v1' src/domain/legal-rules.ts
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          grep -F '"architectureVersion": 2' src/runtime/order.json
          grep -F 'src/runtime/900-app-entry.js' src/runtime/order.json
          ! grep -F '140-tests.js' src/runtime/order.json
          ! grep -F '150-ui.js' src/runtime/order.json
          ! grep -F '160-app.js' src/runtime/order.json
          grep -F 'export async function start()' src/ui/app-runtime.ts
          grep -F 'function runSelfTests()' src/ui/app-runtime.ts
          grep -F 'let MODAL_RETURN_FOCUS=null,MODAL_INITIAL_FORM="",MODAL_RETURN_FOCUS_OVERRIDE=null;' src/ui/app-runtime.ts
          grep -F 'function render()' src/ui/app-runtime.ts
          grep -F 'async function startApp()' src/ui/app-runtime.ts
          grep -F 'await AppRuntime.start();' src/runtime/900-app-entry.js
          test ! -e .github/workflows/architecture-typescript-phase9-v6.yml
          test ! -e .github/workflows/architecture-typescript-phase10.yml
          test -f .github/workflows/e2e-live.yml

      - name: Chromium und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Testserver starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Exakt 25 Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Playwright-Tests, gefunden: ${TOTAL:-0}"
            exit 1
          fi

      - name: Strenges 25-von-25-Gate
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --retries=0 --reporter=json > /tmp/e2e.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/e2e.json').read_text(encoding='utf-8'))
          stats = report.get('stats') or {}
          expected = int(stats.get('expected', -1))
          unexpected = int(stats.get('unexpected', -1))
          flaky = int(stats.get('flaky', -1))
          skipped = int(stats.get('skipped', -1))
          total = expected + unexpected + flaky + skipped
          print(f"Playwright: total={total}, passed={expected}, failed={unexpected}, flaky={flaky}, skipped={skipped}, retries=0")
          if not (total == 25 and expected == 25 and unexpected == 0 and flaky == 0 and skipped == 0):
              raise SystemExit("FEHLER: Strenges Gate verlangt exakt 25/25 bestanden, 0 Fehler, 0 Flakes, 0 Skips und 0 Retries.")
          PY

      - name: Änderungsumfang kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only --no-renames HEAD; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual-diff.txt
          cat > /tmp/allowed-diff.txt <<'EOF'
          .github/workflows/architecture-typescript-phase10.yml
          .github/workflows/architecture-typescript-phase9-v6.yml
          ARCHITECTURE.md
          app.js
          scripts/build-app.mjs
          scripts/test-architecture.mjs
          src/legacy/000-runtime-preamble.js
          src/legacy/010-schema.js
          src/legacy/020-domain.js
          src/legacy/030-integrity.js
          src/legacy/040-traceability.js
          src/legacy/050-intelligence.js
          src/legacy/060-quality.js
          src/legacy/070-smart-engine.js
          src/legacy/080-v18-billing-assistant-preview.js
          src/legacy/090-legal-rules.js
          src/legacy/100-domain-2.js
          src/legacy/110-db.js
          src/legacy/120-security.js
          src/legacy/130-backup.js
          src/legacy/140-tests.js
          src/legacy/150-ui.js
          src/legacy/160-app.js
          src/legacy/order.json
          src/runtime/000-runtime-preamble.js
          src/runtime/010-schema.js
          src/runtime/020-domain.js
          src/runtime/030-integrity.js
          src/runtime/040-traceability.js
          src/runtime/050-intelligence.js
          src/runtime/060-quality.js
          src/runtime/070-smart-engine.js
          src/runtime/080-v18-billing-assistant-preview.js
          src/runtime/090-legal-rules.js
          src/runtime/100-domain-2.js
          src/runtime/110-db.js
          src/runtime/120-security.js
          src/runtime/130-backup.js
          src/runtime/900-app-entry.js
          src/runtime/order.json
          src/ui/app-runtime.ts
          EOF
          sort -o /tmp/allowed-diff.txt /tmp/allowed-diff.txt
          echo "Geänderte Dateien:"
          cat /tmp/actual-diff.txt
          cmp --silent /tmp/actual-diff.txt /tmp/allowed-diff.txt || { echo "FEHLER: Unerwarteter Änderungsumfang."; diff -u /tmp/allowed-diff.txt /tmp/actual-diff.txt || true; exit 1; }

      - name: Phase 10 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete TypeScript migration and retire legacy source tree"
          git push origin HEAD:main
