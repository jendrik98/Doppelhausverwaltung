          base64 -d /tmp/operating-cost-contract-patch.b64 > /tmp/operating-cost-contract-patch.py
          test "$(sha256sum /tmp/operating-cost-contract-patch.py | awk '{print $1}')" = "bc49ef288eb28e7b42016546d9262950b8c9a32221d63aed1d238ddaea3d4caa"
          python3 -m py_compile /tmp/operating-cost-contract-patch.py
          python3 /tmp/operating-cost-contract-patch.py
          rm -f /tmp/operating-cost-contract-patch.py /tmp/operating-cost-contract-patch.b64

          rm -f "$SELF_PATH"
          test ! -e "$SELF_PATH"
          mapfile -t WORKFLOWS < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          test "$(printf '%s\n' "${WORKFLOWS[@]}")" = $'ci.yml\ne2e-live.yml'
          git diff --check

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbar bauen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA="$(sha256sum app.js | awk '{print $1}')"
          echo "APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          cp app.js /tmp/app-first-build.js
          npm run build
          cmp -s /tmp/app-first-build.js app.js
          test "$APP_SHA" = "$(sha256sum app.js | awk '{print $1}')"
          git diff --check

      - name: TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa

      - name: Browser-Prüfwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mietverwaltung-http.log 2>&1 &
          echo $! > /tmp/mietverwaltung-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mietverwaltung-http.log
          exit 1

      - name: Neue Vertragsbasis gezielt prüfen
        run: npx playwright test tests/operating-cost-contract.spec.js --workers=1

      - name: Vollständige lokale E2E-Suite
        run: npm run test:e2e

      - name: Playwright-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-cost-contract-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalen Produkt-Tree verifizieren
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q 'operatingCostContractDecision' src/domain/lifecycle-ledger.ts
          grep -q 'applyOperatingCostAgreementToAnalysis' src/domain/property-domain.ts
          grep -q 'contractAgreement' src/domain/billing-domain.ts
          grep -q 'BK-Umlagegrundlage im Mietverhältnis' src/domain/billing-domain.ts
          grep -q 'updateOperatingCostAgreementCommand' src/application/rental-lifecycle.ts
          grep -q 'BK-Umlagegrundlage' src/ui/rental-lifecycle-ui.ts
          test -f tests/operating-cost-contract.spec.js
          grep -q 'app.js?v=1813' index.html
          grep -q 'mietverwaltung-v18-operating-cost-contract-1' service-worker.js
          grep -q 'mietverwaltung-v18-operating-cost-contract-1' scripts/test-pwa-update.mjs
          grep -q '2026.09.11-1' legal-rules.json
          grep -q 'SCHEMA_VERSION = 15' src/core/state.ts
          grep -q 'appVersion: "18.0.0"' src/core/state.ts
          test "$(sha256sum app.js | awk '{print $1}')" = "$APP_SHA"
          git diff --check
          git status --short

      - name: Produktcommit erstellen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Keine Produktänderungen zum Committen."
            exit 1
          fi
          git commit -m "feat: guard operating-cost billing by lease contract"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          echo "Finaler Produkt-SHA: $FINAL_SHA"

      - name: Permanente CI und Live-E2E abwarten
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            for i in {1..72}; do
              id="$(gh run list --workflow "$workflow" --branch main --limit 40 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == env.FINAL_SHA) | .databaseId' | head -n1)"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            return 1
          }
          CI_RUN="$(find_run ci.yml)" || { echo "::error::Kein CI-Lauf für $FINAL_SHA gefunden."; exit 1; }
          LIVE_RUN="$(find_run e2e-live.yml)" || { echo "::error::Kein Live-E2E-Lauf für $FINAL_SHA gefunden."; exit 1; }
          echo "CI run: $CI_RUN"
          echo "Live run: $LIVE_RUN"
          gh run watch "$CI_RUN" --exit-status
          gh run watch "$LIVE_RUN" --exit-status
          test "$(gh run view "$CI_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"
          test "$(gh run view "$LIVE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"

      - name: Abschluss
        run: |
          echo "Betriebskosten-Vertragsbasis ist implementiert."
          echo "Finaler SHA: $FINAL_SHA"
          echo "app.js SHA-256: $APP_SHA"
          echo "Permanente CI und Live-E2E sind grün."
