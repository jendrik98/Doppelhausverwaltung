name: 10/10 – Betriebskosten-Vertragsbasis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operating-cost-contract-guardrail.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: 87cce126ed920a8e064ed897a597500003a55cd1
  SELF_PATH: .github/workflows/operating-cost-contract-guardrail.yml
  MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  E2E_BASE_URL: http://127.0.0.1:4173/

jobs:
  operating-cost-contract:
    name: Vertragsbasis absichern, testen, pushen
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAINT_TOKEN:-}" ]; then
            echo "::error::Repository-Secret REPO_MAINTENANCE_TOKEN fehlt."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA" || {
            echo "::error::Basis $BASE_SHA ist kein Vorfahr von $TRIGGER_SHA."
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            echo "Seit dem grünen Runtime-Headroom-Stand geändert: ${CHANGED[*]}"
            echo "::error::Vor diesem Pass darf seit $BASE_SHA ausschließlich $SELF_PATH hinzugekommen/geändert worden sein."
            exit 1
          fi
          test -f .github/workflows/ci.yml
          test -f .github/workflows/e2e-live.yml
          test -f "$SELF_PATH"
          echo "TRIGGER_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"

      - name: Betriebskosten-Vertragsbasis anwenden
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/operating-cost-contract-patch.b64 <<'PATCH_B64'
          ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCBqc29uLCByZQoKUk9PVD1QYXRoKCcuJykK
