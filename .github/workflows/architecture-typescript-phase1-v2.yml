name: Architecture migration – TypeScript phase 1 v2

on:
  push:
    paths:
      - ".github/workflows/architecture-typescript-phase1-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ausgangsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const APP_VERSION="18.0.0";' app.js
          grep -F 'mietverwaltung-v18-consolidated-preview-1' service-worker.js
          test -f tests/navigation-simplified.spec.js
          test -f tests/v18-assistant.spec.js
          test ! -f ARCHITECTURE.md
          echo "Ausgangsstand für die einmalige Architektur-Migration passt."

      - name: Bestehende app.js verlustfrei in Quellbereiche zerlegen
        shell: bash
        run: |
          set -euo pipefail
          cp app.js /tmp/app-before-architecture.js
          sha256sum /tmp/app-before-architecture.js | awk '{print $1}' >/tmp/app-before.sha

          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil

          app_path = Path("app.js")
          text = app_path.read_text(encoding="utf-8")

          marker_re = re.compile(r'/\* ===== ([^=\n]+?) ===== \*/')
          matches = list(marker_re.finditer(text))
          if len(matches) < 2:
              raise SystemExit(f"Zu wenige vorhandene Modulmarker in app.js: {len(matches)}")

          root = Path("src/legacy")
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)

          def slug(name):
              value = name.strip().lower()
              value = re.sub(r'\.js$', '', value)
              value = re.sub(r'[^a-z0-9]+', '-', value).strip('-')
              return value or "section"

          parts = []
          # Preamble keeps the existing async wrapper/strict-mode opening byte-for-byte.
          parts.append(("000-runtime-preamble.js", text[:matches[0].start()]))

          used = {}
          for i, m in enumerate(matches):
              end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
              raw_name = m.group(1).strip()
              base = slug(raw_name)
              used[base] = used.get(base, 0) + 1
              suffix = f"-{used[base]}" if used[base] > 1 else ""
              filename = f"{(i + 1) * 10:03d}-{base}{suffix}.js"
              parts.append((filename, text[m.start():end]))

          order = []
          rebuilt = []
          for filename, content in parts:
              path = root / filename
              path.write_text(content, encoding="utf-8")
              order.append(path.as_posix())
              rebuilt.append(content)

          if "".join(rebuilt) != text:
              raise SystemExit("Roundtrip der Quellzerlegung ist nicht byte-identisch.")

          (root / "order.json").write_text(
              json.dumps({"architectureVersion": 1, "files": order}, indent=2) + "\n",
              encoding="utf-8",
          )

          (root / "README.md").write_text(
              """# Legacy compatibility source\n\n"
              "Diese Dateien wurden aus der zuletzt vollständig getesteten `app.js` "
              "verlustfrei nach vorhandenen Verantwortungs-Markern getrennt. "
              "Sie sind die Übergangsschicht: neue oder überarbeitete Fachlogik wird "
              "schrittweise nach TypeScript unter `src/core`, `src/domain` und `src/ui` migriert. "
              "`app.js` wird künftig ausschließlich über `npm run build` erzeugt und nicht "
              "mehr direkt bearbeitet.\n""",
              encoding="utf-8",
          )

          print(f"{len(parts)} Quellbereiche erzeugt.")
          for path in order:
              print(" -", path)
          PY

      - name: Build-System und TypeScript-Grundlage anlegen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts src/core

          cat > scripts/build-app.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const manifestPath = path.join(root, "src", "legacy", "order.json");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

          if (!Array.isArray(manifest.files) || manifest.files.length < 2) {
            throw new Error("src/legacy/order.json enthält keine plausible Build-Reihenfolge.");
          }

          let output = "";
          for (const rel of manifest.files) {
            const absolute = path.join(root, rel);
            if (!fs.existsSync(absolute)) throw new Error(`Build-Quelle fehlt: ${rel}`);
            output += fs.readFileSync(absolute, "utf8");
          }

          fs.writeFileSync(path.join(root, "app.js"), output, "utf8");
          console.log(`app.js aus ${manifest.files.length} Quellbereichen erzeugt (${output.length} Zeichen).`);
          EOF

          cat > src/core/validation.ts <<'EOF'
          export type ValidationLevel = "ok" | "warning" | "error";

          export interface ValidationResult<T = string> {
            ok: boolean;
            level: ValidationLevel;
            value?: T;
            message?: string;
          }

          const valid = <T>(value: T): ValidationResult<T> => ({ ok: true, level: "ok", value });
          const invalid = <T = string>(message: string): ValidationResult<T> => ({ ok: false, level: "error", message });

          export function normalizeIban(input: string): string {
            return String(input ?? "").replace(/\s+/g, "").toUpperCase();
          }

          export function validateIban(input: string, required = false): ValidationResult<string> {
            const iban = normalizeIban(input);
            if (!iban) return required ? invalid("IBAN fehlt.") : valid("");

            if (!/^[A-Z]{2}\d{2}[A-Z0-9]+$/.test(iban)) {
              return invalid("Die IBAN hat kein gültiges Format.");
            }
            if (iban.length < 15 || iban.length > 34) {
              return invalid("Die IBAN hat eine unplausible Länge.");
            }
            if (iban.startsWith("DE") && iban.length !== 22) {
              return invalid("Eine deutsche IBAN muss 22 Stellen haben.");
            }

            const rearranged = iban.slice(4) + iban.slice(0, 4);
            let remainder = 0;
            for (const ch of rearranged) {
              const digits = /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch;
              for (const digit of digits) remainder = (remainder * 10 + Number(digit)) % 97;
            }
            return remainder === 1 ? valid(iban) : invalid("Die Prüfsumme der IBAN ist ungültig.");
          }

          export function parseGermanNumber(input: unknown): number | null {
            let text = String(input ?? "").trim().replace(/\s+/g, "");
            if (!text) return null;
            if (text.includes(",") && text.includes(".")) {
              if (text.lastIndexOf(",") > text.lastIndexOf(".")) text = text.replace(/\./g, "").replace(",", ".");
              else text = text.replace(/,/g, "");
            } else if (text.includes(",")) {
              text = text.replace(",", ".");
            }
            if (!/^-?\d+(?:\.\d+)?$/.test(text)) return null;
            const value = Number(text);
            return Number.isFinite(value) ? value : null;
          }

          export function validateMoney(input: unknown, options: { required?: boolean; min?: number; max?: number } = {}): ValidationResult<number | null> {
            const text = String(input ?? "").trim();
            if (!text) return options.required ? invalid("Betrag fehlt.") : valid(null);
            const value = parseGermanNumber(text);
            if (value === null) return invalid("Der Betrag ist keine gültige Zahl.");
            if (options.min !== undefined && value < options.min) return invalid(`Der Betrag muss mindestens ${options.min} sein.`);
            if (options.max !== undefined && value > options.max) return invalid(`Der Betrag darf höchstens ${options.max} sein.`);
            return valid(value);
          }

          export function validatePositiveNumber(input: unknown, label: string, allowZero = false): ValidationResult<number> {
            const value = parseGermanNumber(input);
            if (value === null) return invalid(`${label} ist keine gültige Zahl.`);
            if (allowZero ? value < 0 : value <= 0) return invalid(`${label} muss ${allowZero ? "mindestens 0" : "größer als 0"} sein.`);
            return valid(value);
          }

          export function validateArea(input: unknown): ValidationResult<number> {
            const result = validatePositiveNumber(input, "Wohnfläche");
            if (!result.ok) return result;
            if ((result.value ?? 0) > 10000) return invalid("Die Wohnfläche ist unplausibel groß.");
            return result;
          }

          export function validateYear(input: unknown, min = 1800, max = new Date().getFullYear() + 5): ValidationResult<number> {
            const value = Number(input);
            if (!Number.isInteger(value)) return invalid("Das Jahr ist ungültig.");
            if (value < min || value > max) return invalid(`Das Jahr muss zwischen ${min} und ${max} liegen.`);
            return valid(value);
          }

          export function validateIsoDate(input: string, required = false): ValidationResult<string> {
            const value = String(input ?? "").trim();
            if (!value) return required ? invalid("Datum fehlt.") : valid("");
            const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!match) return invalid("Das Datum hat kein gültiges Format.");
            const [, y, m, d] = match;
            const date = new Date(Date.UTC(Number(y), Number(m) - 1, Number(d)));
            const same =
              date.getUTCFullYear() === Number(y) &&
              date.getUTCMonth() + 1 === Number(m) &&
              date.getUTCDate() === Number(d);
            return same ? valid(value) : invalid("Das Datum existiert nicht.");
          }

          export function validateDateRange(start: string, end: string): ValidationResult<{ start: string; end: string }> {
            const a = validateIsoDate(start, true);
            if (!a.ok) return invalid(`Startdatum: ${a.message}`);
            const b = validateIsoDate(end, true);
            if (!b.ok) return invalid(`Enddatum: ${b.message}`);
            if (start > end) return invalid("Das Enddatum liegt vor dem Startdatum.");
            return valid({ start, end });
          }

          export function validateMeterReading(input: unknown, previous?: number): ValidationResult<number> {
            const current = parseGermanNumber(input);
            if (current === null || current < 0) return invalid("Der Zählerstand ist ungültig.");
            if (previous !== undefined && current < previous) {
              return {
                ok: true,
                level: "warning",
                value: current,
                message: "Der neue Zählerstand ist kleiner als der vorherige. Bitte Zählerwechsel oder Eingabe prüfen.",
              };
            }
            return valid(current);
          }

          export function validateEmail(input: string, required = false): ValidationResult<string> {
            const value = String(input ?? "").trim();
            if (!value) return required ? invalid("E-Mail-Adresse fehlt.") : valid("");
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value) ? valid(value) : invalid("Die E-Mail-Adresse ist ungültig.");
          }

          export function validatePostalCodeDE(input: string, required = false): ValidationResult<string> {
            const value = String(input ?? "").trim();
            if (!value) return required ? invalid("Postleitzahl fehlt.") : valid("");
            return /^\d{5}$/.test(value) ? valid(value) : invalid("Eine deutsche Postleitzahl muss aus 5 Ziffern bestehen.");
          }
          EOF

          cat > src/core/feedback.ts <<'EOF'
          export type FeedbackKind = "success" | "error" | "warning" | "info";

          export interface FeedbackOptions {
            kind?: FeedbackKind;
            timeoutMs?: number;
          }

          export function showToast(message: string, options: FeedbackOptions = {}): void {
            const kind = options.kind ?? "success";
            const timeoutMs = options.timeoutMs ?? 2600;

            let region = document.getElementById("app-feedback-region");
            if (!region) {
              region = document.createElement("div");
              region.id = "app-feedback-region";
              region.setAttribute("aria-live", kind === "error" ? "assertive" : "polite");
              region.setAttribute("aria-atomic", "true");
              document.body.appendChild(region);
            }

            const toast = document.createElement("div");
            toast.className = `app-toast app-toast-${kind}`;
            toast.setAttribute("role", kind === "error" ? "alert" : "status");
            toast.textContent = message;
            region.appendChild(toast);

            window.setTimeout(() => {
              toast.classList.add("is-leaving");
              window.setTimeout(() => toast.remove(), 180);
            }, timeoutMs);
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ES2022",
              "moduleResolution": "Bundler",
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true
            },
            "include": ["src/core/**/*.ts"]
          }
          EOF

          cat > scripts/test-validation.mjs <<'EOF'
          import fs from "node:fs";
          import { transform } from "esbuild";

          const source = fs.readFileSync("src/core/validation.ts", "utf8");
          const compiled = await transform(source, {
            loader: "ts",
            format: "cjs",
            target: "es2022",
            sourcemap: false
          });

          const module = { exports: {} };
          const execute = new Function("module", "exports", compiled.code);
          execute(module, module.exports);
          const v = module.exports;

          const checks = [
            [v.validateIban("test", true).ok === false, "IBAN 'test' muss abgewiesen werden"],
            [v.validateIban("DE89370400440532013000", true).ok === true, "gültige Test-IBAN muss akzeptiert werden"],
            [v.validateIban("DE89370400440532013001", true).ok === false, "falsche IBAN-Prüfsumme muss abgewiesen werden"],
            [v.validateMoney("1.234,56", { required: true }).value === 1234.56, "deutsches Geldformat"],
            [v.validateArea("0").ok === false, "0 m² muss abgewiesen werden"],
            [v.validateIsoDate("2026-02-30", true).ok === false, "nicht existentes Datum"],
            [v.validateDateRange("2026-09-02", "2026-09-01").ok === false, "umgekehrter Datumsbereich"],
            [v.validateMeterReading("90", 100).level === "warning", "fallender Zählerstand muss warnen"]
          ];

          const failed = checks.filter(([ok]) => !ok);
          if (failed.length) {
            for (const [, label] of failed) console.error("FEHLER:", label);
            process.exit(1);
          }
          console.log(`${checks.length} Validation-Basistests bestanden.`);
          EOF

          cat > ARCHITECTURE.md <<'EOF'
          # Architektur der Doppelhausverwaltung

          ## Zielbild

          Die PWA bleibt eine schlanke Browser-App. Quellcode wird künftig nach Verantwortung getrennt
          und über einen reproduzierbaren Build zu `app.js` zusammengesetzt.

          Neue oder stark überarbeitete Logik wird in TypeScript geschrieben.

          Geplante Struktur:

          - `src/core/` – Validierung, Feedback, State/Persistenz, gemeinsame Hilfen
          - `src/domain/` – Haus, Mietverhältnis, Wasser, Finanzen, Abrechnung
          - `src/ui/` – Router, Dialoge, Komponenten und Ansichten
          - `src/io/` – Backup, PDF, OCR, Import/Export
          - `src/legacy/` – nur die noch nicht migrierten Teile des bisherigen, bereits getesteten Codes
          - `scripts/` – Build- und Qualitätswerkzeuge

          ## Wichtiger Migrationsgrundsatz

          Phase 1 verändert bewusst keine Fachfunktion der Live-App.
          Die bestehende `app.js` wird byte-identisch in wartbare Quellbereiche zerlegt.
          Der Browser erhält weiterhin dieselbe `app.js`.

          Danach werden die Bereiche einzeln nach TypeScript migriert. Erst wenn ein Bereich
          migriert und durch Tests abgesichert ist, wird sein Legacy-Teil entfernt.

          ## Eingabevalidierung

          `src/core/validation.ts` enthält die neue zentrale Validierungsbasis, unter anderem:
          IBAN-Prüfsumme, Geldwerte, Wohnflächen, Jahre, echte ISO-Daten, Datumsbereiche,
          Zählerstände, E-Mail und deutsche Postleitzahlen.

          In der nächsten Phase werden alle Formulare auf diese zentrale Validierung umgestellt.
          Harte Fehler verhindern das Speichern. Ungewöhnliche, aber mögliche Werte erzeugen
          eine Warnung mit bewusster Bestätigung.

          ## Benutzerfeedback

          `src/core/feedback.ts` enthält die gemeinsame Toast/Snackbar-Basis.
          In der nächsten Phase ersetzt sie uneinheitliche Erfolgsmeldungen und ergänzt
          sichtbare Rückmeldungen nach Speichern, Import, Export und anderen Aktionen.

          ## app.js

          `app.js` ist ab dieser Architektur ein Build-Artefakt.
          Sie soll nicht mehr direkt manuell bearbeitet werden.
          Änderungen erfolgen in `src/` und anschließend über `npm run build`.
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          .build/
          playwright-report/
          test-results/
          *.log
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("package.json")
          pkg = json.loads(p.read_text(encoding="utf-8"))
          pkg["private"] = True
          pkg["scripts"] = {
              "build": "node scripts/build-app.mjs",
              "typecheck": "tsc -p tsconfig.json",
              "test:validation": "node scripts/test-validation.mjs",
              "test:e2e": "playwright test",
              "test:report": "playwright show-report"
          }
          dev = dict(pkg.get("devDependencies", {}))
          dev["@playwright/test"] = "1.63.0"
          dev["typescript"] = "7.0.2"
          dev["esbuild"] = "0.28.2"
          pkg["devDependencies"] = dev
          p.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten reproduzierbar aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          # node_modules gehört nicht ins Repository.
          git rm -r --cached --ignore-unmatch node_modules >/dev/null 2>&1 || true
          rm -rf node_modules
          npm install --package-lock-only
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Architektur und TypeScript prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          AFTER="$(sha256sum app.js | awk '{print $1}')"
          BEFORE="$(cat /tmp/app-before.sha)"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "FEHLER: Architektur-Migration hat app.js inhaltlich verändert."
            echo "Vorher: $BEFORE"
            echo "Nachher: $AFTER"
            diff -u /tmp/app-before-architecture.js app.js | head -200 || true
            exit 1
          fi
          echo "app.js ist nach dem Build byte-identisch."

          npm run typecheck
          npm run test:validation

          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-validation.mjs
          if grep -Fq 'ts.ModuleKind' scripts/test-validation.mjs; then
            echo "FEHLER: alter inkompatibler TypeScript-Test-Harness noch vorhanden."
            exit 1
          fi
          grep -F 'import { transform } from "esbuild";' scripts/test-validation.mjs
          node -e "JSON.parse(require('fs').readFileSync('src/legacy/order.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

          test -f src/core/validation.ts
          test -f src/core/feedback.ts
          test -f ARCHITECTURE.md
          test -f .gitignore
          test ! -e node_modules/.package-lock.json || true

          if git diff --name-only -- .github/workflows | grep -q .; then
            echo "FEHLER: Die Arbeitskopie versucht Workflow-Dateien zu ändern."
            exit 1
          fi

      - name: Lokalen Preview-Server starten
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mv-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Lokaler Preview-Server bereit."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mv-http.log || true
          exit 1

      - name: Exakt 24 Browsertests ohne Retry
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
          EXPECTED_APP_VERSION: 18.0.0
          CI: 1
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.log
          grep -Eq 'Total: 24 tests' /tmp/test-list.log

          npx playwright test | tee /tmp/e2e.log
          grep -Eq '24 passed' /tmp/e2e.log
          if grep -Eiq '[0-9]+ failed|flaky' /tmp/e2e.log; then
            echo "Fehler oder Flake im Architektur-Preflight."
            exit 1
          fi

      - name: Nur vollständig geprüfte Architektur committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "FEHLER: Geschützte Workflow-Dateien würden durch den Bot geändert."
            git diff --cached --name-only
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi

          echo "Geprüfte Architekturänderungen:"
          git diff --cached --stat

          git commit -m "Introduce modular TypeScript architecture foundation"
          git push
