name: Apply olive visual refresh

on:
  push:
    paths:
      - ".github/workflows/apply-olive-visual-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Olive Theme anwenden
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/olive_theme_patch.py
          python /tmp/olive_theme_patch.py

      - name: Technisch prüfen
        shell: bash
        run: |
          node --check service-worker.js
          grep -F 'V18.1 olive visual refresh' style.css
          grep -F 'prefers-color-scheme: dark' style.css
          grep -F 'color:var(--text)!important' style.css
          grep -F '<meta name="theme-color" content="#6f7d37" media="(prefers-color-scheme: light)">' index.html
          grep -F '<meta name="theme-color" content="#11150d" media="(prefers-color-scheme: dark)">' index.html

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Der Olive-Refresh ist bereits vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git commit -m "Apply olive light/dark visual refresh"
          git push
