name: UX 10/10 – Summary Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summary-cards-polish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: b390cbce71ef95b770d8cd0d7dd63e591e63e9d7
  SELF_PATH: .github/workflows/summary-cards-polish.yml
  MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  E2E_BASE_URL: http://127.0.0.1:4173/

jobs:
  fix:
    name: Summary-Karten korrigieren, testen, pushen
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAINT_TOKEN:-}" || { echo "::error::REPO_MAINTENANCE_TOKEN fehlt."; exit 1; }

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            echo "Seit Visual Polish geändert: ${CHANGED[*]}"
            echo "::error::Vor Summary-Card-Fix darf seit $BASE_SHA ausschließlich $SELF_PATH hinzugekommen sein."
            exit 1
          fi
          test -f .github/workflows/ci.yml
          test -f .github/workflows/e2e-live.yml
          test -f "$SELF_PATH"

      - name: Summary-Card-Fix anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/summary_cards_patch.py
          test "$(sha256sum /tmp/summary_cards_patch.py | awk '{print $1}')" = "84b3bf371c6a9b727681b1d0a4147a83a3136be52be3e8125659b1281b9809a4"
          python3 -m py_compile /tmp/summary_cards_patch.py
          python3 /tmp/summary_cards_patch.py
          rm -f /tmp/summary_cards_patch.py
          rm -f "$SELF_PATH"
          test ! -e "$SELF_PATH"
          git diff --check

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA_1="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_1="$(sha256sum style.css | awk '{print $1}')"
          npm run build
          APP_SHA_2="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_2="$(sha256sum style.css | awk '{print $1}')"
          test "$APP_SHA_1" = "$APP_SHA_2"
          test "$STYLE_SHA_1" = "$STYLE_SHA_2"
          cmp -s src/ui/design-system.css style.css
          grep -q 'style.css?v=1810p13' index.html
          grep -q 'mietverwaltung-v18-summary-cards-1' service-worker.js
          grep -q 'sha256sum style.css' .github/workflows/e2e-live.yml
          echo "APP_SHA=$APP_SHA_2" >> "$GITHUB_ENV"
          echo "STYLE_SHA=$STYLE_SHA_2" >> "$GITHUB_ENV"

      - name: TypeScript und Qualitäts-Gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js

      - name: Browser und PDF-Prüfwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dhv-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dhv-http.log
          exit 1

      - name: Betroffene iPhone-Karten wiederholt prüfen
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/visual-polish.spec.js --repeat-each=5
          npx playwright test tests/design-system.spec.js tests/navigation-natural.spec.js --repeat-each=2

      - name: Vollständige E2E-Suite prüfen
        run: npm run test:e2e

      - name: Playwright-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-cards-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalen Tree verifizieren
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q 'style.css?v=1810p13' tests/deployment.spec.js
          grep -q 'mietverwaltung-v18-summary-cards-1' scripts/test-pwa-update.mjs
          grep -q '#data/overview' tests/visual-polish.spec.js
          grep -q '#more/protection' tests/visual-polish.spec.js
          cmp -s src/ui/design-system.css style.css
          git diff --check

      - name: Produktcommit erstellen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::Keine Produktänderungen."; exit 1; }
          git commit -m "style: fix summary card hierarchy"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"

      - name: Permanente CI und Live-E2E abwarten
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            for i in {1..72}; do
              id="$(gh run list --workflow "$workflow" --branch main --limit 40 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == env.FINAL_SHA) | .databaseId' | head -n1)"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            return 1
          }
          CI_RUN="$(find_run ci.yml)" || { echo "::error::Kein CI-Lauf für $FINAL_SHA."; exit 1; }
          LIVE_RUN="$(find_run e2e-live.yml)" || { echo "::error::Kein Live-E2E-Lauf für $FINAL_SHA."; exit 1; }
          gh run watch "$CI_RUN" --exit-status
          gh run watch "$LIVE_RUN" --exit-status
          test "$(gh run view "$CI_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"
          test "$(gh run view "$LIVE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"

      - name: Abschluss
        run: |
          echo "Summary-Card-Fix vollständig."
          echo "Finaler SHA: $FINAL_SHA"
          echo "app.js SHA-256: $APP_SHA"
          echo "style.css SHA-256: $STYLE_SHA"
