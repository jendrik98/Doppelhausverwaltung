name: Release V18.0.0 core

on:
  push:
    paths:
      - ".github/workflows/release-v18-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V18.0.0 Versionsstand setzen
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/release_v18.py
          python /tmp/release_v18.py

      - name: Release technisch prüfen
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          node --check tests/deployment.spec.js

          grep -F 'const APP_VERSION="18.0.0";' app.js
          test "$(grep -o 'appVersion:"18.0.0"' app.js | wc -l)" -eq 2
          grep -F 'app.js?v=1800' index.html
          grep -F '>V18</span>' index.html
          grep -F 'mietverwaltung-v18-0-0-core' service-worker.js
          grep -F './app.js?v=1800' service-worker.js
          grep -F 'APP_VERSION="18.0.0"' tests/deployment.spec.js
          grep -F "toHaveText('V18')" tests/deployment.spec.js

          if grep -Fq 'mietverwaltung-v18-assistant-preview' service-worker.js; then
            echo "Preview-Cache ist noch vorhanden."
            exit 1
          fi

      - name: Release committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V18.0.0 ist bereits gesetzt."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js tests/deployment.spec.js
          git commit -m "Release V18.0.0"
          git push
