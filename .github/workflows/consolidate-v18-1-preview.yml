          python -m py_compile /tmp/consolidated_patch.py
          python /tmp/consolidated_patch.py

      - name: Statische Preflight-Prüfung
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check tests/core-journey.spec.js
          node --check tests/backup.spec.js
          node --check tests/navigation.spec.js
          node --check tests/navigation-simplified.spec.js
          node --check tests/accessibility-visual.spec.js
          node --check tests/deployment.spec.js
          node --check tests/v18-assistant.spec.js
          node --check playwright.config.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

          grep -F 'function localDateISO(date=new Date())' app.js
          grep -F 'dateOnlyAddDays("2026-09-01",-1)==="2026-08-31"' app.js
          grep -F 'Mietvertrag / PDF' app.js
          grep -F '{id:"water",label:"Kaltwasser"' app.js
          grep -F '{id:"costs",label:"Kosten"' app.js
          grep -F '{id:"planning",label:"Planung"' app.js
          grep -F '{id:"app",label:"Erweitert"' app.js
          grep -F 'style.css?v=1810p1' index.html
          grep -F 'manifest.webmanifest?v=1810p1' index.html
          grep -F 'mietverwaltung-v18-consolidated-preview-1' service-worker.js
          grep -F 'retries: 0' playwright.config.js
          grep -F '"url": "./#rental/billing"' manifest.webmanifest
          grep -F '"url": "./#more/smart"' manifest.webmanifest
          test ! -e README_V17.md
          test ! -e README_V17_0_1.txt
          test ! -e README_V17_0_2.txt
          test ! -e tests/.gitkeep

          if git diff --name-only -- .github/workflows | grep -q .; then
            echo "FEHLER: Der Patch versucht geschützte Workflow-Dateien zu ändern."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Node und Chromium vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testabhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Preview-Server starten
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mv-http.log 2>&1 &
          echo $! >/tmp/mv-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Lokaler Preview-Server bereit."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mv-http.log || true
          exit 1

      - name: Testanzahl vorab prüfen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.log
          grep -Eq 'Total: 24 tests' /tmp/test-list.log

      - name: Vollständiger lokaler Browser-Preflight ohne Retries
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
          CI: '1'
        run: |
          set -euo pipefail
          npx playwright test | tee /tmp/e2e-preflight.log
          grep -Eq '24 passed' /tmp/e2e-preflight.log
          if grep -Eiq 'flaky|retry|failed' /tmp/e2e-preflight.log; then
            echo "Unerwarteter Flake/Retry/Fehler im Preflight."
            exit 1
          fi

      - name: Nur geprüfte Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             app.js index.html style.css manifest.webmanifest service-worker.js             playwright.config.js README_E2E.md             tests/accessibility-visual.spec.js tests/backup.spec.js tests/core-journey.spec.js             tests/deployment.spec.js tests/navigation.spec.js tests/navigation-simplified.spec.js             tests/v18-assistant.spec.js tests/.gitkeep             README_V17.md README_V17_0_1.txt README_V17_0_2.txt

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi

          echo "Geprüfte Änderungen:"
          git diff --cached --stat
          git commit -m "Consolidate V18.1 preview and simplify navigation"
          git push

      - name: Aufräumhinweis für geschützte Workflow-Dateien
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Konsolidierung erfolgreich
          Der neue Stand wurde **vor dem Commit lokal mit 24/24 Tests und 0 Retries** geprüft.

          Die alten Einmal-Workflows unter `.github/workflows/` wurden absichtlich **nicht** vom Bot gelöscht:
          GitHub schützt Änderungen an Workflow-Dateien vor normalen `GITHUB_TOKEN`-Commits.

          Nach erfolgreichem Live-E2E können diese alten Workflows manuell entfernt werden:
          - `apply-dst-calendar-fix.yml`
          - `apply-olive-visual-refresh.yml`
          - `apply-v17-legal-billing-fixes.yml`
          - `apply-v18-assistant-preview.yml`
          - `apply-v18-simplified-navigation.yml`
          - `apply-v18-simplified-navigation-v2.yml`
          - `apply-v18-simplified-navigation-v3.yml`
          - `consolidate-v17-core.yml`
          - `consolidate-v17-core-v2.yml`
          - `fix-v18-annual-forecast.yml`
          - `release-v18-core.yml`
          - `stabilize-e2e-payment-form.yml`
          - `stabilize-e2e-unit-helper.yml`
          - `consolidate-v18-1-preview.yml` (diesen Konsolidierungsworkflow nach Abschluss ebenfalls löschen)

          Behalten:
          - `e2e-live.yml`
          EOF
