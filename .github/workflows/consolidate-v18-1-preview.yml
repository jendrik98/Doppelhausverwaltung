name: Consolidate V18.1 preview

on:
  push:
    paths:
      - ".github/workflows/consolidate-v18-1-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight-and-consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ausgangsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const APP_VERSION="18.0.0";' app.js
          grep -F 'app.js?v=1800' index.html
          grep -F 'mietverwaltung-v18-0-0-core' service-worker.js
          grep -F 'V18.1 olive visual refresh' style.css
          test -f tests/navigation.spec.js
          test -f tests/backup.spec.js
          echo "Ausgangsstand passt."

