name: Architecture migration – TypeScript phase 5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Phase-4-Ausgangslage schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase4.yml
          test -f src/core/persistence.ts
          test -f src/io/backup-codec.ts
          test ! -e src/core/auth.ts
          grep -F 'APP_VERSION="18.0.0"' app.js
          grep -F 'const SEC_KEY="mietverwaltung_webauthn"' src/legacy/120-security.js
          grep -F 'mietverwaltung_v75_webauthn' src/legacy/120-security.js

