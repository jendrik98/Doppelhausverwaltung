      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build erzeugen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp app.js /tmp/app-c-first.js
          npm run build
          cmp /tmp/app-c-first.js app.js
          grep -F 'compiled src/application/index.ts' app.js

      - name: TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-application-layer.mjs
          node --check scripts/test-pwa-update.mjs

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mietverwaltung-http.log 2>&1 &
          echo $! > /tmp/mietverwaltung-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mietverwaltung-http.log
          exit 1

      - name: Vollständige lokale E2E-Suite – strikt 26/26
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee /tmp/application-c-e2e.log
          grep -Eq '26 passed \(' /tmp/application-c-e2e.log
          if grep -Eq '[1-9][0-9]* (failed|flaky|skipped)' /tmp/application-c-e2e.log; then
            echo 'FEHLER: E2E enthält failed/flaky/skipped.'
            exit 1
          fi

      - name: Produktionsinvarianten prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'app.js?v=1803' index.html
          grep -F 'mietverwaltung-v18-application-c-1' service-worker.js
          grep -F 'AppApplication.createCommandBus' src/runtime/040-traceability.js
          grep -F 'loadApplicationState' src/runtime/110-db.js
          grep -F 'const {reconciliationSummary}=AppApplication;' src/runtime/030-integrity.js
          grep -F 'return applicationExecuteCommand' src/core/traceability.ts
          grep -F 'APPLICATION_VERSION = 1' src/application/contracts.ts
          git diff --check
          git diff --exit-code -- .github/workflows

      - name: Geprüften Produktcommit erstellen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ARCHITECTURE.md app.js index.html package.json service-worker.js \
            scripts/build-app.mjs scripts/test-application-layer.mjs scripts/test-pwa-update.mjs \
            src/application/contracts.ts src/application/context.ts src/application/queries.ts \
            src/application/lifecycle.ts src/application/command-bus.ts src/application/index.ts \
            src/core/traceability.ts src/runtime/030-integrity.js src/runtime/040-traceability.js \
            src/runtime/110-db.js tests/deployment.spec.js
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 - <<'PY'
          import subprocess
          expected={
            'ARCHITECTURE.md','app.js','index.html','package.json','service-worker.js',
            'scripts/build-app.mjs','scripts/test-application-layer.mjs','scripts/test-pwa-update.mjs',
            'src/application/contracts.ts','src/application/context.ts','src/application/queries.ts',
            'src/application/lifecycle.ts','src/application/command-bus.ts','src/application/index.ts',
            'src/core/traceability.ts','src/runtime/030-integrity.js','src/runtime/040-traceability.js',
            'src/runtime/110-db.js','tests/deployment.spec.js'
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'FEHLER: unerwartete Staging-Dateien: {sorted(actual ^ expected)}')
          print(f'Exakt {len(actual)} Produktdateien gestaged.')
          PY
          git commit -m "Introduce application use-case layer and building-scoped commands"
          git push origin HEAD:main
