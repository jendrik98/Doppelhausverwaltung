name: Architecture C – Application layer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-c-application-layer
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: http://127.0.0.1:4173/
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten C-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5597ce9065fb4c98f4f6e29c42bbef8e58bc6331"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-c-application-layer.yml"
          test "$(git hash-object src/core/traceability.ts)" = "220a3d864c72c318e4500c37085e1a684a12df08"
          test "$(git hash-object src/runtime/030-integrity.js)" = "6b115c9b16169b09b7c45c04114ff6a76b27f9df"
          test "$(git hash-object src/runtime/040-traceability.js)" = "ff49186da9fd9749c20ca331c14fc65664c6a98a"
          test "$(git hash-object src/runtime/110-db.js)" = "bda1a8fef4537a6794704a0e0777acee6eaefdd5"
          test "$(git hash-object scripts/build-app.mjs)" = "3153c160c000c021f697921c808b00d4a42b9e0f"
          test "$(git hash-object package.json)" = "5423b5a7a27ef369739222e9eafea47ea19d26fe"
          test "$(git hash-object index.html)" = "5f831068d557f6d91e028bbc044058c830340287"
