name: Architecture hardening A3 – Production & CI
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: architecture-hardening-a3
  cancel-in-progress: false
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Node einrichten
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Exakten Ausgangsstand schützen
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD^)" = "e8e7605049dd28b4d00ea53d1b7e110e092f19bf"

        test "$(git rev-parse HEAD^^)" = "25e42c2b1906ec52b4adbb2315c51bede79df017"

        test "$(git rev-parse HEAD^^^)" = "909705bd16c871a1da464819563e9fcaf4be3ea6"

        test "$(git diff --name-only HEAD^^^ HEAD^^)" = ".github/workflows/architecture-hardening-a.yml"

        test "$(git hash-object .github/workflows/architecture-hardening-a.yml)" = "305812dee599c28cf271b48b33d758375981ecaa"

        test "$(git diff --name-only HEAD^^ HEAD^)" = ".github/workflows/architecture-hardening-a2.yml"

        test "$(git hash-object .github/workflows/architecture-hardening-a2.yml)" = "7d7098eaf733e7ad453d2aa1695620e81ac6bcb0"

        test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-hardening-a3.yml"

        '
    - name: Hardening-A3-Patch anwenden
      shell: bash
      env:
        PATCH_B64: 
      run: 'set -euo pipefail

        printf ''%s'' "$PATCH_B64" | base64 --decode > /tmp/hardening_a.py

        python3 /tmp/hardening_a.py

        '
    - name: Abhängigkeiten installieren
      run: npm ci
    - name: Build und statische Qualitätsgates
      shell: bash
      run: 'set -euo pipefail

        npm run build

        npm run typecheck

        npm run test:validation

        npm run test:architecture

        npm run test:quality

        npm run test:pwa

        node --check app.js

        node --check service-worker.js

        node --check scripts/build-app.mjs

        node --check scripts/test-architecture.mjs

        node --check scripts/test-quality.mjs

        node --check scripts/test-pwa-update.mjs

        '
    - name: Reproduzierbaren Build verifizieren
      shell: bash
      run: 'set -euo pipefail

        cp app.js /tmp/app-first.js

        npm run build

        cmp -s /tmp/app-first.js app.js

        '
    - name: Gestagten Whitespace und Änderungsumfang prüfen
      shell: bash
      run: "set -euo pipefail\ngit add -A\ngit diff --cached --check\nmapfile -t ACTUAL < <(git diff --cached --name-only | sort)\nEXPECTED=(\n  \".github/workflows/architecture-hardening-a.yml\"\n  \".github/workflows/architecture-hardening-a2.yml\"\n  \".github/workflows/ci.yml\"\n  \".github/workflows/e2e-live.yml\"\n  \"ARCHITECTURE.md\"\n  \"app.js\"\n  \"index.html\"\n  \"package.json\"\n  \"scripts/test-architecture.mjs\"\n  \"scripts/test-pwa-update.mjs\"\n  \"scripts/test-quality.mjs\"\n  \"service-worker.js\"\n  \"src/ui/app-runtime.ts\"\n)\nmapfile -t EXPECTED_SORTED < <(printf '%s\\n' \"${EXPECTED[@]}\" | sort)\nprintf 'Geändert:\\n'; printf '  %s\\n' \"${ACTUAL[@]}\"\ndiff -u <(printf '%s\\n' \"${EXPECTED_SORTED[@]}\") <(printf '%s\\n' \"${ACTUAL[@]}\")\ngit reset\n"
    - name: Chromium installieren
      run: npx playwright install --with-deps chromium
    - name: PDF-Prüfwerkzeuge installieren
      run: 'sudo apt-get update

        sudo apt-get install -y poppler-utils

        '
    - name: Lokalen Server starten
      shell: bash
      run: "set -euo pipefail\npython3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mietverwaltung-http.log 2>&1 &\necho $! > /tmp/mietverwaltung-http.pid\nfor i in {1..30}; do\n  if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi\n  sleep 1\ndone\ncat /tmp/mietverwaltung-http.log\nexit 1\n"
    - name: Exakte 25 lokale E2E-Tests
      shell: bash
      env:
        E2E_BASE_URL: http://127.0.0.1:4173/
      run: "set -euo pipefail\nset +e\nnpx playwright test --retries=0 --reporter=json > /tmp/playwright.json\nPW_EXIT=$?\nset -e\nnode - <<'NODE'\nconst fs=require('fs');\nconst r=JSON.parse(fs.readFileSync('/tmp/playwright.json','utf8'));\nconst s=r.stats||{};\nconst total=Number(s.expected||0)+Number(s.unexpected||0)+Number(s.flaky||0)+Number(s.skipped||0);\nconsole.log(`Playwright: total=${total}, passed=${s.expected||0}, failed=${s.unexpected||0}, flaky=${s.flaky||0}, skipped=${s.skipped||0}`);\nfunction walk(suites,prefix=[]){\n  for(const suite of suites||[]){\n    const next=suite.title?[...prefix,suite.title]:prefix;\n    for(const spec of suite.specs||[]){\n      for(const test of spec.tests||[]){\n        if(test.status==='unexpected' || (test.results||[]).some(x=>x.status==='failed'||x.status==='timedOut')){\n          console.error(`FEHLERTEST: ${[...next,spec.title].filter(Boolean).join(' › ')}`);\n          for(const result of test.results||[])for(const error of result.errors||[])console.error(error.message||String(error));\n        }\n      }\n    }\n    walk(suite.suites||[],next);\n  }\n}\nwalk(r.suites||[]);\nif(total!==25||Number(s.expected)!==25||Number(s.unexpected)!==0||Number(s.flaky)!==0||Number(s.skipped)!==0)process.exit(1);\nNODE\ntest \"$PW_EXIT\" -eq 0\n"
    - name: Abschlussinvarianten prüfen
      shell: bash
      run: 'set -euo pipefail

        grep -Fq ''APP_VERSION="18.0.0"'' app.js

        grep -Fq ''mietverwaltung-v6'' app.js

        grep -Fq ''DB_VERSION = 2'' src/core/persistence.ts

        grep -Fq ''mietverwaltung_webauthn'' src/core/auth.ts

        grep -Fq ''mietverwaltung-full-backup-v2'' app.js

        grep -Fq ''mietverwaltung-encrypted-v1'' app.js

        test ! -d src/legacy

        test ! -e .github/workflows/architecture-hardening-a.yml

        test ! -e .github/workflows/architecture-hardening-a2.yml

        grep -Fq ''app.js?v=1801'' tests/deployment.spec.js

        grep -Fq ''style.css?v=1810p2'' tests/deployment.spec.js

        grep -Fq ''manifest.webmanifest?v=1810p2'' tests/deployment.spec.js

        grep -Fq ''mietverwaltung-v18-prod-hardening-a-1'' tests/deployment.spec.js

        ! grep -Fq ''app.js?v=1800'' tests/deployment.spec.js

        ! grep -Fq ''mietverwaltung-v18-phase2-calendar-validation-4'' tests/deployment.spec.js

        '
    - name: Commit und Push
      shell: bash
      run: 'set -euo pipefail

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A

        git diff --cached --check

        git commit -m "Harden PWA updates and establish permanent CI gates"

        git push origin HEAD:main

        '
