name: Architecture migration – TypeScript phase 10 V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exakten Phase-10-V5-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase9-v6.yml
          test -f .github/workflows/architecture-typescript-phase10.yml
          test -f .github/workflows/architecture-typescript-phase10-v2.yml
          test -f .github/workflows/architecture-typescript-phase10-v3.yml
          test -f .github/workflows/architecture-typescript-phase10-v4.yml
          test -f .github/workflows/architecture-typescript-phase10-v5.yml
          test -f src/legacy/order.json
          test -f src/legacy/README.md
          test -f src/legacy/140-tests.js
          test -f src/legacy/150-ui.js
          test -f src/legacy/160-app.js
          test ! -e src/runtime
          test ! -e src/ui/app-runtime.ts
          test "$(git rev-parse HEAD^)" = "1d44b50a87e249b531d2744f38ae8f320854712e"
          test "$(git rev-parse HEAD^^)" = "99921f7380decedb45b34f6390b24b9d0dbd623e"
          test "$(git rev-parse HEAD^^^)" = "70e00b0842b9434be9a1d7dec2d56ee6bce7a981"
          test "$(git rev-parse HEAD^^^^)" = "c56a3d601edcdfb9b9c8f2379d717b0f45fd7e4c"
          test "$(git rev-parse HEAD^^^^^)" = "93e1061c2f21c3f6b0695fe519b2da7096e96319"
          test "$(git diff --name-only HEAD^^^^^ HEAD^^^^)" = ".github/workflows/architecture-typescript-phase10.yml"
          test "$(git diff --name-only HEAD^^^^ HEAD^^^)" = ".github/workflows/architecture-typescript-phase10-v2.yml"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = ".github/workflows/architecture-typescript-phase10-v3.yml"
          test "$(git diff --name-only HEAD^^ HEAD^)" = ".github/workflows/architecture-typescript-phase10-v4.yml"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-typescript-phase10-v5.yml"
          grep -F 'APP_VERSION="18.0.0"' app.js
          grep -F 'let MODAL_RETURN_FOCUS=null,MODAL_INITIAL_FORM="",MODAL_RETURN_FOCUS_OVERRIDE=null;' src/legacy/150-ui.js
          grep -F 'function runSelfTests()' src/legacy/140-tests.js
          grep -F 'async function startApp()' src/legacy/160-app.js

