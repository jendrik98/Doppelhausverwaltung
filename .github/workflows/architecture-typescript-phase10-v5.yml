      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build, TypeScript und Architektur prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cp app.js /tmp/app-phase10-first.js
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          test ! -e src/legacy
          test ! -e src/legacy/README.md
          test -f src/runtime/order.json
          test -f src/runtime/900-app-entry.js
          test -f src/ui/app-runtime.ts
          grep -F 'TypeScript source src/ui/app-runtime.ts · outer-scope injection' app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

      - name: Reproduzierbaren Build erzwingen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cmp --silent /tmp/app-phase10-first.js app.js || { echo "FEHLER: Zweiter Build erzeugt eine abweichende app.js."; exit 1; }
          git diff --check

      - name: Fach-, Daten-, Runtime- und Sicherheitsinvarianten schützen
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const DOMAIN_VERSION=1;' src/runtime/020-domain.js
          grep -F 'const APP_VERSION="18.0.0";' src/runtime/030-integrity.js
          grep -F 'let LAST_STABLE_STATE=null;' src/runtime/030-integrity.js
          grep -F 'let ACTIVE_LEGAL_PACK=null;' src/runtime/090-legal-rules.js
          grep -F 'export const LAW_DATE="2026-09-05"' src/domain/legal-rules.ts
          grep -F 'mietverwaltung-legal-pack-v1' src/domain/legal-rules.ts
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          grep -F '"architectureVersion": 2' src/runtime/order.json
          grep -F 'src/runtime/900-app-entry.js' src/runtime/order.json
          ! grep -F '140-tests.js' src/runtime/order.json
          ! grep -F '150-ui.js' src/runtime/order.json
          ! grep -F '160-app.js' src/runtime/order.json
          grep -F 'export {};' src/ui/app-runtime.ts
          ! grep -F 'export async function start()' src/ui/app-runtime.ts
          grep -F 'function runSelfTests()' src/ui/app-runtime.ts
          grep -F 'let MODAL_RETURN_FOCUS=null,MODAL_INITIAL_FORM="",MODAL_RETURN_FOCUS_OVERRIDE=null;' src/ui/app-runtime.ts
          grep -F 'function render()' src/ui/app-runtime.ts
          grep -F 'async function startApp()' src/ui/app-runtime.ts
          ! grep -F 'AppRuntime' src/runtime/900-app-entry.js
          grep -F 'TypeScript source src/ui/app-runtime.ts · outer-scope injection' app.js
          test ! -e .github/workflows/architecture-typescript-phase9-v6.yml
          test ! -e .github/workflows/architecture-typescript-phase10.yml
          test ! -e .github/workflows/architecture-typescript-phase10-v2.yml
          test ! -e .github/workflows/architecture-typescript-phase10-v3.yml
          test ! -e .github/workflows/architecture-typescript-phase10-v4.yml
          test ! -e .github/workflows/architecture-typescript-phase10-v5.yml
          test -f .github/workflows/e2e-live.yml

      - name: Vollständiges Whitespace-Gate inklusive neuer Dateien
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git reset

      - name: Chromium und PDF-Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Testserver starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/doppelhaus-http.log 2>&1 &
          echo $! >/tmp/doppelhaus-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doppelhaus-http.log || true
          exit 1

      - name: Browser-Start-Smoke mit direkter Fehlerausgabe
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({locale:'de-DE', timezoneId:'Europe/Berlin'});
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', err => pageErrors.push(String(err?.stack || err)));
            page.on('console', msg => { if(msg.type()==='error') consoleErrors.push(msg.text()); });
            let response;
            try {
              response = await page.goto('http://127.0.0.1:4173/#home', {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(1200);
              const snap = await page.evaluate(() => ({
                appText: (document.getElementById('app')?.innerText || '').trim(),
                appHtml: (document.getElementById('app')?.innerHTML || '').slice(0,1800),
                bodyText: (document.body?.innerText || '').slice(0,2200)
              }));
              console.log(`Smoke HTTP: ${response?.status() ?? 'keine Antwort'}`);
              console.log(`Smoke #app: ${snap.appText.slice(0,500) || '<leer>'}`);
              if (consoleErrors.length) console.log('Console errors:\n' + consoleErrors.join('\n---\n'));
              if (pageErrors.length) console.log('Page errors:\n' + pageErrors.join('\n---\n'));
              const startFailed = /Startfehler|konnte nicht gestartet/i.test(`${snap.appText}\n${snap.bodyText}`);
              if (!response?.ok() || !snap.appText || startFailed || pageErrors.length) {
                console.log('Smoke HTML:\n' + snap.appHtml);
                process.exitCode = 1;
              }
            } finally {
              await browser.close();
            }
          })().catch(err=>{ console.error(err?.stack || err); process.exit(1); });
          NODE

      - name: Exakt 25 Tests verlangen
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.txt
          TOTAL="$(grep -Eo 'Total: [0-9]+ tests?' /tmp/test-list.txt | tail -1 | grep -Eo '[0-9]+')"
          if [ "$TOTAL" != "25" ]; then
            echo "FEHLER: Erwartet werden exakt 25 Playwright-Tests, gefunden: ${TOTAL:-0}"
            exit 1
          fi

      - name: Strenges 25-von-25-Gate mit Fehlerdiagnose
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          set +e
          npx playwright test --retries=0 --reporter=json > /tmp/e2e.json 2> /tmp/e2e.stderr
          PW_STATUS=$?
          set -e
          GATE_STATUS=0
          python3 - <<'PY' || GATE_STATUS=$?
          import json
          from pathlib import Path

          report_path = Path('/tmp/e2e.json')
          try:
              report = json.loads(report_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f"FEHLER: Playwright-JSON konnte nicht gelesen werden: {exc}")
              if report_path.exists():
                  print(report_path.read_text(encoding='utf-8', errors='replace')[-6000:])
              raise SystemExit(1)

          stats = report.get('stats') or {}
          expected = int(stats.get('expected', -1))
          unexpected = int(stats.get('unexpected', -1))
          flaky = int(stats.get('flaky', -1))
          skipped = int(stats.get('skipped', -1))
          total = expected + unexpected + flaky + skipped
          print(f"Playwright: total={total}, passed={expected}, failed={unexpected}, flaky={flaky}, skipped={skipped}, retries=0")

          def walk_suite(suite, parents=()):
              title = suite.get('title') or ''
              chain = parents + ((title,) if title else ())
              for spec in suite.get('specs') or []:
                  spec_title = spec.get('title') or '<ohne Titel>'
                  file = spec.get('file') or suite.get('file') or ''
                  for test in spec.get('tests') or []:
                      bad_results = [r for r in (test.get('results') or []) if r.get('status') not in ('passed', 'skipped')]
                      if test.get('status') in ('unexpected','flaky') or bad_results:
                          print(f"FEHLTEST: {' › '.join((*chain, spec_title))} [{file}]")
                          for result in bad_results:
                              print(f"  Ergebnis: {result.get('status')} · {result.get('duration', 0)} ms")
                              errors = result.get('errors') or ([] if not result.get('error') else [result.get('error')])
                              for err in errors:
                                  if isinstance(err, dict):
                                      msg = err.get('message') or err.get('stack') or str(err)
                                  else:
                                      msg = str(err)
                                  print('  ' + msg.replace('\n', '\n  ')[:8000])
              for child in suite.get('suites') or []:
                  walk_suite(child, chain)

          for suite in report.get('suites') or []:
              walk_suite(suite)

          if not (total == 25 and expected == 25 and unexpected == 0 and flaky == 0 and skipped == 0):
              raise SystemExit("FEHLER: Strenges Gate verlangt exakt 25/25 bestanden, 0 Fehler, 0 Flakes, 0 Skips und 0 Retries.")
          PY
          if [ -s /tmp/e2e.stderr ]; then
            echo "Playwright stderr:"
            tail -200 /tmp/e2e.stderr
          fi
          if [ "$PW_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
            echo "FEHLER: Browser-Gate fehlgeschlagen (Playwright=$PW_STATUS, Auswertung=$GATE_STATUS)."
            exit 1
          fi

