name: Architecture migration – TypeScript phase 9 V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fehlgeschlagenen Phase-9-Upload und bestätigten Phase-8-Stand schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase8.yml
          test -f .github/workflows/architecture-typescript-phase9.yml
          test -f .github/workflows/architecture-typescript-phase9-v2.yml
          test ! -e src/ui/ui-core.ts
          test "$(git rev-parse HEAD^)" = "69c4765d47502e523f09da39b74b5a80f335da6b"
          test "$(git rev-parse HEAD^^)" = "b0c9019f027162b346d08b0ca0bb6049d052dd1d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-typescript-phase9-v2.yml"
          { git diff --name-only b0c9019f027162b346d08b0ca0bb6049d052dd1d HEAD; } | sort > /tmp/phase9-upload-files.txt
          printf '%s\n' ".github/workflows/architecture-typescript-phase9-v2.yml" ".github/workflows/architecture-typescript-phase9.yml" | sort > /tmp/phase9-expected-upload-files.txt
          cmp --silent /tmp/phase9-upload-files.txt /tmp/phase9-expected-upload-files.txt
          grep -F 'const $=id=>document.getElementById(id);' src/legacy/150-ui.js
          grep -F 'let MODAL_RETURN_FOCUS=null,MODAL_INITIAL_FORM="",MODAL_RETURN_FOCUS_OVERRIDE=null;' src/legacy/150-ui.js
          grep -F 'function modal(title,html,onReady)' src/legacy/150-ui.js
          grep -F 'function validateCentralForm(form)' src/legacy/150-ui.js
          grep -F 'MODAL_RETURN_FOCUS_OVERRIDE=' src/legacy/160-app.js
          grep -F 'APP_VERSION="18.0.0"' app.js

