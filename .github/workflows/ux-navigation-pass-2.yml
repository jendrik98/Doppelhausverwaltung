name: UX 10/10 – Navigation Pass 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-navigation-pass-2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: 5b42f75846f51f62488551c4965cd284c85def22
  SELF_PATH: .github/workflows/ux-navigation-pass-2.yml
  MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  E2E_BASE_URL: http://127.0.0.1:4173/

jobs:
  simplify-navigation:
    name: Informationsarchitektur vereinfachen, testen, pushen
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAINT_TOKEN:-}" || { echo "::error::REPO_MAINTENANCE_TOKEN fehlt."; exit 1; }

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA" || {
            echo "::error::Basis $BASE_SHA ist kein Vorfahr von $TRIGGER_SHA."
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            echo "Seit Navigation Pass 1 geändert: ${CHANGED[*]}"
            echo "::error::Vor Pass 2 darf seit $BASE_SHA ausschließlich $SELF_PATH hinzugekommen sein."
            exit 1
          fi
          test -f .github/workflows/ci.yml
          test -f .github/workflows/e2e-live.yml
          test -f "$SELF_PATH"

      - name: Navigation Pass 2 anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/navigation_pass_2_patch.py
          test "$(sha256sum /tmp/navigation_pass_2_patch.py | awk '{print $1}')" = "b23b845077c35b342c98013587c3e46a3de1c877d55936b816d3aa6969861ea8"
          python3 -m py_compile /tmp/navigation_pass_2_patch.py
          python3 /tmp/navigation_pass_2_patch.py
          rm -f /tmp/navigation_pass_2_patch.py

          rm -f "$SELF_PATH"
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q 'app.js?v=1811' index.html
          grep -q 'mietverwaltung-v18-navigation-ux-2' service-worker.js
          grep -q 'owner: "payments"' src/presentation/navigation.ts
          grep -q 'more: "protection"' src/presentation/navigation.ts
          git diff --check

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA_1="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_1="$(sha256sum style.css | awk '{print $1}')"
          npm run build
          APP_SHA_2="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_2="$(sha256sum style.css | awk '{print $1}')"
          test "$APP_SHA_1" = "$APP_SHA_2"
          test "$STYLE_SHA_1" = "$STYLE_SHA_2"
          grep -q 'compiled src/ui/navigation-ui.ts' app.js
          grep -q 'Kostenquelle hinzufügen' app.js
          grep -q 'Kaltwasser & Zähler' app.js
          grep -q 'Zahlungen zuordnen' app.js
          echo "APP_SHA=$APP_SHA_2" >> "$GITHUB_ENV"

      - name: TypeScript und permanente Qualitäts-Gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js

      - name: Informationsarchitektur-Ratchet prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          runtime=Path('src/ui/app-runtime.ts').read_text(encoding='utf-8')
          nav=Path('src/presentation/navigation.ts').read_text(encoding='utf-8')
          size=len(Path('src/ui/app-runtime.ts').read_bytes())
          if size >= 171000:
              raise SystemExit(f'app-runtime.ts zu groß: {size} >= 171000')
          contracts={
            'Haus 3 Tabs':['label:"Objekt"','label:"Kosten"','label:"Dokumente"'],
            'Vermietung 2 Tabs':['label:"Mietverhältnis"','label:"Abrechnung"'],
            'Finanzen 2 Tabs':['label:"Zahlungen"','label:"Planung"'],
            'Mehr 2 Tabs':['label:"Sicherung"','label:"Erweitert"']
          }
          for name,needles in contracts.items():
              if any(n not in runtime for n in needles):
                  raise SystemExit(f'IA-Vertrag fehlt: {name}')
          for n in ['water: "billing"','infrastructure: "overview"','smart: "app"','archive: "app"']:
              if n not in nav:
                  raise SystemExit(f'Deep-route compatibility fehlt: {n}')
          print(f'Navigation Pass 2 IA-Ratchet bestanden; app-runtime.ts {size} Bytes.')
          PY2

      - name: Browser und PDF-Prüfwerkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dhv-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dhv-http.log
          exit 1

      - name: Kompakte Navigation wiederholt prüfen
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/navigation-natural.spec.js --repeat-each=4
          npx playwright test tests/navigation.spec.js tests/navigation-simplified.spec.js --repeat-each=2
          npx playwright test tests/core-journey.spec.js --repeat-each=2

      - name: Vollständige E2E-Suite prüfen
        run: npm run test:e2e

      - name: Playwright-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-navigation-pass-2-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalen Tree verifizieren
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q 'app.js?v=1811' tests/deployment.spec.js
          grep -q 'mietverwaltung-v18-navigation-ux-2' scripts/test-pwa-update.mjs
          grep -q "['overview','billing']" tests/navigation-simplified.spec.js
          grep -q "['payments','planning']" tests/navigation-simplified.spec.js
          git diff --check
          git status --short

      - name: Navigation Pass 2 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::Keine Produktänderungen."; exit 1; }
          git commit -m "feat: simplify navigation architecture"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          echo "Finaler Pass-2-SHA: $FINAL_SHA"

      - name: Permanente CI und Live-E2E abwarten
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            for i in {1..72}; do
              id="$(gh run list --workflow "$workflow" --branch main --limit 40 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == env.FINAL_SHA) | .databaseId' | head -n1)"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            return 1
          }
          CI_RUN="$(find_run ci.yml)" || { echo "::error::Kein CI-Lauf für $FINAL_SHA."; exit 1; }
          LIVE_RUN="$(find_run e2e-live.yml)" || { echo "::error::Kein Live-E2E-Lauf für $FINAL_SHA."; exit 1; }
          gh run watch "$CI_RUN" --exit-status
          gh run watch "$LIVE_RUN" --exit-status
          test "$(gh run view "$CI_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"
          test "$(gh run view "$LIVE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"

      - name: Abschluss
        run: |
          echo "Navigation Pass 2 vollständig."
          echo "Finaler SHA: $FINAL_SHA"
          echo "app.js SHA-256: $APP_SHA"
          echo "Sichtbare IA: Vermietung 2 · Haus 3 · Finanzen 2 · Mehr 2."
