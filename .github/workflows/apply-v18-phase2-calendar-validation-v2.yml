name: Apply V18 Phase 2 calendar-year validation v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase2-and-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ausgangsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f ARCHITECTURE.md
          test -f src/core/validation.ts
          test -f src/core/feedback.ts
          test -f src/legacy/100-domain-2.js
          test -f tests/navigation-simplified.spec.js
          grep -F 'const APP_VERSION="18.0.0";' app.js
          grep -F 'const periodStart=y=>`${y}-04-01`;' src/legacy/100-domain-2.js
          echo "Phase-1-Ausgangsstand passt."

