      - name: Alte Testartefakte aus Git entfernen
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch playwright-report test-results || true

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build, TypeScript und statische Prüfungen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run test:validation
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-validation.mjs
          node --check tests/v18-phase2-calendar-validation.spec.js
          node --check tests/deployment.spec.js
          node --check tests/v17-billing-15y.spec.js
          node --check tests/v17-legal-professional.spec.js
          node --check tests/v18-assistant.spec.js
          grep -F 'var AppValidation' app.js
          grep -F 'var AppFeedback' app.js
          grep -F 'const periodStart=y=>`${y}-01-01`;' app.js
          grep -F 'const periodEnd=y=>`${y}-12-31`;' app.js
          grep -F 'periodBillingTargetISO' app.js
          grep -F '`${y+1}-12-31`' src/legacy/100-domain-2.js
          grep -F 'mietverwaltung-v18-phase2-calendar-validation-2' service-worker.js
          grep -F 'Phase 2: Kalenderjahr, 31.03-Zielfrist, zentrale Validierung und Toast-Feedback' tests/v18-phase2-calendar-validation.spec.js
          if grep -Fq 'Reguläre jährliche Abrechnungsperiode 01.04.–31.03.' app.js; then
            echo 'FEHLER: alter Abrechnungsrhythmus noch im Build.'
            exit 1
          fi
          if git diff --name-only -- .github/workflows | grep -q .; then
            echo 'FEHLER: Patch versucht Workflow-Dateien zu verändern.'
            git diff --name-only -- .github/workflows
            exit 1
          fi

      - name: Lokalen Preview-Server starten
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mv-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo 'Lokaler Preview-Server bereit.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mv-http.log || true
          exit 1

      - name: Exakt 25 Browsertests ohne Retry
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
          EXPECTED_APP_VERSION: 18.0.0
          CI: 1
        run: |
          set -euo pipefail
          npx playwright test --list | tee /tmp/test-list.log
          grep -Eq 'Total: 25 tests' /tmp/test-list.log
          npx playwright test | tee /tmp/e2e.log
          grep -Eq '25 passed' /tmp/e2e.log
          if grep -Eiq '[0-9]+ failed|flaky' /tmp/e2e.log; then
            echo 'Fehler oder Flake im Phase-2-Preflight.'
            exit 1
          fi

      - name: Nur vollständig geprüfte Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'FEHLER: Geschützte Workflow-Dateien würden durch den Bot geändert.'
            git diff --cached --name-only
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Keine Änderungen zu committen.'
            exit 0
          fi
          echo 'Geprüfte Phase-2-Änderungen:'
          git diff --cached --stat
          git commit -m 'Adopt calendar-year billing and activate Phase 2 validation'
          git push
