name: Apply V18 billing assistant preview

on:
  push:
    paths:
      - ".github/workflows/apply-v18-assistant-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V18 Abrechnungsassistent integrieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v18_patch.py
          python /tmp/v18_patch.py

      - name: Syntax und Sicherheitsmarker prüfen
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          node --check tests/v18-assistant.spec.js
          grep -F 'const V18_ASSISTANT_VERSION=1;' app.js
          grep -F 'Schätzwerte werden niemals automatisch in die endgültige Abrechnung übernommen' app.js
          grep -F 'mietverwaltung-v18-assistant-preview-1' service-worker.js
          grep -F 'V18 Sicherheit: Schätzwerte gelangen niemals in Snapshot oder finale Abrechnung' tests/v18-assistant.spec.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V18 Preview ist bereits vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js service-worker.js tests/v18-assistant.spec.js
          git commit -m "Add V18 intelligent billing assistant preview"
          git push
