name: UX 10/10 – Navigation Pass 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-navigation-pass-1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: baf976eb51c07404148cf8da3d34a773eac62d27
  SELF_PATH: .github/workflows/ux-navigation-pass-1.yml
  MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  E2E_BASE_URL: http://127.0.0.1:4173/

jobs:
  navigation:
    name: Mobile Navigation verbessern, testen, pushen
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAINT_TOKEN:-}" ]; then
            echo "::error::Repository-Secret REPO_MAINTENANCE_TOKEN fehlt."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA" || {
            echo "::error::Basis $BASE_SHA ist kein Vorfahr von $TRIGGER_SHA."
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            echo "Seit dem grünen H3-Stand geändert: ${CHANGED[*]}"
            echo "::error::Vor dem Navigations-Pass darf seit $BASE_SHA ausschließlich $SELF_PATH hinzugekommen/geändert worden sein."
            exit 1
          fi
          test -f .github/workflows/ci.yml
          test -f .github/workflows/e2e-live.yml
          test -f "$SELF_PATH"
          echo "TRIGGER_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"

      - name: Navigations-Pass anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/nav_patch.py
          test "$(sha256sum /tmp/nav_patch.py | awk '{print $1}')" = "e672e17d5cc975f17a7f378dec45435ea746b953fcaebb6eef9dba8ac7360ba9"
          python3 -m py_compile /tmp/nav_patch.py
          python3 /tmp/nav_patch.py
          rm -f /tmp/nav_patch.py

          rm -f "$SELF_PATH"
          test ! -e "$SELF_PATH"
          mapfile -t WORKFLOWS < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          test "$(printf '%s\n' "${WORKFLOWS[@]}")" = $'ci.yml\ne2e-live.yml'

          test -f src/ui/navigation-ui.ts
          test -f tests/navigation-natural.spec.js
          test -f scripts/test-navigation-ui.mjs
          grep -q 'app.js?v=1810' index.html
          grep -q 'style.css?v=1810p11' index.html
          grep -q 'mietverwaltung-v18-navigation-ux-1' service-worker.js
          git diff --check

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA_1="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_1="$(sha256sum style.css | awk '{print $1}')"
          npm run build
          APP_SHA_2="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_2="$(sha256sum style.css | awk '{print $1}')"
          test "$APP_SHA_1" = "$APP_SHA_2"
          test "$STYLE_SHA_1" = "$STYLE_SHA_2"
          grep -q 'compiled src/ui/navigation-ui.ts' app.js
          grep -q 'workspace-mobile-tabs' app.js
          echo "APP_SHA=$APP_SHA_2" >> "$GITHUB_ENV"
          echo "app.js reproduzierbar: $APP_SHA_2"

      - name: TypeScript und permanente Qualitäts-Gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js

      - name: Runtime-Schrumpfung und Navigationsvertrag prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          runtime_size=len(Path('src/ui/app-runtime.ts').read_bytes())
          if runtime_size >= 170823:
              raise SystemExit(f'app-runtime.ts wurde nicht kleiner: {runtime_size} >= 170823')
          nav=Path('src/ui/navigation-ui.ts').read_text(encoding='utf-8')
          css=Path('src/ui/design-system.css').read_text(encoding='utf-8')
          for needle in ['NAV_MEMORY_KEY','workspaceTrailLabels','workspace-mobile-tabs','workspace-select-compat']:
              if needle not in nav and needle not in css:
                  raise SystemExit(f'Navigationsvertrag fehlt: {needle}')
          print(f'app-runtime.ts: {runtime_size} Bytes; Navigation liegt modular außerhalb des Runtime-Monolithen.')
          PY2

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dhv-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dhv-http.log
          exit 1

      - name: Natürliche iPhone-Navigation wiederholt prüfen
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/navigation-natural.spec.js --repeat-each=4
          npx playwright test tests/navigation.spec.js tests/navigation-simplified.spec.js --repeat-each=2

      - name: Vollständige E2E-Suite prüfen
        run: npm run test:e2e

      - name: Playwright-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-navigation-pass-1-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalen Tree verifizieren
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q '"test:navigation-ui"' package.json
          grep -q 'compileModule("src/ui/navigation-ui.ts", "AppNavigationUi")' scripts/build-app.mjs
          grep -q 'workspace-mobile-tabs' src/ui/navigation-ui.ts
          grep -q 'rememberedTopSub' src/ui/app-runtime.ts
          grep -q 'app.js?v=1810' tests/deployment.spec.js
          grep -q 'style.css?v=1810p11' tests/deployment.spec.js
          grep -q 'mietverwaltung-v18-navigation-ux-1' scripts/test-pwa-update.mjs
          git diff --check
          git status --short

      - name: Navigations-Pass committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Keine Navigations-Änderungen zum Committen."
            exit 1
          fi
          git commit -m "feat: make mobile navigation natural"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          echo "Finaler Navigations-SHA: $FINAL_SHA"

      - name: Permanente CI und Live-E2E abwarten
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            for i in {1..72}; do
              id="$(gh run list --workflow "$workflow" --branch main --limit 40 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == env.FINAL_SHA) | .databaseId' | head -n1)"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            return 1
          }
          CI_RUN="$(find_run ci.yml)" || { echo "::error::Kein CI-Lauf für $FINAL_SHA gefunden."; exit 1; }
          LIVE_RUN="$(find_run e2e-live.yml)" || { echo "::error::Kein Live-E2E-Lauf für $FINAL_SHA gefunden."; exit 1; }
          echo "CI run: $CI_RUN"
          echo "Live run: $LIVE_RUN"
          gh run watch "$CI_RUN" --exit-status
          gh run watch "$LIVE_RUN" --exit-status
          test "$(gh run view "$CI_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"
          test "$(gh run view "$LIVE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"

      - name: Abschluss
        run: |
          echo "UX Navigation Pass 1 ist implementiert."
          echo "Finaler SHA: $FINAL_SHA"
          echo "app.js SHA-256: $APP_SHA"
          echo "Permanente CI und Live-E2E sind grün."
