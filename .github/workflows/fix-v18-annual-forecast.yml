name: Fix V18 annual forecast

on:
  push:
    paths:
      - ".github/workflows/fix-v18-annual-forecast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: V18 Jahresprognose korrigieren
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v18_forecast_fix.py
          python /tmp/v18_forecast_fix.py

      - name: Korrektur technisch prüfen
        shell: bash
        run: |
          node --check app.js
          node --check service-worker.js
          grep -F 'const scale=currentFull&&priorFull?1:' app.js
          grep -F 'V18 Volljahresprognose ignoriert Schaltjahr-Differenz' app.js
          grep -F 'mietverwaltung-v18-assistant-preview-2' service-worker.js

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V18 Prognosefix ist bereits vorhanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js service-worker.js
          git commit -m "Fix V18 annual forecast across leap years"
          git push
