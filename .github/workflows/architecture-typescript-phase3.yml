name: Architecture migration – TypeScript phase 3

on:
  push:
    paths:
      - ".github/workflows/architecture-typescript-phase3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ausgangslage prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f src/core/validation.ts
          test -f src/core/feedback.ts
          test -f src/legacy/010-schema.js
          test -f src/legacy/020-domain.js
          grep -F 'APP_VERSION="18.0.0"' app.js
          grep -F 'function localDateISO' src/legacy/010-schema.js
          grep -F 'function normalizeMeterNumber' src/legacy/020-domain.js

