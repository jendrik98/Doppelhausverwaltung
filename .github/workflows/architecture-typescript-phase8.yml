name: Architecture migration – TypeScript phase 8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bestätigten Phase-7-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/e2e-live.yml
          test -f .github/workflows/architecture-typescript-phase7.yml
          test -f .github/workflows/architecture-typescript-phase8.yml
          test -f src/domain/property-domain.ts
          test -f src/domain/legal-rules.ts
          test -f src/domain/billing-domain.ts
          test ! -e src/domain/intelligence.ts
          test ! -e src/domain/quality.ts
          test ! -e src/domain/smart-engine.ts
          test ! -e src/domain/v18-assistant.ts
          test "$(git rev-parse HEAD^)" = "1fce3d9198fbd9b101c389017e6e7be76e6369f3"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-typescript-phase8.yml"
          grep -F 'const INTELLIGENCE_VERSION=1;' src/legacy/050-intelligence.js
          grep -F 'function paymentMatchScore' src/legacy/050-intelligence.js
          grep -F 'const QUALITY_VERSION=1;' src/legacy/060-quality.js
          grep -F 'function parseBankCSV' src/legacy/060-quality.js
          grep -F 'const SMART_ENGINE_VERSION=1;' src/legacy/070-smart-engine.js
          grep -F 'function rentMonthStatus' src/legacy/070-smart-engine.js
          grep -F 'const V18_ASSISTANT_VERSION=1;' src/legacy/080-v18-billing-assistant-preview.js
          grep -F 'function v18BillingAssistant' src/legacy/080-v18-billing-assistant-preview.js
          grep -F 'APP_VERSION="18.0.0"' app.js

