        run: |
          set -euo pipefail
          grep -F 'const DOMAIN_VERSION=1;' src/runtime/020-domain.js
          grep -F 'const APP_VERSION="18.0.0";' src/runtime/030-integrity.js
          grep -F 'let LAST_STABLE_STATE=null;' src/runtime/030-integrity.js
          grep -F 'let ACTIVE_LEGAL_PACK=null;' src/runtime/090-legal-rules.js
          grep -F 'export const LAW_DATE="2026-09-05"' src/domain/legal-rules.ts
          grep -F 'mietverwaltung-legal-pack-v1' src/domain/legal-rules.ts
          grep -F 'DB_NAME = "mietverwaltung-v6"' src/core/persistence.ts
          grep -F 'DB_VERSION = 2' src/core/persistence.ts
          grep -F 'STATE_ID = "main"' src/core/persistence.ts
          grep -F 'SEC_KEY = "mietverwaltung_webauthn"' src/core/auth.ts
          grep -F 'FULL_BACKUP_SCHEMA = "mietverwaltung-full-backup-v2"' src/io/backup-codec.ts
          grep -F 'ENCRYPTED_BACKUP_SCHEMA = "mietverwaltung-encrypted-v1"' src/io/backup-codec.ts
          grep -F '"architectureVersion": 2' src/runtime/order.json
          grep -F 'src/runtime/900-app-entry.js' src/runtime/order.json
          ! grep -F '140-tests.js' src/runtime/order.json
          ! grep -F '150-ui.js' src/runtime/order.json
          ! grep -F '160-app.js' src/runtime/order.json
