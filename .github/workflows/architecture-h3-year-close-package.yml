name: Architecture H3 – Jahresabschluss-Paket

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-h3-year-close-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: f1b061193ce1594231493ea0323c20c15b788b4e
  SELF_PATH: .github/workflows/architecture-h3-year-close-package.yml
  MAINT_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  GH_TOKEN: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
  E2E_BASE_URL: http://127.0.0.1:4173/

jobs:
  h3:
    name: Build H3, test, push, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Wartungs-Token prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAINT_TOKEN:-}" ]; then
            echo "::error::Repository-Secret REPO_MAINTENANCE_TOKEN fehlt."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_MAINTENANCE_TOKEN }}
          persist-credentials: true

      - name: Ausgangsstand strikt verifizieren
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          TRIGGER_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$TRIGGER_SHA" || {
            echo "::error::Basis $BASE_SHA ist kein Vorfahr von $TRIGGER_SHA."
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$TRIGGER_SHA")
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$SELF_PATH" ]; then
            echo "Seit dem grünen H2-Stand geändert: ${CHANGED[*]}"
            echo "::error::Vor H3 darf seit $BASE_SHA ausschließlich $SELF_PATH hinzugekommen/geändert worden sein."
            exit 1
          fi
          test -f .github/workflows/ci.yml
          test -f .github/workflows/e2e-live.yml
          test -f "$SELF_PATH"
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          echo "TRIGGER_SHA=$TRIGGER_SHA" >> "$GITHUB_ENV"

      - name: Architecture H3 anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/h3_patch.py
          test "$(sha256sum /tmp/h3_patch.py | awk '{print $1}')" = "1dcc1fa76abd10e148a0fdd055629ad0f5291e356d41b41e4d4e33b6c9b581f9"
          python3 -m py_compile /tmp/h3_patch.py
          python3 /tmp/h3_patch.py
          rm -f /tmp/h3_patch.py
          rm -f "$SELF_PATH"
          test ! -e "$SELF_PATH"
          mapfile -t WORKFLOWS < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          test "$(printf '%s\n' "${WORKFLOWS[@]}")" = $'ci.yml\ne2e-live.yml'
          test -f src/io/year-close-package.ts
          test -f scripts/test-year-close-package.mjs
          grep -q 'app.js?v=1809' index.html
          grep -q 'mietverwaltung-v18-year-close-package-h3-1' service-worker.js
          grep -q 'bis H3 umgesetzt' README.md
          grep -q '### H3: Jahresabschluss-Paket' ARCHITECTURE.md
          git diff --check

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Reproduzierbaren Build prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          APP_SHA_1="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_1="$(sha256sum style.css | awk '{print $1}')"
          npm run build
          APP_SHA_2="$(sha256sum app.js | awk '{print $1}')"
          STYLE_SHA_2="$(sha256sum style.css | awk '{print $1}')"
          test "$APP_SHA_1" = "$APP_SHA_2"
          test "$STYLE_SHA_1" = "$STYLE_SHA_2"
          grep -q 'doppelhaus-year-close-package-v1' app.js
          echo "APP_SHA=$APP_SHA_2" >> "$GITHUB_ENV"
          echo "app.js reproduzierbar: $APP_SHA_2"

      - name: TypeScript und dauerhafte Gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js

      - name: H3-Schichtengrenzen zusätzlich absichern
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          runtime_size=len(Path('src/ui/app-runtime.ts').read_bytes())
          if runtime_size > 171000:
              raise SystemExit(f'app-runtime.ts zu groß: {runtime_size} > 171000')
          if '../io/year-close-package' not in Path('src/ui/year-archive-ui.ts').read_text(encoding='utf-8'):
              raise SystemExit('H3-Paketlogik ist nicht sauber in src/io/ getrennt')
          print(f'app-runtime.ts: {runtime_size} Bytes; H3 bleibt im IO-/UI-Modul.')
          PY2

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dhv-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dhv-http.log
          exit 1

      - name: H3-Jahresabschluss wiederholt im Browser prüfen
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/year-archive.spec.js --repeat-each=3
          npx playwright test tests/navigation-simplified.spec.js --repeat-each=2

      - name: Vollständige E2E-Suite prüfen
        run: npm run test:e2e

      - name: Playwright-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-h3-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Finalen Tree verifizieren
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$SELF_PATH"
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)" = $'ci.yml\ne2e-live.yml'
          grep -q '"test:archive-package"' package.json
          grep -q 'createYearClosePackage' src/io/year-close-package.ts
          grep -q 'yearClosePackageExport' src/ui/year-archive-ui.ts
          grep -q 'jahresabschluss-haus-b-2025-pruefen.zip' tests/year-archive.spec.js
          grep -q 'app.js?v=1809' tests/deployment.spec.js
          grep -q 'mietverwaltung-v18-year-close-package-h3-1' scripts/test-pwa-update.mjs
          git diff --check
          git status --short

      - name: H3 committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Keine H3-Änderungen zum Committen."
            exit 1
          fi
          git commit -m "feat: add Architecture H3 year close package"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          echo "Finaler H3-SHA: $FINAL_SHA"

      - name: Permanente CI und Live-E2E abwarten
        shell: bash
        run: |
          set -euo pipefail
          find_run() {
            local workflow="$1"
            for i in {1..72}; do
              id="$(gh run list --workflow "$workflow" --branch main --limit 40 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha == env.FINAL_SHA) | .databaseId' | head -n1)"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            return 1
          }
          CI_RUN="$(find_run ci.yml)" || { echo "::error::Kein CI-Lauf für $FINAL_SHA gefunden."; exit 1; }
          LIVE_RUN="$(find_run e2e-live.yml)" || { echo "::error::Kein Live-E2E-Lauf für $FINAL_SHA gefunden."; exit 1; }
          echo "CI run: $CI_RUN"
          echo "Live run: $LIVE_RUN"
          gh run watch "$CI_RUN" --exit-status
          gh run watch "$LIVE_RUN" --exit-status
          test "$(gh run view "$CI_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"
          test "$(gh run view "$LIVE_RUN" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$FINAL_SHA success"

      - name: Abschluss
        run: |
          echo "Architecture H3 Jahresabschluss-Paket ist implementiert."
          echo "Finaler SHA: $FINAL_SHA"
          echo "app.js SHA-256: $APP_SHA"
          echo "Permanente CI und Live-E2E sind grün."
