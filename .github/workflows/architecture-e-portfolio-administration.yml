name: Architecture E – Portfolio administration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-e-portfolio-administration
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      E2E_BASE_URL: http://127.0.0.1:4173/

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten E-Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          D_PRODUCT_SHA="80a3806277476b89c553abbac4c0e54eab65ba43"
          test "$(git merge-base HEAD "$D_PRODUCT_SHA")" = "$D_PRODUCT_SHA"
          test "$(git diff --name-only "$D_PRODUCT_SHA" HEAD)" = ".github/workflows/architecture-e-portfolio-administration.yml"
          test -e .github/workflows/architecture-d-presentation-workspace.yml
          test -e .github/workflows/ci.yml
          test -e .github/workflows/e2e-live.yml
          test ! -e src/application/portfolio-admin.ts
          test ! -e src/presentation/portfolio-administration.ts
          test ! -e src/ui/building-workspace-ui.ts
          test ! -e scripts/test-portfolio-administration.mjs
          test ! -e tests/portfolio-administration.spec.js

      - name: Architecture-D Workflow aufräumen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/architecture-d-presentation-workspace.yml
          git commit -m "Remove temporary Architecture D workflow"
          # Absichtlich noch nicht pushen: bei einem E-Testfehler bleibt main unverändert.
          # Der finale Push veröffentlicht Hygiene- und Produktcommit atomar in derselben Ref-Aktualisierung.
          echo "D_HYGIENE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Portfolio-E Patch anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('.')

          def B(value):
              return textwrap.dedent(value).lstrip('\n')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) == 1:
                  write(path, text.replace(old, new, 1))
                  return
              old_d, new_d = B(old), B(new)
              count = text.count(old_d)
              if count != 1:
                  raise SystemExit(f"{path}: erwartete genau 1 Fundstelle, gefunden {count}: {old_d[:120]!r}")
              write(path, text.replace(old_d, new_d, 1))

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              if text.count(start_marker) != 1 or text.count(end_marker) < 1:
                  raise SystemExit(f"{path}: Bereichsanker nicht eindeutig: {start_marker!r} -> {end_marker!r}")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              write(path, text[:start] + replacement + text[end:])

          write('src/application/portfolio-admin.ts', B(r'''
          import { validateArea, validateIsoDate, validateMoney, validateYear } from "../core/validation";
          import { ensurePortfolioModel, validatePortfolioModel } from "../domain/portfolio-model";

          type AnyRecord = Record<string, any>;

          export const PORTFOLIO_ADMIN_VERSION = 1;

          export interface BuildingAdminInput {
            name: string;
            address?: string;
            totalArea: number | string;
            year?: number | string;
            billingTakeoverDate?: string;
            predecessorBillingEnd?: string;
            repayment?: number | string;
            fixed?: number | string;
          }

          interface NormalizedBuildingAdminInput {
            name: string;
            address: string;
            totalArea: number;
            year: number | "";
            billingTakeoverDate: string;
            predecessorBillingEnd: string;
            repayment: number;
            fixed: number;
          }

          const clone = <T>(value: T): T => {
            if (typeof structuredClone === "function") return structuredClone(value);
            return JSON.parse(JSON.stringify(value)) as T;
          };

          function normalizeBuildingInput(input: BuildingAdminInput): NormalizedBuildingAdminInput {
            const name = String(input?.name || "").trim();
            if (!name) throw new Error("Gebäudename fehlt.");

            const area = validateArea(input?.totalArea);
            if (!area.ok || area.value == null) throw new Error(area.message || "Gesamtwohnfläche ist ungültig.");

            const yearText = String(input?.year ?? "").trim();
            let year: number | "" = "";
            if (yearText) {
              const checkedYear = validateYear(yearText);
              if (!checkedYear.ok || checkedYear.value == null) throw new Error(checkedYear.message || "Baujahr ist ungültig.");
              year = checkedYear.value;
            }

            const billingTakeoverDate = String(input?.billingTakeoverDate || "").trim();
            const predecessorBillingEnd = String(input?.predecessorBillingEnd || "").trim();
            for (const [label, value] of [["Übernahmedatum", billingTakeoverDate], ["Voreigentümer-Ende", predecessorBillingEnd]] as const) {
              const checked = validateIsoDate(value);
              if (!checked.ok) throw new Error(`${label}: ${checked.message || "Datum ist ungültig."}`);
            }
            if (billingTakeoverDate && predecessorBillingEnd && predecessorBillingEnd >= billingTakeoverDate) {
              throw new Error("Der Abrechnungszeitraum des Voreigentümers muss vor der eigenen Übernahme enden.");
            }

            const repaymentCheck = validateMoney(input?.repayment ?? 0, { min: 0 });
            const fixedCheck = validateMoney(input?.fixed ?? 0, { min: 0 });
            if (!repaymentCheck.ok) throw new Error(repaymentCheck.message || "Hausrate ist ungültig.");
            if (!fixedCheck.ok) throw new Error(fixedCheck.message || "Feste Hauskosten sind ungültig.");

            return {
              name,
              address: String(input?.address || "").trim(),
              totalArea: area.value,
              year,
              billingTakeoverDate,
              predecessorBillingEnd,
              repayment: Number(repaymentCheck.value || 0),
              fixed: Number(fixedCheck.value || 0)
            };
          }

          function checkedState(value: AnyRecord): AnyRecord {
            const state = ensurePortfolioModel(value);
            const check = validatePortfolioModel(state);
            if (check.errors.length) throw new Error(check.errors.join(" · "));
            return state;
          }

          export function createBuildingInPortfolio(value: AnyRecord, id: string, input: BuildingAdminInput): AnyRecord {
            const state = ensurePortfolioModel(clone(value || {}));
            const buildingId = String(id || "").trim();
            if (!buildingId) throw new Error("Gebäude-ID fehlt.");
            if (state.buildings.some((item: AnyRecord) => String(item?.id || "") === buildingId)) {
              throw new Error("Diese Gebäude-ID existiert bereits.");
            }
            const data = normalizeBuildingInput(input);
            const portfolioId = String(state?.meta?.primaryPortfolioId || state.portfolios?.[0]?.id || "");
            if (!portfolioId) throw new Error("Primäres Portfolio fehlt.");

            state.buildings.push({
              id: buildingId,
              portfolioId,
              name: data.name,
              address: data.address,
              totalArea: data.totalArea,
              year: data.year,
              billingTakeoverDate: data.billingTakeoverDate,
              predecessorBillingEnd: data.predecessorBillingEnd,
              finance: { repayment: data.repayment, fixed: data.fixed },
              source: "portfolio-admin"
            });
            return checkedState(state);
          }

          export function updateBuildingInPortfolio(value: AnyRecord, buildingId: string, input: BuildingAdminInput): AnyRecord {
            const state = ensurePortfolioModel(clone(value || {}));
            const id = String(buildingId || "").trim();
            const index = state.buildings.findIndex((item: AnyRecord) => String(item?.id || "") === id);
            if (index < 0) throw new Error("Gebäude wurde nicht gefunden.");
            const data = normalizeBuildingInput(input);
            const prior = state.buildings[index];
            state.buildings[index] = {
              ...prior,
              id: prior.id,
              portfolioId: prior.portfolioId,
              name: data.name,
              address: data.address,
              totalArea: data.totalArea,
              year: data.year,
              billingTakeoverDate: data.billingTakeoverDate,
              predecessorBillingEnd: data.predecessorBillingEnd,
              finance: { ...(prior.finance || {}), repayment: data.repayment, fixed: data.fixed }
            };

            if (id === String(state?.meta?.primaryBuildingId || "")) {
              state.property = {
                ...(state.property || {}),
                name: data.name,
                address: data.address,
                totalArea: data.totalArea,
                year: data.year,
                billingTakeoverDate: data.billingTakeoverDate,
                predecessorBillingEnd: data.predecessorBillingEnd
              };
              state.finance = { ...(state.finance || {}), repayment: data.repayment, fixed: data.fixed };
            }
            return checkedState(state);
          }
          '''))

          replace_once(
              'src/application/index.ts',
              'export * from "./command-bus";\n',
              'export * from "./command-bus";\nexport * from "./portfolio-admin";\n'
          )

          write('src/presentation/portfolio-administration.ts', B(r'''
          import { portfolioNavigation, queryBuildingWorkspace } from "../application";

          type AnyRecord = Record<string, any>;

          export const PORTFOLIO_ADMIN_PRESENTATION_VERSION = 1;

          export interface PortfolioAdministrationBuilding {
            id: string;
            name: string;
            address: string;
            totalArea: number;
            year: string;
            primary: boolean;
            active: boolean;
            counts: {
              units: number;
              tenancies: number;
              meters: number;
              sources: number;
              costPositions: number;
              payments: number;
            };
          }

          export interface PortfolioAdministrationModel {
            portfolioId: string;
            portfolioName: string;
            activeBuildingId: string;
            primaryBuildingId: string;
            buildings: PortfolioAdministrationBuilding[];
          }

          export function createPortfolioAdministrationModel(state: AnyRecord, activeBuildingId = ""): PortfolioAdministrationModel {
            const nav = portfolioNavigation(state);
            const primaryBuildingId = String(state?.meta?.primaryBuildingId || nav.buildings[0]?.id || "");
            const active = String(activeBuildingId || nav.activeBuildingId || primaryBuildingId);
            return {
              portfolioId: String(nav.portfolio?.id || ""),
              portfolioName: String(nav.portfolio?.name || "Privatbestand"),
              activeBuildingId: active,
              primaryBuildingId,
              buildings: nav.buildings.map((building: AnyRecord) => {
                const id = String(building.id || "");
                const workspace = queryBuildingWorkspace(state, { buildingId: id });
                return {
                  id,
                  name: String(building.name || building.address || "Gebäude"),
                  address: String(building.address || ""),
                  totalArea: Number(building.totalArea || 0),
                  year: String(building.year || ""),
                  primary: id === primaryBuildingId,
                  active: id === active,
                  counts: {
                    units: workspace.units.length,
                    tenancies: workspace.tenancies.length,
                    meters: workspace.meters.length,
                    sources: workspace.sources.length,
                    costPositions: workspace.costPositions.length,
                    payments: workspace.payments.length
                  }
                };
              })
            };
          }
          '''))

          replace_once(
              'src/presentation/index.ts',
              'export * from "./building-workspace";\n',
              'export * from "./building-workspace";\nexport * from "./portfolio-administration";\n'
          )

          write('src/ui/building-workspace-ui.ts', B(r'''
          type AnyRecord = Record<string, any>;

          declare const AppApplication: {
            createBuildingInPortfolio: (state: AnyRecord, id: string, input: AnyRecord) => AnyRecord;
            updateBuildingInPortfolio: (state: AnyRecord, id: string, input: AnyRecord) => AnyRecord;
          };
          declare const AppPresentation: {
            createPresentationWorkspace: (state: AnyRecord, buildingId?: string) => AnyRecord;
            createPortfolioAdministrationModel: (state: AnyRecord, buildingId?: string) => AnyRecord;
            resolveActiveBuildingId: (state: AnyRecord, buildingId?: string) => string;
          };
          declare const $: (id: string) => HTMLElement | null;
          declare const esc: (value: unknown) => string;
          declare const formField: (options: AnyRecord) => string;
          declare const modal: (title: string, html: string, onReady?: () => void) => void;
          declare const closeModal: (force?: boolean) => boolean;
          declare const uid: () => string;
          declare const cloneState: <T>(value: T) => T;
          declare const repairDomainState: (value: AnyRecord) => AnyRecord;
          declare const persist: (action?: string | null, detail?: string | null) => Promise<boolean>;
          declare const projectActiveState: (master: AnyRecord, requested?: string) => AnyRecord;
          declare const render: () => void;
          declare let portfolioState: AnyRecord;
          declare let activeBuildingId: string;
          declare let state: AnyRecord;
          declare let LAST_STABLE_STATE: AnyRecord | null;

          const element = <T extends HTMLElement>(id: string): T | null => $(id) as T | null;

          function activateBuilding(next: string): void {
            activeBuildingId = AppPresentation.resolveActiveBuildingId(portfolioState, next);
            state = projectActiveState(portfolioState, activeBuildingId);
            LAST_STABLE_STATE = cloneState(state);
            render();
            window.scrollTo({ top: 0, left: 0, behavior: "auto" });
          }

          async function persistPortfolioMutation(next: AnyRecord, action: string, detail: string, targetBuildingId: string): Promise<boolean> {
            const previousPortfolio = cloneState(portfolioState);
            const previousState = cloneState(state);
            const previousActive = activeBuildingId;
            const previousStable = LAST_STABLE_STATE ? cloneState(LAST_STABLE_STATE) : null;
            portfolioState = repairDomainState(next);
            activeBuildingId = AppPresentation.resolveActiveBuildingId(portfolioState, targetBuildingId || previousActive);
            state = projectActiveState(portfolioState, activeBuildingId);
            const ok = await persist(action, detail);
            if (!ok) {
              portfolioState = previousPortfolio;
              state = previousState;
              activeBuildingId = previousActive;
              LAST_STABLE_STATE = previousStable;
              render();
            }
            return ok;
          }

          export function renderBuildingSwitcher(): void {
            const wrap = element<HTMLElement>("buildingSwitchWrap");
            const select = element<HTMLSelectElement>("buildingSelect");
            if (!wrap || !select) return;
            const model = AppPresentation.createPresentationWorkspace(portfolioState, activeBuildingId);
            wrap.classList.toggle("hidden", !model.showBuildingSelector);
            if (!model.showBuildingSelector) {
              select.innerHTML = "";
              return;
            }
            select.innerHTML = model.buildings
              .map((item: AnyRecord) => `<option value="${esc(item.id)}" ${item.active ? "selected" : ""}>${esc(item.name)}</option>`)
              .join("");
            select.onchange = () => {
              const next = select.value;
              if (next === activeBuildingId) return;
              if (!closeModal(false)) {
                select.value = activeBuildingId;
                return;
              }
              activateBuilding(next);
            };
          }

          function buildingInput(form: HTMLFormElement): AnyRecord {
            const values = Object.fromEntries(new FormData(form));
            return {
              name: String(values.name || "").trim(),
              address: String(values.address || "").trim(),
              totalArea: String(values.totalArea || "").trim(),
              year: String(values.year || "").trim(),
              billingTakeoverDate: String(values.billingTakeoverDate || "").trim(),
              predecessorBillingEnd: String(values.predecessorBillingEnd || "").trim(),
              repayment: String(values.repayment || "0").trim(),
              fixed: String(values.fixed || "0").trim()
            };
          }

          function openBuildingEditor(buildingId = ""): void {
            const master = portfolioState;
            const existing = (master.buildings || []).find((item: AnyRecord) => String(item.id || "") === buildingId) || null;
            const finance = existing?.finance || {};
            modal(existing ? "Gebäude bearbeiten" : "Gebäude hinzufügen", `<form id="buildingAdminForm" class="form-grid">
              ${formField({ name: "name", label: "Gebäudename", value: existing?.name || "", placeholder: "z. B. Haus B" })}
              ${formField({ name: "address", label: "Adresse", value: existing?.address || "", placeholder: "Straße, Hausnummer, Ort", full: true })}
              ${formField({ name: "totalArea", label: "Gesamtwohnfläche m²", type: "number", step: "0.01", min: 0, value: existing?.totalArea || "" })}
              ${formField({ name: "year", label: "Baujahr", type: "number", min: 1800, value: existing?.year || "" })}
              ${formField({ name: "billingTakeoverDate", label: "Abrechnung übernommen am", type: "date", value: existing?.billingTakeoverDate || "" })}
              ${formField({ name: "predecessorBillingEnd", label: "Voreigentümer rechnet bis", type: "date", value: existing?.predecessorBillingEnd || "" })}
              ${formField({ name: "repayment", label: "Hausrate € / Monat", type: "number", step: "0.01", min: 0, value: finance.repayment ?? 0 })}
              ${formField({ name: "fixed", label: "Feste Hauskosten € / Monat", type: "number", step: "0.01", min: 0, value: finance.fixed ?? 0 })}
              <div class="full form-actions"><button class="primary">${existing ? "Gebäude speichern" : "Gebäude anlegen"}</button></div>
            </form>`, () => {
              const form = element<HTMLFormElement>("buildingAdminForm");
              if (!form) return;
              form.onsubmit = async (event) => {
                event.preventDefault();
                const input = buildingInput(form);
                try {
                  const targetId = existing ? String(existing.id) : uid();
                  const next = existing
                    ? AppApplication.updateBuildingInPortfolio(portfolioState, targetId, input)
                    : AppApplication.createBuildingInPortfolio(portfolioState, targetId, input);
                  const targetBuildingId = existing ? activeBuildingId : targetId;
                  const ok = await persistPortfolioMutation(
                    next,
                    existing ? "Gebäude geändert" : "Gebäude angelegt",
                    input.name,
                    targetBuildingId
                  );
                  if (!ok) return;
                  closeModal(true);
                  render();
                } catch (error: any) {
                  alert(String(error?.message || error));
                }
              };
            });
          }

          export function openBuildingManager(): void {
            const model = AppPresentation.createPortfolioAdministrationModel(portfolioState, activeBuildingId);
            modal("Gebäude verwalten", `<div class="card">
              <div class="row between"><div><p class="eyebrow">${esc(model.portfolioName)}</p><h3>Gebäude im Portfolio</h3><p class="muted">Das Primärgebäude bleibt fachlich unverändert. „Öffnen“ wechselt nur den aktuellen Arbeitsbereich.</p></div><button id="addBuildingAdmin" class="primary">Gebäude hinzufügen</button></div>
            </div>
            ${model.buildings.map((item: AnyRecord) => `<div class="item"><div class="row between"><div><div class="item-title-row"><h3>${esc(item.name)}</h3>${item.primary ? '<span class="pill good">Primär</span>' : ''}${item.active ? '<span class="pill">Aktiv</span>' : ''}</div><p>${esc(item.address || "Adresse fehlt")}</p><small>${Number(item.totalArea || 0).toLocaleString("de-DE")} m²${item.year ? ` · Baujahr ${esc(item.year)}` : ""} · ${item.counts.units} Einheiten · ${item.counts.tenancies} Mietverhältnisse</small></div><div class="item-actions"><button class="secondary" data-building-open="${esc(item.id)}">Öffnen</button><button class="secondary" data-building-edit="${esc(item.id)}">Bearbeiten</button></div></div></div>`).join("")}`, () => {
              const add = element<HTMLButtonElement>("addBuildingAdmin");
              if (add) add.onclick = () => openBuildingEditor();
              document.querySelectorAll<HTMLElement>("[data-building-open]").forEach((button) => {
                button.onclick = () => {
                  const id = button.dataset.buildingOpen || "";
                  closeModal(true);
                  activateBuilding(id);
                };
              });
              document.querySelectorAll<HTMLElement>("[data-building-edit]").forEach((button) => {
                button.onclick = () => openBuildingEditor(button.dataset.buildingEdit || "");
              });
            });
          }
          '''))

          replace_once(
              'scripts/build-app.mjs',
              '    compileModule("src/ui/ui-core.ts", "AppUiCore")\n',
              '    compileModule("src/ui/ui-core.ts", "AppUiCore"),\n    compileModule("src/ui/building-workspace-ui.ts", "AppBuildingWorkspaceUi")\n'
          )

          replace_once(
              'tsconfig.json',
              '    "src/infrastructure/**/*.ts",\n    "src/ui/**/*.ts"\n',
              '    "src/infrastructure/**/*.ts",\n    "src/application/**/*.ts",\n    "src/presentation/**/*.ts",\n    "src/ui/**/*.ts"\n'
          )

          replace_once(
              'package.json',
              '    "test:architecture": "node scripts/test-architecture.mjs && npm run test:portfolio && npm run test:repository && npm run test:application && npm run test:presentation",\n',
              '    "test:architecture": "node scripts/test-architecture.mjs && npm run test:portfolio && npm run test:repository && npm run test:application && npm run test:presentation && npm run test:portfolio-admin",\n'
          )
          replace_once(
              'package.json',
              '    "test:presentation": "node scripts/test-presentation-layer.mjs"\n',
              '    "test:presentation": "node scripts/test-presentation-layer.mjs",\n    "test:portfolio-admin": "node scripts/test-portfolio-administration.mjs"\n'
          )

          replace_between(
              'src/ui/app-runtime.ts',
              'function renderBuildingSwitcher(){\n',
              'function nav(){\n',
              ''
          )
          replace_once(
              'src/ui/app-runtime.ts',
              '  renderBuildingSwitcher();\n',
              '  AppBuildingWorkspaceUi.renderBuildingSwitcher();\n'
          )
          replace_once(
              'src/ui/app-runtime.ts',
              '<div class="card-head"><div><p class="eyebrow">STAMMDATEN</p><h3>Objekt & Einheiten</h3></div><button class="secondary compact" id="editPropertyOverview">Objektdaten bearbeiten</button></div>',
              '<div class="card-head"><div><p class="eyebrow">STAMMDATEN</p><h3>Objekt & Einheiten</h3></div><div class="row"><button class="secondary compact" id="manageBuildingsOverview">Gebäude verwalten</button><button class="secondary compact" id="editPropertyOverview">Objektdaten bearbeiten</button></div></div>'
          )
          replace_once(
              'src/ui/app-runtime.ts',
              '  $("editPropertyOverview").onclick=()=>goSub("data","property");\n  $("editUnitsOverview").onclick=()=>goSub("data","units");\n',
              '  $("manageBuildingsOverview").onclick=()=>AppBuildingWorkspaceUi.openBuildingManager();\n  $("editPropertyOverview").onclick=()=>goSub("data","property");\n  $("editUnitsOverview").onclick=()=>goSub("data","units");\n'
          )

          write('scripts/test-portfolio-administration.mjs', B(r'''
          import assert from "node:assert/strict";
          import { build } from "esbuild";

          async function load(entry) {
            const compiled = await build({
              entryPoints: [entry],
              bundle: true,
              write: false,
              format: "esm",
              platform: "node",
              target: "node22",
              logLevel: "silent"
            });
            const source = compiled.outputFiles[0].text;
            return import(`data:text/javascript;base64,${Buffer.from(source).toString("base64")}`);
          }

          const application = await load("src/application/index.ts");
          const presentation = await load("src/presentation/index.ts");

          function fixture() {
            return {
              schemaVersion: 15,
              meta: { primaryPortfolioId: "portfolio-1", primaryBuildingId: "building-a", revision: 4 },
              property: { name: "Haus A", address: "A-Straße 1", totalArea: 180, year: 1990 },
              finance: { repayment: 900, fixed: 20 },
              portfolios: [{ id: "portfolio-1", name: "Privatbestand", kind: "private" }],
              buildings: [{ id: "building-a", portfolioId: "portfolio-1", name: "Haus A", address: "A-Straße 1", totalArea: 180, year: 1990, finance: { repayment: 900, fixed: 20 } }],
              units: [{ id: "unit-a", buildingId: "building-a", name: "Wohnung A", type: "rental", area: 80 }],
              leases: [{ id: "lease-a", unitId: "unit-a", buildingId: "building-a", rent: 700 }],
              meters: [], sources: [], costPositions: [], tasks: [], payments: [], waterSettlements: [], billingWorkflows: [], billingSnapshots: [], containers: [], water: []
            };
          }

          const original = fixture();
          const created = application.createBuildingInPortfolio(original, "building-b", {
            name: "Haus B",
            address: "B-Straße 2",
            totalArea: 210,
            year: 2001,
            billingTakeoverDate: "2026-07-01",
            predecessorBillingEnd: "2026-06-30",
            repayment: 700,
            fixed: 12
          });

          assert.equal(application.PORTFOLIO_ADMIN_VERSION, 1);
          assert.equal(original.buildings.length, 1, "Use-Case darf Eingabe-State nicht mutieren");
          assert.equal(created.buildings.length, 2);
          assert.equal(created.meta.primaryBuildingId, "building-a", "Anlegen darf das Primärgebäude nicht umdefinieren");
