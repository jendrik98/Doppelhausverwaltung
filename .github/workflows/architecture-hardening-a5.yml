name: Architecture hardening A5 – Production code only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-hardening-a5
  cancel-in-progress: false

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Exakten Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c10d417f4603b8d88dd1586eddd5d6f12c6e5e3c"
          test "$(git rev-parse HEAD^^)" = "b5c6d62e3619d669e73c532d4adb0dc288532b10"
          test "$(git rev-parse HEAD^^^)" = "e8e7605049dd28b4d00ea53d1b7e110e092f19bf"
          test "$(git rev-parse HEAD^^^^)" = "25e42c2b1906ec52b4adbb2315c51bede79df017"
          test "$(git rev-parse HEAD^^^^^)" = "909705bd16c871a1da464819563e9fcaf4be3ea6"
          test "$(git diff --name-only HEAD^^^^^ HEAD^^^^)" = ".github/workflows/architecture-hardening-a.yml"
          test "$(git diff --name-only HEAD^^^^ HEAD^^^)" = ".github/workflows/architecture-hardening-a2.yml"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = ".github/workflows/architecture-hardening-a3.yml"
          test "$(git diff --name-only HEAD^^ HEAD^)" = ".github/workflows/architecture-hardening-a4.yml"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/architecture-hardening-a5.yml"
          test "$(git hash-object .github/workflows/architecture-hardening-a3.yml)" = "4d1c2272a097eaf66278d5e671e8f318c30fccd7"

      - name: Geprüften A3-Patch ohne Workflow-Änderungen anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          source = Path('.github/workflows/architecture-hardening-a3.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*PATCH_B64:\s*(\S+)\s*$', source, flags=re.MULTILINE)
          if not match:
              raise SystemExit('FEHLER: PATCH_B64 wurde im geprüften A3-Workflow nicht gefunden.')
          patch = base64.b64decode(match.group(1)).decode('utf-8')
          old_workflow = "WORKFLOW=Path('.github/workflows/architecture-hardening-a3.yml')"
          new_workflow = "WORKFLOW=Path('.github/workflows/architecture-hardening-a5.yml')"
          old_baseline = "BASELINE='e8e7605049dd28b4d00ea53d1b7e110e092f19bf'"
          new_baseline = "BASELINE='c10d417f4603b8d88dd1586eddd5d6f12c6e5e3c'"
          if patch.count(old_workflow) != 1 or patch.count(old_baseline) != 1:
              raise SystemExit('FEHLER: geprüfter A3-Patch besitzt nicht die erwarteten A5-Anker.')
          patch = patch.replace(old_workflow, new_workflow).replace(old_baseline, new_baseline)
          patch = patch.replace('Hardening A3 erwartet', 'Hardening A5 erwartet')
          Path('/tmp/hardening_a5.py').write_text(patch, encoding='utf-8')
          PY
          python3 -m py_compile /tmp/hardening_a5.py
          python3 /tmp/hardening_a5.py

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build und statische Qualitätsgates
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
          node --check app.js
          node --check service-worker.js
          node --check scripts/build-app.mjs
          node --check scripts/test-architecture.mjs
          node --check scripts/test-quality.mjs
          node --check scripts/test-pwa-update.mjs

      - name: Reproduzierbaren Build verifizieren
        shell: bash
        run: |
          set -euo pipefail
          cp app.js /tmp/app-first.js
          npm run build
          cmp -s /tmp/app-first.js app.js

      - name: Änderungsumfang ohne Workflows prüfen
        shell: bash
        run: |
          set -euo pipefail
          # Bis hierhin wurden die neuen Workflow-Verträge bereits durch test:pwa geprüft.
          # Für den Push werden Workflow-Dateien nun exakt auf HEAD zurückgesetzt,
          # weil der Actions-Token keine workflows-Berechtigung besitzt.
          git checkout HEAD -- .github/workflows
          git clean -fd .github/workflows
          test -z "$(git diff --name-only HEAD -- .github/workflows)"
          test -z "$(git ls-files --others --exclude-standard .github/workflows)"
          git add -A
          git diff --cached --check
          mapfile -t ACTUAL < <(git diff --cached --name-only | sort)
          EXPECTED=(
            "ARCHITECTURE.md"
            "app.js"
            "index.html"
            "package.json"
            "scripts/test-architecture.mjs"
            "scripts/test-pwa-update.mjs"
            "scripts/test-quality.mjs"
            "service-worker.js"
            "src/ui/app-runtime.ts"
            "tests/deployment.spec.js"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          printf 'Geändert:\n'; printf '  %s\n' "${ACTUAL[@]}"
          diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          if printf '%s\n' "${ACTUAL[@]}" | grep -q '^\.github/workflows/'; then
            echo 'FEHLER: Workflow-Datei würde im A5-Abschlusscommit geändert.'
            exit 1
          fi
          git reset

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: PDF-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Lokalen Server starten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mietverwaltung-http.log 2>&1 &
          echo $! > /tmp/mietverwaltung-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mietverwaltung-http.log
          exit 1

      - name: Exakte 25 lokale E2E-Tests
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          set +e
          npx playwright test --retries=0 --reporter=json > /tmp/playwright.json
          PW_EXIT=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/playwright.json','utf8'));
          const s=r.stats||{};
          const total=Number(s.expected||0)+Number(s.unexpected||0)+Number(s.flaky||0)+Number(s.skipped||0);
          console.log(`Playwright: total=${total}, passed=${s.expected||0}, failed=${s.unexpected||0}, flaky=${s.flaky||0}, skipped=${s.skipped||0}`);
          function walk(suites,prefix=[]){
            for(const suite of suites||[]){
              const next=suite.title?[...prefix,suite.title]:prefix;
              for(const spec of suite.specs||[]){
                for(const test of spec.tests||[]){
                  if(test.status==='unexpected' || (test.results||[]).some(x=>x.status==='failed'||x.status==='timedOut')){
                    console.error(`FEHLERTEST: ${[...next,spec.title].filter(Boolean).join(' › ')}`);
                    for(const result of test.results||[])for(const error of result.errors||[])console.error(error.message||String(error));
                  }
                }
              }
              walk(suite.suites||[],next);
            }
          }
          walk(r.suites||[]);
          if(total!==25||Number(s.expected)!==25||Number(s.unexpected)!==0||Number(s.flaky)!==0||Number(s.skipped)!==0)process.exit(1);
          NODE
          test "$PW_EXIT" -eq 0

      - name: Abschlussinvarianten prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'APP_VERSION="18.0.0"' app.js
          grep -Fq 'mietverwaltung-v6' app.js
          grep -Fq 'DB_VERSION = 2' src/core/persistence.ts
          grep -Fq 'mietverwaltung_webauthn' src/core/auth.ts
          grep -Fq 'mietverwaltung-full-backup-v2' app.js
          grep -Fq 'mietverwaltung-encrypted-v1' app.js
          test ! -d src/legacy
          grep -Fq 'app.js?v=1801' tests/deployment.spec.js
          grep -Fq 'style.css?v=1810p2' tests/deployment.spec.js
          grep -Fq 'manifest.webmanifest?v=1810p2' tests/deployment.spec.js
          grep -Fq 'mietverwaltung-v18-prod-hardening-a-1' tests/deployment.spec.js
          ! grep -Fq 'app.js?v=1800' tests/deployment.spec.js
          ! grep -Fq 'mietverwaltung-v18-phase2-calendar-validation-4' tests/deployment.spec.js
          test -z "$(git diff --name-only HEAD -- .github/workflows)"

      - name: Commit und Push ohne Workflow-Dateien
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'FEHLER: Sicherheitsstopp – Workflow-Datei ist gestaged.'
            exit 1
          fi
          git commit -m "Harden PWA updates and production quality gates"
          git push origin HEAD:main
