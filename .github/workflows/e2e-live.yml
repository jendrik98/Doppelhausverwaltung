name: Live E2E – Mietverwaltung

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'legal-rules.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/e2e-live.yml'

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://jendrik98.github.io/Doppelhausverwaltung/
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: E2E-Abhängigkeiten installieren
        run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: PDF-Prüfwerkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Auf exaktes Live-Deployment warten
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum app.js | awk '{print $1}')"
          echo "Erwarte app.js SHA-256 ${EXPECTED_SHA} von Commit ${GITHUB_SHA}."
          for i in {1..60}; do
            TMP="$(mktemp)"
            if curl -fsSL --max-time 15 "${E2E_BASE_URL}app.js?deploy=${GITHUB_SHA}-${i}" -o "$TMP"; then
              LIVE_SHA="$(sha256sum "$TMP" | awk '{print $1}')"
              rm -f "$TMP"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                echo "Exaktes Live-Deployment ist verfügbar."
                exit 0
              fi
              echo "Noch nicht aktuell ($i/60): live=${LIVE_SHA}, erwartet=${EXPECTED_SHA}"
            else
              rm -f "$TMP"
              echo "Live-Datei noch nicht abrufbar ($i/60)."
            fi
            sleep 10
          done
          echo "Das exakte app.js dieses Commits wurde innerhalb von 10 Minuten nicht gefunden."
          exit 1
      - name: Preflight-Verträge prüfen
        run: |
          npm run typecheck
          npm run test:validation
          npm run test:architecture
          npm run test:quality
          npm run test:pwa
      - name: Echter Browser-E2E-Test
        run: npm run test:e2e
      - name: Playwright-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
