<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mietverwaltung">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Mietverwaltung</title>
</head>
<body>
<header class="topbar">
  <div>
    <h1>Mietverwaltung</h1>
    <span class="subtitle">Haus & Vermietung</span>
  </div>
  <div class="top-actions"><span id="connectionState" class="connection-pill" aria-live="polite"></span>
    <button id="searchBtn" class="ghost">Suchen</button>
    <button id="quickBtn" class="ghost">＋</button>
  </div>
</header>

<main id="app"></main>

<nav class="main-tabs" aria-label="Hauptnavigation">
  <button data-route="home" class="active">Übersicht</button>
  <button data-route="data">Daten</button>
  <button data-route="rental">Vermietung</button>
  <button data-route="owner">Eigener Bereich</button>
  <button data-route="more">Mehr</button>
</nav>

<div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="row between">
      <h2 id="modalTitle">Bearbeiten</h2>
      <button id="modalClose" class="secondary">Schließen</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="searchOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Suche">
  <div class="sheet">
    <div class="row between">
      <h2>Suche</h2>
      <button id="searchClose" class="secondary">Schließen</button>
    </div>
    <input id="searchInput" class="big-input" placeholder="Grundsteuer, Wasser, Vertrag, Dokument …">
    <div id="searchResults"></div>
  </div>
</div>

<div id="quickOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Schnell hinzufügen">
  <div class="sheet">
    <div class="row between">
      <h2>Schnell hinzufügen</h2>
      <button id="quickClose" class="secondary">Schließen</button>
    </div>
    <div class="quick-grid">
      <button data-quick="source">Kostenquelle</button>
      <button data-quick="assessment">Grundbesitzabgaben</button>
      <button data-quick="water">Kaltwasser</button>
      <button data-quick="task">Erinnerung</button>
      <button data-quick="document">Dokument</button>
      <button data-quick="lease">Mietvertrag</button>
    </div>
  </div>
</div>

<script>
window.addEventListener("error",function(e){
  const host=document.getElementById("app");
  if(host && !host.innerHTML.trim()){
    host.innerHTML='<section><div class="legal-bad"><h2>Startfehler</h2><p>'+String(e.message||"Unbekannter Fehler")+'</p></div></section>';
  }
});
window.addEventListener("unhandledrejection",function(e){
  const host=document.getElementById("app");
  if(host && !host.innerHTML.trim()){
    const m=e.reason&&e.reason.message?e.reason.message:String(e.reason||"Unbekannter Fehler");
    host.innerHTML='<section><div class="legal-bad"><h2>Startfehler</h2><p>'+m+'</p></div></section>';
  }
});
</script>
<script defer src="app.js?v=1300"></script>
</body>
</html>
