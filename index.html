<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mietverwaltung">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Mietverwaltung</title>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 20v-6h6v6"/></svg>
    </div>
    <div>
      <h1>Mietverwaltung</h1>
      <span id="pageContext" class="subtitle">Start</span>
    </div>
  </div>
  <div class="top-actions">
    <span id="connectionState" class="connection-pill" aria-live="polite"></span>
    <button id="searchBtn" class="icon-action" aria-label="Suchen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span class="action-label">Suchen</span>
    </button>
    <button id="quickBtn" class="icon-action primary-action" aria-label="Schnell hinzufügen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="action-label">Neu</span>
    </button>
  </div>
</header>

<main id="app"></main>

<nav class="main-tabs" aria-label="Hauptnavigation">
  <button data-route="home" class="active" aria-label="Start">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 20v-6h6v6"/></svg>
    <span>Start</span>
  </button>
  <button data-route="rental" aria-label="Vermietung">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12"/><path d="M8 20v-5h8v5M8 10h.01M16 10h.01"/></svg>
    <span>Vermietung</span>
  </button>
  <button data-route="data" aria-label="Haus">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V5h14v16M9 9h2M13 9h2M9 13h2M13 13h2M10 21v-4h4v4"/></svg>
    <span>Haus</span>
  </button>
  <button data-route="owner" aria-label="Finanzen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16v11H4z"/><path d="M4 10h16M16 15h2"/></svg>
    <span>Finanzen</span>
  </button>
  <button data-route="more" aria-label="Mehr">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="row between sheet-head"><h2 id="modalTitle">Bearbeiten</h2><button id="modalClose" class="close-action" aria-label="Schließen">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="searchOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Suche">
  <div class="sheet">
    <div class="row between sheet-head"><div><p class="eyebrow">SUCHEN</p><h2>In der Verwaltung suchen</h2></div><button id="searchClose" class="close-action" aria-label="Schließen">×</button></div>
    <input id="searchInput" class="big-input" placeholder="Dokument, Zahlung, Zähler, Vertrag …">
    <div id="searchResults"></div>
  </div>
</div>

<div id="quickOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Schnellaktion">
  <div class="sheet">
    <div class="row between sheet-head">
      <div><p class="eyebrow">SCHNELLAKTION</p><h2>Was möchtest du erfassen?</h2></div>
      <button id="quickClose" class="close-action" aria-label="Schließen">×</button>
    </div>
    <div class="quick-grid">
      <button data-quick="document"><strong>Dokument</strong><small>Foto, Scan oder PDF</small></button>
      <button data-quick="meter"><strong>Zählerstand</strong><small>Per Foto oder manuell</small></button>
      <button data-quick="payment"><strong>Zahlung</strong><small>Einnahme oder Ausgabe</small></button>
      <button data-quick="lease"><strong>Mietvertrag</strong><small>Vertragsdaten öffnen</small></button>
      <button data-quick="source"><strong>Kostenquelle</strong><small>Bescheid, Rechnung, Vertrag</small></button>
      <button data-quick="task"><strong>Erinnerung</strong><small>Termin oder Pflicht</small></button>
    </div>
  </div>
</div>

<script>
window.addEventListener("error",function(e){
  const host=document.getElementById("app");
  if(host && !host.innerHTML.trim()){
    host.innerHTML='<section><div class="legal-bad"><h2>Startfehler</h2><p>'+String(e.message||"Unbekannter Fehler")+'</p></div></section>';
  }
});
window.addEventListener("unhandledrejection",function(e){
  const host=document.getElementById("app");
  if(host && !host.innerHTML.trim()){
    const m=e.reason&&e.reason.message?e.reason.message:String(e.reason||"Unbekannter Fehler");
    host.innerHTML='<section><div class="legal-bad"><h2>Startfehler</h2><p>'+m+'</p></div></section>';
  }
});
</script>
<script defer src="app.js?v=1400"></script>
</body>
</html>
